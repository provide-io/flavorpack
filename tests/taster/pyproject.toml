[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taster"
dynamic = ["version"]
description = "Test package for flavor functionality"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Tim Perkins", email = "code@tim.life" },
]
maintainers = [
    { name = "provide.io", email = "code@provide.io" },
]
dependencies = [
    # grpcio has no win_arm64 binary wheel; use reduced extras on that platform
    "provide-foundation[all]; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "provide-foundation[cli,compression,crypto,transport,platform]; sys_platform == 'win32' and platform_machine == 'ARM64'",
    # exec-test calls build_package_from_manifest() which requires these pinned build
    # backends in the workenv via importlib_metadata (must match flavorpack's pins)
    "setuptools==82.0.1",
    "wheel==0.46.3",
]

[project.scripts]
taster = "taster.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["taster*"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.flavor]
name = "taster"
version = "1.0.0"
entry_point = "taster.cli:main"

[tool.flavor.build]
dependencies = ["../.."]

[tool.flavor.execution]
# Runtime environment configuration for testing
[tool.flavor.execution.runtime]
[tool.flavor.execution.runtime.env]
# Default: clean environment with essentials only
unset = ["*"]
pass = [
    "PATH",
    "HOME",
    "USER",
    "TERM",
    "LANG",
    "LC_*",
    "FLAVOR_*",
    "TASTER_*",  # Allow taster-specific vars
    "KEEP_*",    # For testing preservation
    # Windows home directory variables (needed for Path.home() on Windows)
    "USERPROFILE",
    "HOMEDRIVE",
    "HOMEPATH",
    "APPDATA",
    "LOCALAPPDATA",
    # Windows system variables (needed for DLL loading, subprocesses, temp files)
    "SystemRoot",
    "SystemDrive",
    "WINDIR",
    "TEMP",
    "TMP",
    "PATHEXT",
    "COMSPEC",
    "NUMBER_OF_PROCESSORS",
    "PROCESSOR_ARCHITECTURE",
    "PROCESSOR_ARCHITEW6432",
    "OS"
]
set = { "TASTER_MODE" = "test", "TASTER_VERSION" = "1.0.0", "PYTHONIOENCODING" = "utf-8", "PYTHONUTF8" = "1" }
# Example mapping for testing
map = { "OLD_VAR" = "NEW_VAR" }

[tool.uv]
# cffi 1.x has no win_arm64 binary wheel; cffi>=2.0.0 provides win_arm64
# wheels and matches the constraint already in flavorpack's pyproject.toml
constraint-dependencies = ["cffi>=2.0.0"]

[dependency-groups]
dev = [
    "provide-testkit[standard,build]",
    "hypothesis>=6.138.14",
]
docs = [
    "provide-testkit[docs]",
]
