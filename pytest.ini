[tool:pytest]
# PyTest configuration for PSPF integration tests
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --junitxml=reports/junit.xml
    --html=reports/report.html
    --self-contained-html
markers =
    unit: Fast, isolated unit tests
    integration: Integration tests requiring multiple components
    slow: Slow running tests (>5s)
    security: Security-specific tests
    mmap: Memory-mapped file tests
    helpers: Helper binary tests (Go/Rust)
    taster: Taster-specific tests
    packaging: Package building and verification tests
    cross_language: Tests involving Go/Rust/Python interaction
    stress: Stress and hypothesis-based property tests
    platform_specific: Platform-dependent tests (OS-specific)
    terraform: Terraform-related tests
    error_handling: Error handling and recovery tests
    comprehensive: Comprehensive system tests
    requires_helpers: Tests that need Go/Rust helpers built
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning