#
# flavor/pyproject.toml
#

[project]
name = "flavorpack"
description = "Flavor Pack packaging system implementing Progressive Secure Package Format (PSPF/2025)"
dynamic = ["version"]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Tim Perkins", email = "code@tim.life" },
]
maintainers = [
    { name = "provide.io", email = "code@provide.io" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Archiving :: Packaging",
]
dependencies = [
    "attrs>=23.1.0",
    "click>=8.1.7",
    "cryptography>=41.0.4",
    "wheel>=0.40.0",
    "PyYAML>=6.0",
    "uv>=0.8.13",
    "provide-foundation>=0.0.0.dev0",
]
keywords = ["packaging", "pspf", "flavor", "executable", "bundle"]

[project.urls]
Homepage = "https://github.com/provide-io/flavor"

[dependency-groups]
dev = [
    "black>=23.9.1",
    "coverage>=7.3.2",
    "mypy>=1.5.1",
    "pre-commit>=3.5.0",
    "pytest>=7.4.2",
    "pytest-cov>=4.1.0",
    "pytest-json-report>=1.5.0",
    "ruff>=0.1.0",
    "types-attrs>=19.1.0",
    "types-click>=7.1.8",
    "bandit>=1.8.3",
    "hypothesis>=6.131.0",
    "pytest-asyncio>=0.25.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.6.0",
    "twine>=6.0.0",
    "types-protobuf>=6.30.2.20250516",
    "psutil>=5.9.0",
    "behave>=1.3.1",
    "ty>=0.0.1a19",
    "pytest-timeout>=2.4.0",
]

docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.26.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.0",
    "mkdocs-section-index>=0.3.0",
    "mkdocs-autorefs>=1.2.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
    "mkdocs-macros-plugin>=1.0.0",
    "mkdocs-include-markdown-plugin>=7.0.0",
    "pymdown-extensions>=10.0",
    "markdown-include>=0.8.0",
    "mike>=2.0.0",
    "mkdocs-mermaid2-plugin>=1.1.0",
]

[project.scripts]
flavor = "flavor.cli:main"

[build-system]
requires = ["uv>=0.1.18", "setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.package-data]
flavor = [
    "ingredients/**/*",  # Platform-specific ingredient binaries
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["flavor*"]
namespaces = false

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
indent-width = 4
exclude = ["**/*pb2*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN", "B", "C90", "SIM", "PTH", "RUF"]
ignore = ["ANN401", "B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["flavor", "tests"]
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
pretty = true
show_error_codes = true
show_column_numbers = true
warn_unused_ignores = true
warn_unused_configs = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["structlog.*", "google.*", "grpc.*", "pytest.*", "jq.*", "psutil.*", "hcl2"]
ignore_missing_imports = true

[tool.pylint.main]
disable = ["C0330", "C0326"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src", "."]
norecursedirs = [".git", "build", "dist", "*.egg-info", ".venv", "htmlcov", ".hypothesis", "__pycache__"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "--color=yes",
    "--ignore=helpers/taster/tests",
]
# Uncomment these for CI/reporting
# addopts = [
#     "--junitxml=reports/junit.xml",
#     "--html=reports/report.html",
#     "--self-contained-html",
# ]
log_cli = true
log_cli_level = "WARNING"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "unit: Fast, isolated unit tests",
    "integration: Integration tests requiring multiple components",
    "slow: Slow running tests (>5s)",
    "security: Security-specific tests",
    "mmap: Memory-mapped file tests",
    "taster: Taster-specific tests",
    "packaging: Package building and verification tests",
    "cross_language: Tests involving Go/Rust/Python interaction",
    "stress: Stress and hypothesis-based property tests",
    "requires_ingredients: Tests that need Go/Rust ingredients built",
]

[tool.coverage.run]
branch = false
source = ["flavor"]
parallel = true
omit = ["*/protocols/tfprotov6/protobuf/*", "*/protocols/tfprotov6/handlers/validate_resource_config.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if __name__ == .__main__.:", "if TYPE_CHECKING:", "def __repr__", "def __str__", "pass"]


[tool.flavor]
package_name = "flavor"
entry_point = "flavor.cli:main"

[tool.flavor.build]
dependencies = []

[tool.flavor.signing]
private_key_path = "keys/flavor-private.key"
public_key_path = "keys/flavor-public.key"
