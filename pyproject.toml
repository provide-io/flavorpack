#
# flavor/pyproject.toml
#

[project]
name = "flavorpack"
description = "Flavor Pack packaging system implementing Progressive Secure Package Format (PSPF/2025)"
dynamic = ["version"]
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Tim Perkins", email = "code@tim.life" },
]
maintainers = [
    { name = "provide.io", email = "code@provide.io" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Archiving :: Packaging",
]
dependencies = [
    # grpcio has no win_arm64 binary wheel; building from source requires
    # C++/CMake/gRPC and hangs CI. Use all extras minus opentelemetry on
    # windows_arm64 — grpcio is only used for OTLP gRPC telemetry export in
    # provide.foundation, and all imports are wrapped in lazy try/except.
    "provide-foundation[all]>=0.3.21; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "provide-foundation[cli,compression,crypto,transport,platform]>=0.3.21; sys_platform == 'win32' and platform_machine == 'ARM64'",
    "pip>=25.2",
    "uv>=0.9.6",
    "setuptools==82.0.1",  # Pinned to match build-backends group; checked by _ensure_no_isolation_build_backend
    "wheel==0.46.3",       # Required for building wheels; pinned to match build-backends group
]
keywords = ["packaging", "pspf", "flavor", "executable", "bundle"]

[project.urls]
Homepage = "https://github.com/provide-io/flavorpack"

[dependency-groups]
dev = [
    # provide-testkit[all] includes memray which does not support win32
    "provide-testkit[all]; sys_platform != 'win32'",
    "provide-testkit; sys_platform == 'win32'",
    "memray>=1.0; sys_platform != 'emscripten' and sys_platform != 'win32'",
    # protobuf is included via provide-testkit[all] on non-Windows; add explicitly for Windows
    "protobuf>=4.0; sys_platform == 'win32'",
    "hypothesis>=6.0",
]
docs = [
    "provide-testkit[docs]",
    "mkdocs-mermaid2-plugin>=1.1.0",
]
build-backends = [
    "setuptools==82.0.1",
    "wheel==0.46.3",
]

[project.scripts]
flavor = "flavor.cli:main"

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.package-data]
flavor = [
    "helpers/bin/**/*",  # Platform-specific helper binaries
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["flavor*"]
exclude = ["flavor.helpers.bin*"]
namespaces = false

[tool.ruff]
line-length = 111
indent-width = 4
target-version = "py311"
exclude = ["**/*pb2*.py", "**/generated/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN", "B", "C90", "SIM", "PTH", "RUF"]
ignore = ["ANN401", "B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["flavor", "tests"]
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
pretty = true
show_error_codes = true
show_column_numbers = true
warn_unused_ignores = true
warn_unused_configs = true
disallow_untyped_decorators = false
exclude = [
    ".*generated.*",
    ".*_pb2\\.py$",
    ".*_pb2\\.pyi$"
]

[[tool.mypy.overrides]]
module = ["structlog.*", "google.*", "grpc.*", "pytest.*", "jq.*", "psutil.*", "hcl2", "mutmut.*", "opentelemetry.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["flavor.psp.format_2025.generated.*", "flavor.*.generated.*"]
ignore_errors = true

[tool.pylint.main]
disable = ["C0330", "C0326"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "DEBUG"
minversion = "6.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--color=yes",
    "--ignore=tests/taster/tests",
    "--ignore=tests/pretaster/scripts",
    "-m", "not memray",
]
norecursedirs = [".git", "build", "dist", "*.egg-info", ".venv", "htmlcov", ".hypothesis", "__pycache__", "*/generated/*", "taster", "pretaster"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore:Exception ignored in.*BaseSubprocessTransport:pytest.PytestUnraisableExceptionWarning",
    "ignore:Module already imported so cannot be rewritten:pytest.PytestAssertRewriteWarning",
]
markers = [
    "unit: Fast, isolated unit tests",
    "integration: Integration tests requiring multiple components",
    "cross_language: Tests involving Go/Rust/Python interaction",
    "slow: Slow running tests (>5s)",
    "fast: Fast-feedback tests intended for local iteration",
    "ci: Tests intended to run in CI",
    "security: Security-specific tests",
    "adversarial: Hostile-input and boundary-violation tests",
    "property: Parameterized, invariant, and property-based tests",
    "fuzz: Coverage-guided or randomized malformed-input tests",
    "smoke: Minimal high-signal smoke tests",
    "mmap: Memory-mapped file tests",
    "taster: Taster-specific tests",
    "packaging: Package building and verification tests",
    "stress: Stress and hypothesis-based property tests",
    "parity: Cross-language parity tests",
    "requires_helpers: Tests that need Go/Rust helpers built",
    "memray: memory profiling stress tests (run with -m memray)",
]

[tool.mutmut]
# Only mutate pure-Python modules (no subprocess/HelperManager calls).
# Excluded: helpers/, commands/ (doctor/helpers/utils use HelperManager),
# packaging/ (orchestrator + python/* shell out to Go/Rust/uv).
paths_to_mutate = [
    "src/flavor/cache.py",
    "src/flavor/exceptions.py",
    "src/flavor/output.py",
    "src/flavor/package.py",
    "src/flavor/verification.py",
    "src/flavor/config",
    "src/flavor/psp",
    "src/flavor/utils",
]
tests_dir = ["tests"]
also_copy = [
    "VERSION",
    "Makefile",
    "scripts",
    "tools",
    ".github/workflows",
    # Note: tests/ is always copied by mutmut automatically (hardcoded in its Config class)
    # Non-mutated src/flavor modules (must not overlap with paths_to_mutate)
    "src/flavor/__init__.py",
    "src/flavor/__main__.py",
    "src/flavor/cli.py",
    "src/flavor/console.py",
    "src/flavor/locking.py",
    "src/flavor/py.typed",
    "src/flavor/helpers",
    "src/flavor/commands",
    "src/flavor/packaging",
    "src/flavor/templates",
]
runner = "pytest"
# Skip tests that fail in the mutants sandbox (env-specific or need Go/Rust sources)
pytest_add_cli_args = [
    "--import-mode=importlib",
    # Disable plugins that are not fork-safe (mutmut uses os.fork() for each mutant)
    "-p", "no:testmon",
    "-p", "no:provide-telemetry",
    "--deselect=tests/format_2025/test_pspf_2025_enhanced.py::TestPlatformSpecific::test_page_size",
    "--deselect=tests/parity/",
    "--deselect=tests/test_quality_observability.py",
    "--deselect=tests/test_version_sync.py",
    "--deselect=tests/test_test_taxonomy.py",
    "--deselect=tests/test_mutant_killers.py::TestCacheGetCacheDir::test_default_cache_dir",
]
do_not_mutate = [
    "*/generated/*", "*_pb2.py", "*_pb2.pyi", "*/tests/*", "*/test_*",
    # Module-level function calls in these trigger trampoline at import time,
    # crashing the mutmut clean-test phase (MUTANT_UNDER_TEST=fail).
    "*/operations.py",
    "*/security.py",
    "*/cli.py",
    "*/locking.py",
]
dict_synonyms = ["dict", "OrderedDict", "defaultdict"]
use_patch_file = false

[tool.coverage.run]
branch = true
source_pkgs = ["flavor"]
parallel = true
omit = [
    "*/protocols/tfprotov6/protobuf/*",
    "*/protocols/tfprotov6/handlers/validate_resource_config.py",
    "*/generated/*",
    "**/*_pb2.py",
    "**/*_pb2.pyi",
    "*/tests/*",
    "*/test_*",
    "*/_version.py"
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
fail_under = 85
exclude_also = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "def __repr__",
    "def __str__",
    "if sys.version_info",
    "except ImportError",
    "try:",
]


[tool.flavor]
package_name = "flavor"
entry_point = "flavor.cli:main"

[tool.flavor.execution]
# Pass all environment variables through, especially cache-related ones
# This ensures the packaged flavor can access the workenv cache
[tool.codespell]
# "stip" is intentional test data (toml key), "nd" is a variable name,
# "requestor" and "shs" are used in spec docs with specific meaning
ignore-words-list = "stip,nd,requestor,shs,collet,ines"
skip = "*.lock,*.min.js,.provide/*"

[tool.flavor.execution.runtime.env]
# Unset all variables except those matching pass patterns
unset = ["*"]
# Pass through all environment variables (except those explicitly unset)
pass = ["*"]

[tool.flavor.build]
dependencies = []

[tool.flavor.signing]
private_key_path = "keys/flavor-private.key"
public_key_path = "keys/flavor-public.key"

[tool.uv]
# cryptography: win_arm64 binary wheels first appeared in 46.0.0;
# 46.0.4+ dropped the win_arm64 wheel again (no OpenSSL for ARM64 on GHA).
# Pin to 46.0.x range that has win_arm64 support.
# cffi 1.x has no win_arm64 binary wheel; cffi 2.0.0+ provides win_arm64
# wheels for native ARM64 Python.
# FreeBSD: pkg only ships cryptography 45.x; exclude the >=46.0 floor there
# so uv uses the pre-built system package instead of failing to build from source.
constraint-dependencies = [
    "cryptography>=46.0.0,<=46.0.3; sys_platform != 'freebsd'",
    # FreeBSD pkg ships 45.x only; maturin can't build 46.x (SOABI mismatch).
    # Cap below 46 so uv resolves to the pre-built system package.
    "cryptography<46.0.0; sys_platform == 'freebsd'",
    "cffi>=2.0.0",
]
