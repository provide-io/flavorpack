#
# flavorpack/pyproject.toml
#
# Flavor Pack packaging system implementing Progressive Secure Package Format (PSPF/2025)
#

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flavorpack"
description = "Flavor Pack packaging system implementing Progressive Secure Package Format (PSPF/2025)"
dynamic = ["version"]
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Tim Perkins", email = "code@tim.life" },
]
maintainers = [
    { name = "provide.io", email = "code@provide.io" },
]
keywords = ["packaging", "pspf", "flavor", "executable", "bundle"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Archiving :: Packaging",
    "Typing :: Typed",
]
dependencies = [
    "provide-foundation[all]",
    "pip>=25.2",
    "uv>=0.9.6",
    "setuptools>=68.0.0",  # Required for building wheels at runtime
]

[project.urls]
Homepage = "https://foundry.provide.io/flavorpack/"
Documentation = "https://foundry.provide.io/flavorpack/"
Repository = "https://github.com/provide-io/flavorpack"
Issues = "https://github.com/provide-io/flavorpack/issues"

[dependency-groups]
dev = [
    "provide-testkit[all]",
]
docs = [
    "provide-testkit[docs]",
    "mkdocs-mermaid2-plugin>=1.1.0",
]

[project.scripts]
flavor = "flavor.cli:main"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.package-data]
flavor = [
    "helpers/bin/**/*",  # Platform-specific helper binaries
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["flavor*"]
namespaces = false

[tool.ruff]
line-length = 111
indent-width = 4
target-version = "py311"
exclude = ["**/*pb2*.py", "**/generated/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN", "B", "BLE", "C90", "PIE", "PLR", "S", "SIM", "PTH", "RUF"]
ignore = [
    "ANN401",   # any-type (too restrictive)
    "BLE001",   # blind-except (too restrictive for cleanup patterns)
    "B008",     # function-call-in-default-argument (Click uses this pattern)
    "E501",     # line-too-long (handled by formatter)
    "S101",     # assert (valid in tests)
    "S104",     # binding-to-all-interfaces (intentional for servers)
    "S105",     # hardcoded-password-string (false positive for variable names)
    "S108",     # hardcoded-temp-file (/tmp is fine for our use cases)
    "S110",     # try-except-pass (legitimate for cleanup)
    "S310",     # suspicious-url-open-for-protocol (URLs are controlled)
    "S311",     # random (not for crypto)
    "S603",     # subprocess-without-shell-equals-true (trusted input)
    "S607",     # start-process-with-partial-path (trusted executables)
    "PIE810",   # single-starts-ends-with (style preference)
    "PLR0911",  # too-many-return-statements (refactor later)
    "PLR0912",  # too-many-branches (refactor later)
    "PLR0913",  # too-many-arguments (common in config classes)
    "PLR0915",  # too-many-statements (refactor later)
    "PLR1714",  # repeated-equality-comparison (style preference)
    "PLR2004",  # magic-value-comparison (too noisy)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "B017", "C901", "E402", "PLR0124", "PLR1714", "RUF100", "S102", "S105", "S106", "S110", "S307", "S311", "S324", "S602", "SIM105", "SIM108", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["flavor", "tests"]
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
pretty = true
show_error_codes = true
show_column_numbers = true
warn_unused_ignores = true
warn_unused_configs = true
disallow_untyped_decorators = false
exclude = [
    ".*generated.*",
    ".*_pb2\\.py$",
    ".*_pb2\\.pyi$"
]

[[tool.mypy.overrides]]
module = ["structlog.*", "google.*", "grpc.*", "pytest.*", "jq.*", "psutil.*", "hcl2", "mutmut.*", "opentelemetry.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["flavor.psp.format_2025.generated.*", "flavor.*.generated.*"]
ignore_errors = true

[tool.pylint.main]
disable = ["C0330", "C0326"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "DEBUG"
minversion = "6.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--color=yes",
    "--ignore=tests/taster/tests",
    "--ignore=tests/pretaster/scripts",
]
norecursedirs = [".git", "build", "dist", "*.egg-info", ".venv", "htmlcov", ".hypothesis", "__pycache__", "*/generated/*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore:Exception ignored in.*BaseSubprocessTransport:pytest.PytestUnraisableExceptionWarning",
    "ignore:Module already imported so cannot be rewritten:pytest.PytestAssertRewriteWarning",
]
markers = [
    "unit: Fast, isolated unit tests",
    "integration: Integration tests requiring multiple components",
    "slow: Slow running tests (>5s)",
    "security: Security-specific tests",
    "mmap: Memory-mapped file tests",
    "taster: Taster-specific tests",
    "packaging: Package building and verification tests",
    "cross_language: Tests involving Go/Rust/Python interaction",
    "cross_platform: Tests exercising cross-platform extraction helpers",
    "stress: Stress and hypothesis-based property tests",
    "requires_helpers: Tests that need Go/Rust helpers built",
    "ci_only: Only run these tests when you're testing continuously",
]

[tool.mutmut]
paths_to_mutate = ["src/flavor"]
tests_dir = "tests"
runner = "pytest"
exclude = ["*/generated/*", "*_pb2.py", "*_pb2.pyi", "*/tests/*", "*/test_*"]
dict_synonyms = ["dict", "OrderedDict", "defaultdict"]
use_patch_file = true

[tool.coverage.run]
branch = true
source_pkgs = ["flavor"]
parallel = false
omit = [
    "*/protocols/tfprotov6/protobuf/*",
    "*/protocols/tfprotov6/handlers/validate_resource_config.py",
    "*/generated/*",
    "**/*_pb2.py",
    "**/*_pb2.pyi",
    "*/tests/*",
    "*/test_*",
    "*/_version.py"
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
fail_under = 70
exclude_also = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "def __repr__",
    "def __str__",
]


[tool.flavor]
package_name = "flavor"
entry_point = "flavor.cli:main"

[tool.flavor.execution]
# Pass all environment variables through, especially cache-related ones
# This ensures the packaged flavor can access the workenv cache
[tool.flavor.execution.runtime.env]
# Unset all variables except those matching pass patterns
unset = ["*"]
# Pass through all environment variables (except those explicitly unset)
pass = ["*"]

[tool.flavor.build]
dependencies = []

[tool.flavor.signing]
private_key_path = "keys/flavor-private.key"
public_key_path = "keys/flavor-public.key"

[tool.bandit]
exclude_dirs = [".venv", "tests", "workenv"]

################################################################################
# Security Scanning Allowlist
################################################################################

[tool.security]
# Paths to exclude from secret scanning (TruffleHog, GitGuardian, Gitleaks)
# Run: we security generate (via wrknv) to regenerate tool configs
description = "Test signing keys and build artifacts - intentionally committed"
allowed_paths = [
    # Test signing keys for package development
    "keys/**",
    "test-keys/**",
    "helpers/*/keys/**",
    "tests/*/keys/**",
    # Build artifacts (Rust target dirs)
    "helpers/flavor-rust/target/**",
    # Old security scan output files (in git history)
    ".provide/output/security/**",
    # Built documentation site
    "site/**",
    # Security documentation with example patterns
    "docs/SECURITY.md",
    # Test files with example keys
    "tests/**",
    # Bfiles output
    "*-bfiles.txt",
    # Responsum game context
    ".rsp_context.json",
]
