[build-system]
requires = ["uv>=0.1.18", "setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flavor"
version = "2025.0.0"
description = "Flavor packaging system implementing Progressive Secure Package Format (PSPF/2025)"
readme = "README.md"
authors = [
    { name = "Provide Services", email = "engineering@provide.services" },
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Archiving :: Packaging",
]
requires-python = ">=3.11"
dependencies = [
    "attrs>=23.1.0",
    "click>=8.1.7",
    "cryptography>=41.0.4",
    "wheel>=0.40.0",
    "zstandard>=0.22.0",
    # "pyvider-telemetry @ file://localhost/REDACTED_ABS_PATH",  # Install from local path
]
keywords = ["packaging", "terraform", "provider", "pspf", "flavor"]

[project.urls]
Homepage = "https://github.com/provide-io/flavor"
"Bug Tracker" = "https://github.com/provide-io/flavor/issues"
"Source Code" = "https://github.com/provide-io/flavor"
Documentation = "https://github.com/provide-io/flavor/tree/main/docs"

[project.optional-dependencies]
dev = [
    "black>=23.9.1",
    "coverage>=7.3.2",
    "mypy>=1.5.1",
    "pre-commit>=3.5.0",
    "pytest>=7.4.2",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "types-attrs>=19.1.0",
    "types-click>=7.1.8",
    "bandit>=1.8.3",
    "hypothesis>=6.131.0",
    "pytest-asyncio>=0.25.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.6.0",
    "twine>=6.0.0",
    "types-protobuf>=6.30.2.20250516",
]

[project.scripts]
flavor = "flavor.cli:main"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
include = ["flavor*"]
namespaces = false

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
indent-width = 4
exclude = ["**/*pb2*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN", "B", "C90", "SIM", "PTH", "RUF"]
ignore = ["ANN401", "B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["flavor", "tests"]
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
pretty = true
show_error_codes = true
show_column_numbers = true
warn_unused_ignores = true
warn_unused_configs = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["structlog.*", "google.*", "grpc.*", "pytest.*", "jq.*", "psutil.*", "hcl2"]
ignore_missing_imports = true

[tool.pylint.main]
disable = ["C0330", "C0326"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
log_cli = true
log_cli_level = "DEBUG"
asyncio_mode = "auto"
pythonpath = ["src", "."]
python_files = ["test_*.py"]
norecursedirs = [".git", "build", "dist", "*.egg-info", ".venv", "htmlcov", ".hypothesis"]

[tool.coverage.run]
branch = true
source = ["flavor"]
parallel = true
omit = ["*/protocols/tfprotov6/protobuf/*", "*/protocols/tfprotov6/handlers/validate_resource_config.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if __name__ == .__main__.:", "if TYPE_CHECKING:", "def __repr__", "def __str__", "pass"]

[dependency-groups]
dev = [
    "ty>=0.0.1a17",
]

[tool.flavor]
provider_name = "flavor"
entry_point = "flavor.cli:main"

[tool.flavor.signing]
private_key_path = "keys/flavor-private.key"
public_key_path = "keys/flavor-public.key"
