version: '3.8'

services:
  # PostgreSQL - Primary test database
  postgres:
    image: postgres:15-alpine
    container_name: pspf-db-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - pspf-db-network

  # MySQL - Compatibility testing
  mysql:
    image: mysql:8.0
    container_name: pspf-db-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: testdb
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpass
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./docker/mysql/conf:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "testuser", "-ptestpass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - pspf-db-network

  # Redis - Caching and session storage
  redis:
    image: redis:7-alpine
    container_name: pspf-db-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - pspf-db-network

  # pgAdmin - PostgreSQL management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pspf-db-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pspf.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - management
    networks:
      - pspf-db-network

  # phpMyAdmin - MySQL management (optional)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: pspf-db-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: rootpass
      UPLOAD_LIMIT: 64M
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    profiles:
      - management
    networks:
      - pspf-db-network

  # Database initialization and migration service
  db-init:
    build:
      context: ./docker/db-init
      dockerfile: Dockerfile
    container_name: pspf-db-init
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: testdb
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: testdb
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpass
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./migrations:/migrations:ro
      - ./docker/db-init/scripts:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - init
    networks:
      - pspf-db-network

volumes:
  postgres_data:
    driver: local
  mysql_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  pspf-db-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16