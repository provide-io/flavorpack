// PSPF/2025 Main Protocol Buffer Definition
// This is the root proto file that imports all modules
syntax = "proto3";

package pspf_2025;

option go_package = "github.com/provide-io/flavorpack/psp/format_2025;pspf2025";
option java_package = "io.provide.flavorpack.pspf2025";

// Import all module definitions
import "modules/operations.proto"; 
import "modules/slots.proto";
import "modules/index.proto";
import "modules/metadata.proto";
import "modules/crypto.proto";
import "modules/jit.proto";
import "modules/spa.proto";

// Complete PSPF package definition
message PSPFPackage {
  // Core index block (8192 bytes)
  index.IndexBlock index = 1;
  
  // Package metadata (JSON)
  metadata.PackageMetadata metadata = 2;
  
  // All slots in package
  repeated slots.SlotEntry slots = 3;
  
  // Cryptographic information
  crypto.CryptoInfo crypto = 4;
  
  // Operation chains for each slot
  repeated operations.OperationChain operation_chains = 5;
  
  // JIT loading configuration
  jit.JITSystemConfig jit_config = 6;
  
  // Staged Payload Architecture config
  spa.SPASystemConfig spa_config = 7;
}