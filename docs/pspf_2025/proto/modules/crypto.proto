// PSPF/2025 Cryptographic Specification
// Defines digital signatures, integrity, and encryption
syntax = "proto3";

package pspf_2025.crypto;

option go_package = "github.com/provide-io/flavorpack/psp/format_2025;pspf2025";
option java_package = "io.provide.flavorpack.pspf2025";

// Cryptographic information (implements FEP-0004)
message CryptoInfo {
  // Digital signature information
  SignatureInfo signature = 1;       // Package signature
  
  // Key management
  repeated KeyInfo keys = 2;          // Signing/encryption keys
  
  // Integrity verification
  repeated IntegrityCheck integrity = 3; // Integrity check information
  
  // Trust chain
  TrustChain trust = 4;               // Certificate/trust chain
  
  // Encryption settings
  EncryptionSettings encryption = 5;   // Package encryption settings
}

// Digital signature information
message SignatureInfo {
  SignatureAlgorithm algorithm = 1;   // Signature algorithm
  bytes public_key = 2;               // Public key (32 bytes for Ed25519)
  bytes signature = 3;                // Digital signature
  uint64 timestamp = 4;               // Signature timestamp
  string key_id = 5;                  // Key identifier
  bytes metadata_hash = 6;            // Hash of signed metadata
}

// Signature algorithms
enum SignatureAlgorithm {
  SIGNATURE_NONE = 0;                 // No signature
  SIGNATURE_ED25519 = 1;              // Ed25519 (recommended)
  SIGNATURE_RSA4096 = 2;              // RSA-4096
  SIGNATURE_ECDSA_P256 = 3;           // ECDSA P-256
}

// Key information
message KeyInfo {
  string key_id = 1;                  // Key identifier
  KeyType key_type = 2;               // Key type
  KeyUsage usage = 3;                 // Key usage
  bytes public_key = 4;               // Public key data
  uint64 created_at = 5;              // Key creation time
  uint64 expires_at = 6;              // Key expiration time
  string algorithm = 7;               // Algorithm name
  uint32 key_size = 8;                // Key size in bits
}

// Key types
enum KeyType {
  KEY_TYPE_SIGNING = 0;               // Signing key
  KEY_TYPE_ENCRYPTION = 1;            // Encryption key
  KEY_TYPE_VERIFICATION = 2;          // Verification key
}

// Key usage flags
enum KeyUsage {
  KEY_USAGE_NONE = 0;                 // No usage
  KEY_USAGE_SIGN = 1;                 // Can sign data
  KEY_USAGE_VERIFY = 2;               // Can verify signatures
  KEY_USAGE_ENCRYPT = 4;              // Can encrypt data
  KEY_USAGE_DECRYPT = 8;              // Can decrypt data
}

// Integrity check information
message IntegrityCheck {
  ChecksumAlgorithm algorithm = 1;    // Checksum algorithm
  bytes checksum = 2;                 // Checksum value
  uint64 data_size = 3;              // Size of checked data
  string scope = 4;                   // What was checked (metadata, slot, etc.)
  uint32 slot_id = 5;                // Slot ID (if slot-specific)
}

// Checksum algorithms
enum ChecksumAlgorithm {
  CHECKSUM_ADLER32 = 0;               // Adler-32 (fast, good for small data)
  CHECKSUM_CRC32 = 1;                 // CRC-32 (good error detection)
  CHECKSUM_SHA256 = 2;                // SHA-256 (cryptographically secure)
  CHECKSUM_XXHASH = 3;                // xxHash (very fast)
  CHECKSUM_BLAKE3 = 4;                // BLAKE3 (fast, secure)
}

// Trust chain information
message TrustChain {
  repeated Certificate certificates = 1; // Certificate chain
  repeated TrustAnchor anchors = 2;    // Trust anchors
  string validation_time = 3;          // Validation timestamp
  TrustLevel level = 4;                // Trust level
}

// Certificate information
message Certificate {
  bytes certificate = 1;              // X.509 certificate (DER encoded)
  string issuer = 2;                  // Certificate issuer
  string subject = 3;                 // Certificate subject
  uint64 not_before = 4;              // Valid from timestamp
  uint64 not_after = 5;               // Valid until timestamp
  string serial_number = 6;           // Certificate serial number
  bytes fingerprint = 7;              // Certificate fingerprint
}

// Trust anchor
message TrustAnchor {
  string name = 1;                    // Trust anchor name
  bytes public_key = 2;               // Root public key
  string algorithm = 3;               // Algorithm
  uint64 created_at = 4;              // Creation timestamp
}

// Trust levels
enum TrustLevel {
  TRUST_NONE = 0;                     // No trust established
  TRUST_SELF_SIGNED = 1;              // Self-signed certificate
  TRUST_ORGANIZATION = 2;             // Organization-signed
  TRUST_CA = 3;                       // Certificate Authority signed
  TRUST_ROOT = 4;                     // Root CA signed
}

// Package encryption settings
message EncryptionSettings {
  bool encrypted = 1;                 // Package has encrypted slots
  EncryptionAlgorithm algorithm = 2;  // Default encryption algorithm
  bytes key_id = 3;                   // Key identifier
  bytes salt = 4;                     // Encryption salt
  uint32 iteration_count = 5;         // Key derivation iterations
  repeated uint32 encrypted_slots = 6; // Slots that are encrypted
}

// Encryption algorithms  
enum EncryptionAlgorithm {
  ENCRYPTION_NONE = 0;                // No encryption
  ENCRYPTION_AES256_GCM = 1;          // AES-256-GCM
  ENCRYPTION_CHACHA20_POLY1305 = 2;   // ChaCha20-Poly1305
  ENCRYPTION_AES256_CBC = 3;          // AES-256-CBC (legacy)
}