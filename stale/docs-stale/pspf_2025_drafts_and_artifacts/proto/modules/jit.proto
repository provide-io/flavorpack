// PSPF/2025 JIT Loading Specification
// Implements FEP-0005: Runtime JIT Loading
syntax = "proto3";

package pspf_2025.jit;

option go_package = "github.com/provide-io/flavorpack/psp/format_2025;pspf2025";
option java_package = "io.provide.flavorpack.pspf2025";

// JIT system-wide configuration
message JITSystemConfig {
  bool enabled = 1;                      // JIT loading enabled globally
  Strategy strategy = 2;                 // Loading strategy
  string cache_dir = 3;                  // JIT cache directory
  uint64 max_cache_size = 4;             // Maximum cache size in bytes
  uint32 network_timeout_ms = 5;         // Network timeout in milliseconds
  repeated uint32 background_slots = 6;  // Slots to load in background
  
  // Prefetch configuration
  PrefetchConfig prefetch = 7;
  
  // Network delivery configuration
  NetworkConfig network = 8;
  
  // Cache management
  CacheConfig cache = 9;
}

// JIT loading strategies
enum Strategy {
  STRATEGY_LAZY = 0;         // Load only when accessed
  STRATEGY_AGGRESSIVE = 1;   // Prefetch aggressively
  STRATEGY_BALANCED = 2;     // Balance between lazy and aggressive
  STRATEGY_MINIMAL = 3;      // Minimum loading
  STRATEGY_PREDICTIVE = 4;   // Use access patterns
}

// Prefetch configuration
message PrefetchConfig {
  bool enabled = 1;                    // Enable prefetching
  repeated string patterns = 2;        // Access pattern files
  uint32 max_concurrent = 3;           // Max concurrent prefetches
  uint32 buffer_size = 4;              // Prefetch buffer size
  repeated uint32 priority_slots = 5;  // High-priority slots
}

// Network delivery configuration
message NetworkConfig {
  // Supported network source types
  enum SourceType {
    SOURCE_HTTP = 0;      // HTTP/HTTPS
    SOURCE_GRPC = 1;      // gRPC + Protobuf
    SOURCE_S3 = 2;        // AWS S3 API
    SOURCE_WEBDAV = 3;    // WebDAV
    SOURCE_CUSTOM = 4;    // User-defined
  }
  
  SourceType type = 1;             // Source type
  string endpoint = 2;             // Network endpoint
  bool use_tls = 3;                // Use TLS
  string certificate_pin = 4;      // Certificate pinning
  
  // Authentication
  AuthConfig auth = 5;
  
  // Retry configuration
  RetryConfig retry = 6;
  
  // Compression for network transfers
  CompressionConfig compression = 7;
}

// Authentication configuration
message AuthConfig {
  enum AuthType {
    AUTH_NONE = 0;        // No authentication
    AUTH_BEARER = 1;      // Bearer token
    AUTH_BASIC = 2;       // Basic auth
    AUTH_CUSTOM = 3;      // Custom auth
    AUTH_MTLS = 4;        // Mutual TLS
  }
  
  AuthType type = 1;
  string token = 2;         // Bearer token or API key
  string username = 3;      // Basic auth username
  string password = 4;      // Basic auth password
  bytes client_cert = 5;    // Client certificate for mTLS
  bytes client_key = 6;     // Client key for mTLS
}

// Retry configuration
message RetryConfig {
  uint32 max_attempts = 1;           // Maximum retry attempts
  repeated uint32 backoff_ms = 2;    // Backoff intervals
  bool exponential_backoff = 3;      // Use exponential backoff
  uint32 max_backoff_ms = 4;         // Maximum backoff time
}

// Compression configuration
message CompressionConfig {
  enum CompressionType {
    COMPRESSION_NONE = 0;     // No compression
    COMPRESSION_GZIP = 1;     // gzip
    COMPRESSION_BROTLI = 2;   // Brotli
    COMPRESSION_ZSTD = 3;     // Zstandard
    COMPRESSION_SNAPPY = 4;   // Snappy
    COMPRESSION_LZ4 = 5;      // LZ4
  }
  
  CompressionType type = 1;
  uint32 level = 2;         // Compression level (1-9)
}

// Cache management configuration
message CacheConfig {
  enum CacheStrategy {
    CACHE_PERSISTENT = 0;    // Keep indefinitely
    CACHE_TEMPORAL = 1;      // Time-based expiration
    CACHE_SIZE_BOUND = 2;    // LRU with size limit
    CACHE_VERSIONED = 3;     // Per-version caching
  }
  
  CacheStrategy strategy = 1;
  uint32 ttl_seconds = 2;          // Time-to-live in seconds
  uint64 max_size = 3;              // Maximum cache size
  bool verify_on_access = 4;        // Verify integrity on access
  uint32 cleanup_interval = 5;      // Cleanup interval in seconds
  
  // Cache validation
  ValidationConfig validation = 6;
}

// Cache validation configuration
message ValidationConfig {
  enum ValidationMode {
    VALIDATION_QUICK = 0;     // Quick checksum of marker
    VALIDATION_PERIODIC = 1;  // Full periodic verification
    VALIDATION_ON_ERROR = 2;  // Validate on error
    VALIDATION_ALWAYS = 3;    // Always validate
  }
  
  ValidationMode mode = 1;
  uint32 interval_seconds = 2;     // Validation interval
  bool invalidate_on_update = 3;   // Invalidate on package update
}

// JIT slot request (for network delivery)
message SlotRequest {
  string package_id = 1;        // Package identifier
  string package_version = 2;   // Package version
  uint32 slot_id = 3;          // Slot identifier
  string auth_token = 4;        // Authentication token
  uint64 offset = 5;           // Resume offset for partial downloads
}

// JIT slot response info
message SlotInfo {
  uint32 slot_id = 1;          // Slot identifier
  uint64 size = 2;             // Total size
  uint32 checksum = 3;         // Adler-32 checksum
  bytes sha256 = 4;            // SHA-256 hash
  bool available = 5;          // Slot is available
  uint64 expires_at = 6;       // Expiration timestamp
}

// Chunk for streaming delivery
message SlotChunk {
  uint32 sequence = 1;         // Chunk sequence number
  bytes data = 2;              // Chunk data
  uint32 checksum = 3;         // Chunk Adler-32
  float progress = 4;          // Download progress (0.0-1.0)
  bool is_last = 5;           // Last chunk flag
}

// Update check request
message UpdateRequest {
  string package_id = 1;       // Package identifier
  string current_version = 2;  // Current version
  repeated uint32 slots = 3;   // Slots to check
}

// Update information
message UpdateInfo {
  bool update_available = 1;   // Update is available
  string new_version = 2;      // New version number
  repeated uint32 changed_slots = 3;  // Changed slot IDs
  uint64 total_size = 4;       // Total update size
  string changelog = 5;        // Changelog text
}