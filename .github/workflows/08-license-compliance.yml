name: 08 ⚖️ License Compliance

on:
  workflow_dispatch:
    inputs:
      strict_mode:
        description: 'Enable strict license checking'
        type: boolean
        default: false
      allowed_licenses:
        description: 'Comma-separated list of allowed licenses (e.g., MIT,Apache-2.0,BSD-3-Clause)'
        type: string
        default: 'MIT,Apache-2.0,BSD-3-Clause,BSD-2-Clause,ISC,Python-2.0,PSF,ZPL'
      generate_sbom:
        description: 'Generate Software Bill of Materials (SBOM)'
        type: boolean
        default: true
  
  pull_request:
    paths:
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'Pipfile*'
      - 'go.mod'
      - 'go.sum'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'LICENSE*'
      - 'NOTICE*'
  
  schedule:
    # Run monthly on the 1st at 5 AM UTC
    - cron: '0 5 1 * *'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Project License Analysis
  project-license:
    name: 📜 Project License
    runs-on: ubuntu-latest
    outputs:
      project_license: ${{ steps.detect.outputs.license }}
      has_license: ${{ steps.detect.outputs.has_license }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔍 Detect Project License
        id: detect
        run: .github/scripts/detect-project-license.sh

      - name: 📋 Analyze License Headers
        run: .github/scripts/analyze-license-headers.sh

  # Python License Compliance
  python-license:
    name: 🐍 Python Licenses
    runs-on: ubuntu-latest
    outputs:
      compliant: ${{ steps.check.outputs.compliant }}
      violations: ${{ steps.check.outputs.violations }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📦 Install License Tools
        run: |
          python -m venv license-env
          source license-env/bin/activate
          pip install --upgrade pip
          pip install \
            pip-licenses \
            licensecheck \
            license-expression \
            pip-audit \
            pipdeptree
          
          # Install project to analyze dependencies
          pip install -e ".[dev,test]"
      
      - name: 🔍 Check License Compliance
        id: check
        continue-on-error: ${{ inputs.strict_mode != true }}
        run: |
          echo "## 🐍 Python License Compliance" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          .github/scripts/check-python-license-compliance.sh "${{ inputs.allowed_licenses }}"
      
      - name: 📤 Upload Python License Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-license-reports
          path: |
            python-licenses.*
            python-license-summary.txt
            license-analysis.txt

  # Go License Compliance
  go-license:
    name: 🐹 Go Licenses
    runs-on: ubuntu-latest
    outputs:
      compliant: ${{ steps.check.outputs.compliant }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: 📦 Install go-licenses
        run: go install github.com/google/go-licenses@latest

      - name: 🔍 Check Compliance
        id: check
        continue-on-error: ${{ inputs.strict_mode != true }}
        run: |
          echo "## 🐹 Go License Compliance" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          .github/scripts/check-go-license-compliance.sh
      
      - name: 📤 Upload Go License Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-license-reports
          path: |
            src/flavor-go/go-licenses.*

  # Rust License Compliance
  rust-license:
    name: 🦀 Rust Licenses
    runs-on: ubuntu-latest
    outputs:
      compliant: ${{ steps.check.outputs.compliant }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: 📦 Install cargo tools
        run: |
          cargo install cargo-license
          cargo install cargo-deny

      - name: 🔍 Check Compliance
        id: check
        continue-on-error: ${{ inputs.strict_mode != true }}
        run: |
          echo "## 🦀 Rust License Compliance" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          .github/scripts/check-rust-license-compliance.sh
      
      - name: 📤 Upload Rust License Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-license-reports
          path: |
            src/flavor-rs/rust-licenses.*
            src/flavor-rs/cargo-deny-licenses.log
            src/flavor-rs/deny.toml

  # SBOM Generation
  sbom-generation:
    name: 📜 SBOM Generation
    runs-on: ubuntu-latest
    if: inputs.generate_sbom == true
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 📋 Generate SBOM
        run: .github/scripts/generate-sbom.sh

      - name: 🔍 Validate SBOM
        continue-on-error: true
        run: .github/scripts/validate-sbom.sh
      
      - name: 📤 Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-reports
          path: |
            sbom-*.json
            sbom-*.txt
            cyclonedx-validation.log

  # Compliance Report
  compliance-report:
    name: 📊 Compliance Report
    needs: [project-license, python-license, go-license, rust-license, sbom-generation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download all reports
        uses: actions/download-artifact@v4
        with:
          path: license-reports
      
      - name: 📊 Generate Final Compliance Report
        env:
          PROJECT_LICENSE_OUTPUT: ${{ needs.project-license.outputs.project_license }}
          HAS_LICENSE_OUTPUT: ${{ needs.project-license.outputs.has_license }}
          PYTHON_COMPLIANT_OUTPUT: ${{ needs.python-license.outputs.compliant }}
          PYTHON_VIOLATIONS_OUTPUT: ${{ needs.python-license.outputs.violations }}
          GO_COMPLIANT_OUTPUT: ${{ needs.go-license.outputs.compliant }}
          RUST_COMPLIANT_OUTPUT: ${{ needs.rust-license.outputs.compliant }}
          STRICT_MODE: ${{ inputs.strict_mode }}
        run: .github/scripts/generate-license-compliance-report.sh
      
      - name: 📤 Upload Compliance Summary
        uses: actions/upload-artifact@v4
        with:
          name: compliance-summary
          path: compliance-summary.json
      
      - name: 💬 Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('compliance-summary.json', 'utf8'));
            
            const comment = `## ⚖️ License Compliance Check
            
            **Project License:** ${summary.project_license}
            **Overall Compliance:** ${summary.compliance.overall ? '✅ Compliant' : '❌ Issues Detected'}
            
            | Language | Status |
            |----------|--------|
            | 🐍 Python | ${summary.compliance.python ? '✅' : '⚠️'} |
            | 🐹 Go | ${summary.compliance.go ? '✅' : '⚠️'} |
            | 🦀 Rust | ${summary.compliance.rust ? '✅' : '⚠️'} |
            
            ${summary.violations.python > 0 ? `⚠️ Python has ${summary.violations.python} license violations` : ''}
            
            [View Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });