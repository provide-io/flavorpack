name: 🎭 Workflow Orchestrator

on:
  workflow_dispatch:
    inputs:
      workflows:
        description: 'Workflows to run (comma-separated)'
        required: false
        default: 'tests,quality,helpers'
        type: string
      skip_checks:
        description: 'Skip configuration checks'
        required: false
        default: false
        type: boolean
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ==================================================================================
  # 📋 Configuration Loader
  # ==================================================================================
  config:
    name: 📋 Load Configuration
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    outputs:
      workflows: ${{ steps.parse.outputs.workflows }}
      global: ${{ steps.parse.outputs.global }}
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflow-config.yml
            .github/workflows
      
      - name: 🔧 Parse Configuration
        id: parse
        run: |
          if [ ! -f .github/workflow-config.yml ]; then
            echo "::error::Configuration file not found"
            exit 1
          fi
          
          # Install yq for YAML parsing
          wget -qO /tmp/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /tmp/yq
          
          # Extract enabled workflows
          ENABLED_WORKFLOWS=$(/tmp/yq eval '.workflows | to_entries | map(select(.value.enabled == true) | .key) | join(",")' .github/workflow-config.yml)
          echo "workflows=$ENABLED_WORKFLOWS" >> $GITHUB_OUTPUT
          
          # Extract global config
          GLOBAL_CONFIG=$(/tmp/yq eval '.global | @json' .github/workflow-config.yml)
          echo "global=$GLOBAL_CONFIG" >> $GITHUB_OUTPUT
          
          # Build matrix for artifact builds
          MATRIX=$(/tmp/yq eval '.workflows.helpers.matrix | @json' .github/workflow-config.yml)
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          
          echo "📋 Enabled workflows: $ENABLED_WORKFLOWS"

  # ==================================================================================
  # 🧪 Flavor Core Tests
  # ==================================================================================
  flavor-tests:
    name: 🧪 Flavor Tests
    needs: [config, helpers]
    if: contains(needs.config.outputs.workflows, 'tests')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      
      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: 🔧 Determine platform
        id: platform
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            echo "platform=linux-amd64" >> $GITHUB_OUTPUT
          elif [ "${{ runner.os }}" = "macOS" ]; then
            echo "platform=darwin-arm64" >> $GITHUB_OUTPUT
          elif [ "${{ runner.os }}" = "Windows" ]; then
            echo "platform=windows-amd64" >> $GITHUB_OUTPUT
          fi
      
      - name: 📥 Download Helper Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: helpers-*-${{ steps.platform.outputs.platform }}
          path: helpers/bin/
          merge-multiple: true
      
      - name: 🔧 Setup Helpers
        run: |
          # Setup platform-specific helpers
          cd helpers/bin
          ls -la
          
          # Remove platform suffixes from the binaries
          for file in *-${{ steps.platform.outputs.platform }}; do
            if [ -f "$file" ]; then
              base="${file%-${{ steps.platform.outputs.platform }}}"
              echo "Renaming $file to $base"
              mv "$file" "$base"
            fi
          done
          
          chmod +x * 2>/dev/null || true
          ls -la
          cd ../..
          
          # Copy to workenv location where tests might look
          platform=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m | sed 's/x86_64/x86_64/' | sed 's/aarch64/arm64/')
          mkdir -p "workenv/flavors/${platform}_${arch}"
          cp helpers/bin/* "workenv/flavors/${platform}_${arch}/" 2>/dev/null || true
          
          # Also put in ~/.cache/flavor/bin for tests that look there
          mkdir -p ~/.cache/flavor/bin
          cp helpers/bin/* ~/.cache/flavor/bin/ 2>/dev/null || true
      
      - name: 🔧 Setup Environment
        run: |
          uv venv workenv/flavor_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m)
          source workenv/flavor_*/bin/activate
          uv pip install -e .[dev]
          uv pip install pytest-cov pytest-xdist
      
      - name: 🧪 Run Flavor Tests
        run: |
          source workenv/flavor_*/bin/activate
          # Run all tests excluding slow ones
          pytest tests/ -m "not slow" -n auto --cov=src/flavor --cov-branch --tb=short
          # Generate coverage report
          coverage xml
          coverage report
      
      - name: 📊 Upload Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: flavor-coverage

  # ==================================================================================
  # 🐌 Slow/Performance Tests
  # ==================================================================================
  performance-tests:
    name: 🐌 Performance Tests
    needs: config
    if: contains(needs.config.outputs.workflows, 'tests')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      
      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: 🔧 Setup Environment
        run: |
          uv venv workenv/flavor_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m)
          source workenv/flavor_*/bin/activate
          uv pip install -e .[dev]
          uv pip install pytest-cov pytest-xdist
      
      - name: 🐌 Run Performance Tests
        run: |
          source workenv/flavor_*/bin/activate
          pytest tests/ -m "slow or mmap" -v --tb=short
        timeout-minutes: 30

  # ==================================================================================
  # 🍯 Taster Tests (Parallel with Flavor Tests)
  # ==================================================================================
  taster-tests:
    name: 🍯 Taster Tests
    needs: [config, helpers]
    if: contains(needs.config.outputs.workflows, 'tests')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      
      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: 🔧 Determine platform
        id: platform
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            echo "platform=linux-amd64" >> $GITHUB_OUTPUT
          elif [ "${{ runner.os }}" = "macOS" ]; then
            echo "platform=darwin-arm64" >> $GITHUB_OUTPUT
          elif [ "${{ runner.os }}" = "Windows" ]; then
            echo "platform=windows-amd64" >> $GITHUB_OUTPUT
          fi
      
      - name: 📥 Download Helpers
        uses: actions/download-artifact@v4
        with:
          pattern: helpers-*-${{ steps.platform.outputs.platform }}
          path: helpers/bin/
          merge-multiple: true
      
      - name: 🔧 Setup Helpers
        run: |
          # Setup platform-specific helpers
          cd helpers/bin
          ls -la
          
          # Remove platform suffixes from the binaries
          for file in *-${{ steps.platform.outputs.platform }}; do
            if [ -f "$file" ]; then
              base="${file%-${{ steps.platform.outputs.platform }}}"
              echo "Renaming $file to $base"
              mv "$file" "$base"
            fi
          done
          
          chmod +x * 2>/dev/null || true
          ls -la
          cd ../..
          
          # Copy to workenv location
          platform=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m | sed 's/x86_64/x86_64/' | sed 's/aarch64/arm64/')
          mkdir -p "workenv/flavors/${platform}_${arch}"
          cp helpers/bin/* "workenv/flavors/${platform}_${arch}/" 2>/dev/null || true
          
          # Also put in ~/.cache/flavor/bin
          mkdir -p ~/.cache/flavor/bin
          cp helpers/bin/* ~/.cache/flavor/bin/ 2>/dev/null || true
      
      - name: 🔧 Setup Flavor Environment
        run: |
          uv venv workenv/flavor_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m)
          source workenv/flavor_*/bin/activate
          uv pip install -e .
          uv pip install pytest pytest-cov pytest-xdist
      
      - name: 📦 Build Flavor Package
        run: |
          source workenv/flavor_*/bin/activate
          flavor package --launcher go --output dist/flavor.psp
      
      - name: 🔧 Install Flavor from Package
        run: |
          chmod +x dist/flavor.psp
          ./dist/flavor.psp --version
          # Install flavor globally for taster tests
          mkdir -p $HOME/.local/bin
          cp dist/flavor.psp $HOME/.local/bin/flavor
          chmod +x $HOME/.local/bin/flavor
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          # Verify installation
          which flavor
          flavor --version
      
      - name: 🧪 Run Taster Tests
        run: |
          source workenv/flavor_*/bin/activate
          cd helpers/taster
          # Ensure taster uses the installed flavor artifact
          export PATH="$HOME/.local/bin:$PATH"
          # Run taster-specific tests
          pytest tests/ -m "taster and not stress" -n auto -v
      
      - name: 🍯 Test Taster Self-Packaging
        run: |
          source workenv/flavor_*/bin/activate
          cd helpers/taster
          # Use the installed flavor artifact to package taster with Go launcher
          export PATH="$HOME/.local/bin:$PATH"
          flavor package --launcher go --output dist/taster-go.psp
          # Use taster to package itself with Rust launcher (different builder)
          chmod +x dist/taster-go.psp
          FLAVOR_INSECURE=1 ./dist/taster-go.psp package --launcher rust --builder rust --output dist/taster-rust.psp
          # Verify both packages
          FLAVOR_LAUNCHER_CLI=true ./dist/taster-go.psp info
          FLAVOR_LAUNCHER_CLI=true ./dist/taster-rust.psp info
          # Test taster self-packaging with mixed combinations
          FLAVOR_INSECURE=1 ./dist/taster-go.psp package --launcher go --builder rust --output dist/taster-go-rust.psp
          FLAVOR_LAUNCHER_CLI=true ./dist/taster-go-rust.psp info

  # ==================================================================================
  # 🔨 Helper Builds
  # ==================================================================================
  helpers:
    name: 🔨 Build Helpers
    needs: config
    if: contains(needs.config.outputs.workflows, 'helpers')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux AMD64 only
          - os: ubuntu-latest
            language: go
            goos: linux
            goarch: amd64
            platform: linux-amd64
          - os: ubuntu-latest
            language: rust
            platform: linux-amd64
          # macOS ARM64 only
          - os: macos-latest
            language: go
            goos: darwin
            goarch: arm64
            platform: darwin-arm64
          - os: macos-latest
            language: rust
            platform: darwin-arm64
          # # Linux ARM64 - COMMENTED OUT
          # - os: ubuntu-latest
          #   language: go
          #   goos: linux
          #   goarch: arm64
          #   platform: linux-arm64
          # - os: ubuntu-latest
          #   language: rust
          #   platform: linux-arm64
          #   rust-target: aarch64-unknown-linux-gnu
          # # Windows AMD64 - COMMENTED OUT
          # - os: windows-latest
          #   language: go
          #   goos: windows
          #   goarch: amd64
          #   platform: windows-amd64
          # - os: windows-latest
          #   language: rust
          #   platform: windows-amd64
          # # Windows ARM64 - COMMENTED OUT
          # - os: windows-latest
          #   language: go
          #   goos: windows
          #   goarch: arm64
          #   platform: windows-arm64
          # - os: windows-latest
          #   language: rust
          #   platform: windows-arm64
          #   rust-target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐹 Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: helpers/flavor-go/go.sum
      
      - name: 🦀 Setup Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-target }}
      
      - name: 🔧 Install Cross-Compilation Tools
        if: matrix.language == 'rust' && matrix.rust-target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      
      - name: 🔨 Build Helpers
        id: build
        run: |
          # Ensure output directory exists
          mkdir -p helpers/bin
          
          if [ "${{ matrix.language }}" = "go" ]; then
            cd helpers/flavor-go
            # Set cross-compilation environment
            export GOOS=${{ matrix.goos }}
            export GOARCH=${{ matrix.goarch }}
            # Enable reproducible builds
            export CGO_ENABLED=0
            export GOFLAGS="-trimpath"
            # Build both Go binaries with reproducible flags
            go build -trimpath -ldflags="-s -w -buildid=" -o ../../helpers/bin/flavor-go-launcher-${{ matrix.platform }} ./cmd/flavor-go-launcher &
            PID1=$!
            go build -trimpath -ldflags="-s -w -buildid=" -o ../../helpers/bin/flavor-go-builder-${{ matrix.platform }} ./cmd/flavor-go-builder &
            PID2=$!
            wait $PID1 $PID2
          else
            cd helpers/flavor-rust
            
            # Set cross-compilation environment for ARM64 Linux
            if [ "${{ matrix.rust-target }}" = "aarch64-unknown-linux-gnu" ]; then
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
              export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
              export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
            fi
            
            # Cargo will parallelize internally, build both targets
            if [ -n "${{ matrix.rust-target }}" ]; then
              cargo build --release --target ${{ matrix.rust-target }} --bin flavor-rs-launcher --bin flavor-rs-builder
              cp target/${{ matrix.rust-target }}/release/flavor-rs-launcher ../../helpers/bin/flavor-rs-launcher-${{ matrix.platform }}
              cp target/${{ matrix.rust-target }}/release/flavor-rs-builder ../../helpers/bin/flavor-rs-builder-${{ matrix.platform }}
            else
              cargo build --release --bin flavor-rs-launcher --bin flavor-rs-builder
              cp target/release/flavor-rs-launcher ../../helpers/bin/flavor-rs-launcher-${{ matrix.platform }}
              cp target/release/flavor-rs-builder ../../helpers/bin/flavor-rs-builder-${{ matrix.platform }}
            fi
          fi
        shell: bash
      
      - name: 📦 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: helpers-${{ matrix.language }}-${{ matrix.platform }}
          path: helpers/bin/*-${{ matrix.platform }}*
          retention-days: 30

  # ==================================================================================
  # 🧪 Taster Integration Tests
  # ==================================================================================
  taster:
    name: 🍯 Taster Tests
    needs: [config, helpers]
    if: contains(needs.config.outputs.workflows, 'taster')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Test both launchers on both platforms
          - os: ubuntu-latest
            platform: linux-amd64
            launcher: go
            builder: python  # For naming only, actual builder is always Python
          - os: ubuntu-latest
            platform: linux-amd64
            launcher: rust
            builder: python
          - os: macos-latest
            platform: darwin-arm64
            launcher: go
            builder: python
          - os: macos-latest
            platform: darwin-arm64
            launcher: rust
            builder: python
    runs-on: ${{ matrix.os }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 📥 Download Helpers
        uses: actions/download-artifact@v4
        with:
          pattern: helpers-*-${{ matrix.platform }}
          # Download directly to current directory, not helpers/bin/
          path: ./
          merge-multiple: true
      
      - name: 🔧 Setup Helpers
        run: |
          # List what we downloaded
          echo "Downloaded artifacts:"
          ls -la
          
          # The artifacts are downloaded with directory structure preserved
          # Move them to the correct location
          mkdir -p helpers/bin
          
          # Find and move all helper binaries
          find . -name "flavor-*-launcher*" -o -name "flavor-*-builder*" | while read f; do
            echo "Moving $f to helpers/bin/"
            mv "$f" helpers/bin/ 2>/dev/null || true
          done
          
          # Remove platform suffix from binaries
          cd helpers/bin
          for file in *-${{ matrix.platform }}; do
            if [ -f "$file" ]; then
              base="${file%-${{ matrix.platform }}}"
              echo "Renaming $file to $base"
              mv "$file" "$base"
            fi
          done
          
          chmod +x *
          echo "Final helpers/bin contents:"
          ls -la
          cd ../..
          
          # Also copy to ~/.cache/flavor/bin for builder to find launchers
          mkdir -p ~/.cache/flavor/bin
          cp helpers/bin/* ~/.cache/flavor/bin/
          
          # Add to PATH so builders can find launchers
          echo "$PWD/helpers/bin" >> $GITHUB_PATH
          echo "$HOME/.cache/flavor/bin" >> $GITHUB_PATH
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: 🔧 Build Taster Package
        run: |
          uv venv workenv/flavor_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m)
          source workenv/flavor_*/bin/activate
          uv pip install -e .
          
          # Set the helpers path explicitly to avoid path issues
          export FLAVOR_HELPERS_BIN="$PWD/helpers/bin"
          echo "FLAVOR_HELPERS_BIN=$FLAVOR_HELPERS_BIN"
          ls -la $FLAVOR_HELPERS_BIN
          
          cd helpers/taster
          # Note: flavor package only supports --launcher, not --builder
          # All packages are built with Python builder currently
          ../../workenv/flavor_*/bin/flavor package \
            --launcher ${{ matrix.launcher }} \
            --output dist/taster-${{ matrix.launcher }}-${{ matrix.builder }}.psp
      
      - name: 🧪 Run Taster Tests
        run: |
          # The package is built in helpers/taster/dist/, not tests/taster/dist/
          chmod +x helpers/taster/dist/taster-${{ matrix.launcher }}-${{ matrix.builder }}.psp
          
          # Run all taster commands
          export FLAVOR_INSECURE=1
          ./helpers/taster/dist/taster-${{ matrix.launcher }}-${{ matrix.builder }}.psp test
          ./tests/taster/dist/taster-${{ matrix.launcher }}-${{ matrix.builder }}.psp env
          ./tests/taster/dist/taster-${{ matrix.launcher }}-${{ matrix.builder }}.psp argv
          ./tests/taster/dist/taster-${{ matrix.launcher }}-${{ matrix.builder }}.psp metadata
          ./tests/taster/dist/taster-${{ matrix.launcher }}-${{ matrix.builder }}.psp features
      
      - name: 📦 Upload Test Packages
        uses: actions/upload-artifact@v4
        with:
          name: taster-${{ matrix.launcher }}-${{ matrix.builder }}-${{ matrix.os }}
          path: tests/taster/dist/*.psp

  # ==================================================================================
  # 📦 Release Artifacts
  # ==================================================================================
  release:
    name: 📦 Build Release Artifacts
    needs: [flavor-tests, taster-tests, helpers, taster]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
          - os: macos-latest
            platform: darwin-amd64
          - os: macos-latest
            platform: darwin-arm64
          - os: windows-latest
            platform: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 📥 Download All Helpers
        uses: actions/download-artifact@v4
        with:
          pattern: helpers-*
          path: release/helpers/
          merge-multiple: true
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: 📦 Build Python Wheel
        run: |
          uv venv
          uv pip install build
          python -m build --wheel
      
      - name: 🎁 Package Release
        run: |
          mkdir -p release/flavor-${{ github.ref_name }}-${{ matrix.platform }}
          
          # Copy helpers
          cp -r helpers/bin/* release/flavor-${{ github.ref_name }}-${{ matrix.platform }}/
          
          # Copy Python wheel
          cp dist/*.whl release/flavor-${{ github.ref_name }}-${{ matrix.platform }}/
          
          # Create tarball
          tar czf flavor-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz \
            -C release flavor-${{ github.ref_name }}-${{ matrix.platform }}
      
      - name: 📤 Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: flavor-*.tar.gz

  # ==================================================================================
  # 📋 Summary
  # ==================================================================================
  summary:
    name: 📋 Workflow Summary
    needs: [flavor-tests, taster-tests, helpers, taster]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📊 Generate Summary
        run: |
          echo "# 🎭 Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check job statuses
          if [ "${{ needs.flavor-tests.result }}" = "success" ]; then
            echo "✅ Flavor Tests: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Flavor Tests: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.taster-tests.result }}" = "success" ]; then
            echo "✅ Taster Tests: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Taster Tests: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.helpers.result }}" = "success" ]; then
            echo "✅ Helpers: Built successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Helpers: Build failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.taster.result }}" = "success" ]; then
            echo "✅ Taster: Integration tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Taster: Integration tests failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "Check the Actions tab for downloadable artifacts." >> $GITHUB_STEP_SUMMARY