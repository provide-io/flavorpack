name: 04 🍰 Taster Pipeline

on:
  workflow_dispatch:
    inputs:
      flavor_run_id:
        description: 'Flavor Pipeline run ID (leave empty for latest)'
        type: string
        required: false
      taster_args:
        description: 'Arguments to pass to taster (e.g., --help, info, env)'
        type: string
        required: false
        default: '--help'
  
  workflow_run:
    workflows: ["03 🌶️ Flavor Pipeline"]
    types: [completed]
    branches: [main, develop]

jobs:
  setup:
    name: 🔧 Setup & Get Flavor PSP
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      helper_version: ${{ steps.version.outputs.version }}
      test_matrix: ${{ steps.matrix.outputs.matrix }}
      flavor_run_id: ${{ steps.flavor.outputs.run_id }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔍 Determine version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 🔍 Get Flavor run
        id: flavor
        run: .github/scripts/get-flavor-run.sh "${{ inputs.flavor_run_id }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 📥 Download Flavor PSP artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: 03-flavor-pipeline.yml
          run_id: ${{ steps.flavor.outputs.run_id }}
          name_is_regexp: true
          name: "^flavor-${{ steps.version.outputs.version }}-"
          path: ./flavor-artifacts
      
      - name: 🔧 Organize Flavor artifacts
        run: .github/scripts/organize-flavor-artifacts.sh
      
      - name: 📥 Download helper artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: 01-helper-prep.yml
          name: flavor-helpers-${{ steps.version.outputs.version }}-all
          path: ./helpers-dist

      - name: 📤 Upload Flavor PSP for test jobs
        uses: actions/upload-artifact@v4
        with:
          name: flavor-psp-${{ github.run_id }}
          path: |
            flavor-psp/*.psp
            flavor-psp/*.exe

      - name: 🧪 Define test matrix
        id: matrix
        run: .github/scripts/define-taster-test-matrix.sh

  test-taster:
    name: 🧪 Test Taster ${{ matrix.name }}
    needs: setup
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.test_matrix) }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📥 Download Flavor PSP
        uses: actions/download-artifact@v4
        with:
          name: flavor-psp-${{ github.run_id }}
          path: ./flavor-psp
      
      - name: 📥 Download helpers
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: 01-helper-prep.yml
          name: flavor-helpers-${{ needs.setup.outputs.version }}-all
          path: ./helpers-dist
      
      - name: 🔧 Extract helpers
        run: .github/scripts/download-helpers.sh helpers-dist "${{ needs.setup.outputs.version }}" "${{ matrix.platform }}"

      - name: 🔨 Build Taster using Flavor PSP
        id: build
        run: .github/scripts/prepare-taster-build.sh "${{ matrix.platform }}" "flavor-psp" "${{ needs.setup.outputs.version }}" "taster-build"

      - name: 🔍 Verify Built Package
        run: .github/scripts/verify-built-package.sh "${{ steps.build.outputs.taster_path }}"

      - name: 🧪 Test Taster Commands
        timeout-minutes: 5
        run: |
          TASTER="${{ steps.build.outputs.taster_path }}"
          WITH_TIMEOUT="${{ runner.os == 'Linux' && 'true' || 'false' }}"
          .github/scripts/test-taster-basic.sh "$TASTER" "$WITH_TIMEOUT"
          if [ -n "${{ inputs.taster_args }}" ]; then
            echo "=== Testing user args: ${{ inputs.taster_args }} ==="
            "$TASTER" ${{ inputs.taster_args }}
          fi

      - name: 📊 Collect test results
        if: always()
        run: .github/scripts/collect-taster-test-results.sh "${{ matrix.platform }}" "${{ matrix.runner }}" "${{ job.status }}" "${{ steps.build.outputs.taster_path }}" "${{ needs.setup.outputs.helper_version }}"

      - name: 📤 Upload taster package
        uses: actions/upload-artifact@v4
        with:
          name: taster-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: |
            taster-build/taster-${{ needs.setup.outputs.version }}-${{ matrix.platform }}.psp
            taster-build/taster-${{ needs.setup.outputs.version }}-${{ matrix.platform }}.exe

      - name: 📤 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taster-results-${{ matrix.platform }}-${{ github.run_id }}
          path: test-results/

  comprehensive-test:
    name: 🔬 Comprehensive Taster Tests
    needs: [setup, test-taster]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📥 Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: taster-results-*
          path: all-results

      - name: 📥 Download helpers
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: 01-helper-prep.yml
          name: flavor-helpers-${{ needs.setup.outputs.version }}-all
          path: ./helpers-dist

      - name: 🔧 Extract all helpers
        run: .github/scripts/download-helpers.sh helpers-dist "${{ needs.setup.outputs.helper_version }}"

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Setup environment
        run: .github/scripts/setup-python-workenv.sh

      - name: 🔍 Detect platform
        id: platform
        run: |
          case "$RUNNER_OS" in
            Linux)
              case "$RUNNER_ARCH" in
                X64) echo "platform=linux_amd64" >> $GITHUB_OUTPUT ;;
                ARM64) echo "platform=linux_arm64" >> $GITHUB_OUTPUT ;;
              esac
              ;;
            macOS)
              case "$RUNNER_ARCH" in
                X64) echo "platform=darwin_amd64" >> $GITHUB_OUTPUT ;;
                ARM64) echo "platform=darwin_arm64" >> $GITHUB_OUTPUT ;;
              esac
              ;;
          esac

      - name: 📥 Download Flavor PSP
        uses: actions/download-artifact@v4
        with:
          name: flavor-psp-${{ github.run_id }}
          path: flavor-psp

      - name: 🔗 Setup Flavor command
        run: .github/scripts/setup-flavor-command.sh "${{ steps.platform.outputs.platform }}"

      - name: ✅ Verify Flavor command
        run: flavor --version

      - name: 📥 Download taster package
        uses: actions/download-artifact@v4
        with:
          pattern: taster-${{ needs.setup.outputs.version }}-linux_amd64
          path: taster-artifacts

      - name: 🧪 Run comprehensive taster tests
        run: |
          TASTER=$(find taster-artifacts -name "taster-*.psp" | head -1)
          .github/scripts/run-comprehensive-taster-tests.sh "$TASTER" "linux_amd64" "helpers/bin"

  validate:
    name: ✅ Validate & Summary
    needs: [setup, test-taster, comprehensive-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📥 Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: taster-results-*
          path: test-results

      - name: 📊 Generate summary
        run: .github/scripts/generate-taster-summary.sh "test-results" "${{ needs.setup.outputs.helper_version }}"

      - name: 🎯 Check status
        run: .github/scripts/check-taster-status.sh "${{ needs.test-taster.result }}" "${{ needs.comprehensive-test.result }}"
