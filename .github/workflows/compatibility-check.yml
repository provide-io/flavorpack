name: 🐳 Daily Compatibility Check

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_windows:
        description: 'Include Windows testing (experimental)'
        type: boolean
        default: false
      extended_distros:
        description: 'Test extended Linux distributions'
        type: boolean
        default: true

jobs:
  # Build fresh helpers with static linking
  build-static:
    name: 🔨 Build Static Binaries
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🐹 Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "${{ vars.GO_VERSION }}"

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      # Install musl-tools and autotools for static builds + tastesh
      - name: 🔧 Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools autoconf automake libtool

      # Build Go, Rust, and tastesh static binaries + verify linking
      - name: 🔨 Build and verify static binaries
        run: ci/build-compat-binaries.sh

      - name: 📦 Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: static-binaries
          path: dist/bin/
          retention-days: 7

  # Test on core Linux distributions
  test-core-distros:
    name: 🐧 Test Core Distros
    needs: build-static
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro:
          - { name: "CentOS 7", image: "centos:7", arch: "amd64", glibc: "2.17" }
          - { name: "Amazon Linux 2", image: "amazonlinux:2", arch: "amd64", glibc: "2.26" }
          - { name: "Amazon Linux 2023", image: "amazonlinux:2023", arch: "amd64", glibc: "2.34" }
          - { name: "Ubuntu 20.04", image: "ubuntu:20.04", arch: "amd64", glibc: "2.31" }
          - { name: "Ubuntu 22.04", image: "ubuntu:22.04", arch: "amd64", glibc: "2.35" }
          - { name: "Ubuntu 24.04", image: "ubuntu:24.04", arch: "amd64", glibc: "2.39" }
          - { name: "Alpine 3.18", image: "alpine:3.18", arch: "amd64", glibc: "musl" }
          - { name: "Alpine Latest", image: "alpine:latest", arch: "amd64", glibc: "musl" }
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 📦 Download binaries
        uses: actions/download-artifact@v8
        with:
          name: static-binaries
          path: dist/bin/

      - name: 🔧 Set permissions
        run: chmod +x dist/bin/*

      # Test builder/launcher binaries work on this distro
      - name: 🐳 Test on ${{ matrix.distro.name }}
        run: |
          docker run --rm \
            -v $PWD/dist/bin:/test \
            -v $PWD/ci:/ci \
            ${{ matrix.distro.image }} sh /ci/test-compat-binaries.sh /test amd64

  # Test on extended Linux distributions
  test-extended-distros:
    name: 🐧 Test Extended Distros
    needs: build-static
    runs-on: ubuntu-24.04
    if: github.event.inputs.extended_distros == 'true' || github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        distro:
          - { name: "Debian 11", image: "debian:11", glibc: "2.31" }
          - { name: "Debian 12", image: "debian:12", glibc: "2.36" }
          - { name: "Fedora 38", image: "fedora:38", glibc: "2.37" }
          - { name: "Fedora 39", image: "fedora:39", glibc: "2.38" }
          - { name: "Rocky Linux 8", image: "rockylinux:8", glibc: "2.28" }
          - { name: "Rocky Linux 9", image: "rockylinux:9", glibc: "2.34" }
          - { name: "OpenSUSE Leap", image: "opensuse/leap:latest", glibc: "2.31" }
          - { name: "Arch Linux", image: "archlinux:latest", glibc: "latest" }
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 📦 Download binaries
        uses: actions/download-artifact@v8
        with:
          name: static-binaries
          path: dist/bin/

      - name: 🔧 Set permissions
        run: chmod +x dist/bin/*

      # Test builder/launcher binaries work on this distro
      - name: 🐳 Test on ${{ matrix.distro.name }}
        run: |
          docker run --rm \
            -v $PWD/dist/bin:/test \
            -v $PWD/ci:/ci \
            ${{ matrix.distro.image }} sh /ci/test-compat-binaries.sh /test amd64

  # Test ARM64 binaries using QEMU
  test-arm64:
    name: 🦾 Test ARM64 (QEMU)
    needs: build-static
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro:
          - { name: "Ubuntu 22.04 ARM64", image: "arm64v8/ubuntu:22.04" }
          - { name: "Alpine ARM64", image: "arm64v8/alpine:latest" }
          - { name: "Amazon Linux 2023 ARM64", image: "arm64v8/amazonlinux:2023" }
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔧 Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: 📦 Download binaries
        uses: actions/download-artifact@v8
        with:
          name: static-binaries
          path: dist/bin/

      - name: 🔧 Set permissions
        run: chmod +x dist/bin/*

      # Test builder/launcher binaries work on ARM64
      - name: 🦾 Test ARM64 on ${{ matrix.distro.name }}
        run: |
          docker run --rm --platform linux/arm64 \
            -v $PWD/dist/bin:/test \
            -v $PWD/ci:/ci \
            ${{ matrix.distro.image }} sh /ci/test-compat-binaries.sh /test arm64

  # Run pretaster in containers
  test-pretaster:
    name: 🔬 Pretaster in Containers
    needs: build-static
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro:
          - { name: "Ubuntu 22.04", image: "ubuntu:22.04", install: "apt-get update && apt-get install -y python3 python3-pip" }
          - { name: "Amazon Linux 2023", image: "amazonlinux:2023", install: "yum install -y python3 python3-pip" }
          - { name: "Fedora 39", image: "fedora:39", install: "dnf install -y python3 python3-pip" }
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 📦 Download binaries
        uses: actions/download-artifact@v8
        with:
          name: static-binaries
          path: dist/bin/

      - name: 🔧 Set permissions
        run: chmod +x dist/bin/*

      # Run pretaster combination tests inside the container
      - name: 🔬 Run pretaster on ${{ matrix.distro.name }}
        run: |
          docker run --rm \
            -v $PWD:/workspace \
            -w /workspace \
            ${{ matrix.distro.image }} sh ci/run-compat-pretaster.sh '${{ matrix.distro.install }}'

  # Generate compatibility report
  compatibility-report:
    name: 📊 Compatibility Report
    needs: [test-core-distros, test-extended-distros, test-arm64, test-pretaster]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Generate and upload the report
      - name: 📊 Generate report
        run: ci/generate-compat-report.sh "${{ needs.test-core-distros.result }}" "${{ needs.test-extended-distros.result }}" "${{ needs.test-arm64.result }}" "${{ needs.test-pretaster.result }}" "${{ github.sha }}" "${{ github.ref_name }}"

      - name: 📦 Upload report
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-report
          path: compatibility-report.md
          retention-days: 30

  # Final status
  final-status:
    name: ✅ Final Status
    needs: [test-core-distros, compatibility-report]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      # Check if core distro tests passed
      - name: 📊 Check overall status
        run: |
          if [ "${{ needs.test-core-distros.result }}" != "success" ]; then
            echo "❌ Compatibility check failed!"
            exit 1
          fi
          echo "✅ All compatibility checks passed!"
