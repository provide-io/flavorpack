name: 🐳 Daily Compatibility Check

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_windows:
        description: 'Include Windows testing (experimental)'
        type: boolean
        default: false
      extended_distros:
        description: 'Test extended Linux distributions'
        type: boolean
        default: true

jobs:
  build-static:
    name: 🔨 Build Static Binaries
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      
      - name: 🔧 Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
          
      - name: 🔨 Build AMD64 binaries
        run: .github/scripts/build-static-binaries.sh
      
      - name: 🔍 Verify static linking
        run: .github/scripts/verify-static-linking.sh
      
      - name: 📦 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: static-binaries
          path: dist/bin/
          retention-days: 7

  test-core-distros:
    name: 🐧 Test Core Distros
    needs: build-static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - { name: "CentOS 7", image: "centos:7", arch: "amd64" }
          - { name: "Amazon Linux 2", image: "amazonlinux:2", arch: "amd64" }
          - { name: "Amazon Linux 2023", image: "amazonlinux:2023", arch: "amd64" }
          - { name: "Ubuntu 20.04", image: "ubuntu:20.04", arch: "amd64" }
          - { name: "Ubuntu 22.04", image: "ubuntu:22.04", arch: "amd64" }
          - { name: "Ubuntu 24.04", image: "ubuntu:24.04", arch: "amd64" }
          - { name: "Alpine 3.18", image: "alpine:3.18", arch: "amd64" }
          - { name: "Alpine Latest", image: "alpine:latest", arch: "amd64" }
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 📦 Download binaries
        uses: actions/download-artifact@v4
        with:
          name: static-binaries
          path: dist/bin/
      
      - name: 🔧 Set permissions
        run: chmod +x dist/bin/*
      
      - name: 🐳 Test on ${{ matrix.distro.name }}
        run: .github/scripts/test-in-container.sh ${{ matrix.distro.image }} ${{ matrix.distro.arch }}

  test-extended-distros:
    name: 🐧 Test Extended Distros
    needs: build-static
    runs-on: ubuntu-latest
    if: github.event.inputs.extended_distros == 'true' || github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        distro:
          - { name: "Debian 11", image: "debian:11", arch: "amd64" }
          - { name: "Debian 12", image: "debian:12", arch: "amd64" }
          - { name: "Fedora 38", image: "fedora:38", arch: "amd64" }
          - { name: "Fedora 39", image: "fedora:39", arch: "amd64" }
          - { name: "Rocky Linux 8", image: "rockylinux:8", arch: "amd64" }
          - { name: "Rocky Linux 9", image: "rockylinux:9", arch: "amd64" }
          - { name: "OpenSUSE Leap", image: "opensuse/leap:latest", arch: "amd64" }
          - { name: "Arch Linux", image: "archlinux:latest", arch: "amd64" }
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 📦 Download binaries
        uses: actions/download-artifact@v4
        with:
          name: static-binaries
          path: dist/bin/
      
      - name: 🔧 Set permissions
        run: chmod +x dist/bin/*
      
      - name: 🐳 Test on ${{ matrix.distro.name }}
        run: .github/scripts/test-in-container.sh ${{ matrix.distro.image }} ${{ matrix.distro.arch }}

  test-arm64:
    name: 🦾 Test ARM64 (QEMU)
    needs: build-static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - { name: "Ubuntu 22.04 ARM64", image: "arm64v8/ubuntu:22.04", arch: "arm64" }
          - { name: "Alpine ARM64", image: "arm64v8/alpine:latest", arch: "arm64" }
          - { name: "Amazon Linux 2023 ARM64", image: "arm64v8/amazonlinux:2023", arch: "arm64" }
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔧 Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      
      - name: 📦 Download binaries
        uses: actions/download-artifact@v4
        with:
          name: static-binaries
          path: dist/bin/
      
      - name: 🔧 Set permissions
        run: chmod +x dist/bin/*
      
      - name: 🦾 Test ARM64 on ${{ matrix.distro.name }}
        run: .github/scripts/test-in-container.sh ${{ matrix.distro.image }} ${{ matrix.distro.arch }}

  test-pretaster:
    name: 🔬 Pretaster in Containers
    needs: build-static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - { name: "Ubuntu 22.04", image: "ubuntu:22.04", install: "apt-get update && apt-get install -y python3 python3-pip" }
          - { name: "Amazon Linux 2023", image: "amazonlinux:2023", install: "yum install -y python3 python3-pip" }
          - { name: "Fedora 39", image: "fedora:39", install: "dnf install -y python3 python3-pip" }
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 📦 Download binaries
        uses: actions/download-artifact@v4
        with:
          name: static-binaries
          path: dist/bin/
      
      - name: 🔧 Set permissions
        run: chmod +x dist/bin/*
      
      - name: 🔬 Run pretaster on ${{ matrix.distro.name }}
        run: .github/scripts/run-pretaster-in-container.sh "${{ matrix.distro.image }}" "${{ matrix.distro.install }}"

  compatibility-report:
    name: 📊 Compatibility Report
    needs: [test-core-distros, test-extended-distros, test-arm64, test-pretaster]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 📊 Generate report
        run: .github/scripts/generate-compatibility-report.sh
        env:
          NEEDS_TEST_CORE_DISTROS_RESULT: ${{ needs.test-core-distros.result }}
          NEEDS_TEST_EXTENDED_DISTROS_RESULT: ${{ needs.test-extended-distros.result }}
          NEEDS_TEST_ARM64_RESULT: ${{ needs.test-arm64.result }}
          NEEDS_TEST_PRETASTER_RESULT: ${{ needs.test-pretaster.result }}
      
      - name: 📦 Upload report
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-report
          path: compatibility-report.md
          retention-days: 30
      
      - name: 💬 Post to Slack/Discord (if configured)
        if: always() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NEEDS_TEST_CORE_DISTROS_RESULT: ${{ needs.test-core-distros.result }}
          NEEDS_TEST_ARM64_RESULT: ${{ needs.test-arm64.result }}
        run: .github/scripts/post-to-slack.sh

  final-status:
    name: ✅ Final Status
    needs: [test-core-distros, compatibility-report]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📊 Check overall status
        run: |
          if [ "${{ needs.test-core-distros.result }}" != "success" ]; then
            echo "❌ Compatibility check failed!"
            echo "Some Linux distributions cannot run the binaries."
            echo "Please check the static linking configuration."
            exit 1
          else
            echo "✅ All compatibility checks passed!"
            echo "Binaries work across all tested Linux distributions."
          fi
