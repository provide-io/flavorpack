name: 📦 Flavor Packaging Tests

on:
  workflow_dispatch:
  workflow_call:
  # Disabled automatic triggers - use main-pipeline.yml instead

jobs:
  # ==================================================================================
  # 📦 Flavor packages itself
  # ==================================================================================
  flavor-self-package:
    name: 🔄 Flavor → Flavor
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        launcher: [go, rust]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: 📥 Download Helpers
        uses: actions/download-artifact@v4
        with:
          name: all-helpers
          path: all-helpers-download
      
      - name: 🔧 Organize Helpers
        shell: bash
        run: |
          chmod +x .github/scripts/organize-artifacts.sh
          .github/scripts/organize-artifacts.sh all-helpers-download
      
      - name: 🔧 Setup Flavor
        shell: bash
        run: |
          chmod +x .github/scripts/setup-workenv.sh
          source .github/scripts/setup-workenv.sh
      
      - name: 📦 Flavor Packages Itself
        shell: bash
        run: |
          source workenv/flavor_*/bin/activate
          
          # Determine platform string
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/')
          PLATFORM="${OS}_${ARCH}"
          
          # Set launcher binary path
          if [ "${{ matrix.launcher }}" = "go" ]; then
            export FLAVOR_LAUNCHER_BIN="$PWD/helpers/bin/flavor-go-launcher"
          else
            export FLAVOR_LAUNCHER_BIN="$PWD/helpers/bin/flavor-rs-launcher"
          fi
          
          # Build package with platform-specific name
          flavor package \
            --launcher-bin $FLAVOR_LAUNCHER_BIN \
            --output dist/flavor-${PLATFORM}.psp \
            --key-seed test123
      
      - name: 🧪 Test Flavor Package
        shell: bash
        run: |
          chmod +x .github/scripts/test-package.sh
          .github/scripts/test-package.sh dist/flavor-*.psp
      
      - name: 📤 Upload Flavor Package
        uses: actions/upload-artifact@v4
        with:
          name: flavor-${{ matrix.os == 'ubuntu-latest' && 'linux_amd64' || 'darwin_arm64' }}-${{ matrix.launcher }}
          path: dist/flavor-*.psp

  # ==================================================================================
  # 🍯 Flavor packages Taster
  # ==================================================================================
  flavor-package-taster:
    name: 📦 Flavor → Taster
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        launcher: [go, rust]
        builder: [python]  # Flavor only supports Python builder currently
    runs-on: ${{ matrix.os }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: 📥 Download Helpers
        uses: actions/download-artifact@v4
        with:
          name: all-helpers
          path: all-helpers-download
      
      - name: 🔧 Organize Helpers
        shell: bash
        run: |
          chmod +x .github/scripts/organize-artifacts.sh
          .github/scripts/organize-artifacts.sh all-helpers-download
      
      - name: 🔧 Setup Flavor
        shell: bash
        run: |
          chmod +x .github/scripts/setup-workenv.sh
          source .github/scripts/setup-workenv.sh
      
      - name: 📦 Package Taster
        shell: bash
        run: |
          source workenv/flavor_*/bin/activate
          cd helpers/taster
          
          # Determine platform string
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/')
          PLATFORM="${OS}_${ARCH}"
          
          # Set launcher binary path if needed
          if [ "${{ matrix.launcher }}" = "go" ]; then
            export FLAVOR_LAUNCHER_BIN="$PWD/../bin/flavor-go-launcher"
          elif [ "${{ matrix.launcher }}" = "rust" ]; then
            export FLAVOR_LAUNCHER_BIN="$PWD/../bin/flavor-rs-launcher"
          fi
          
          # Build package with platform-specific name
          flavor package \
            --launcher-bin $FLAVOR_LAUNCHER_BIN \
            --output dist/taster-${PLATFORM}.psp \
            --key-seed test123
      
      - name: 🧪 Test Taster Package
        shell: bash
        run: |
          chmod +x .github/scripts/test-package.sh
          .github/scripts/test-package.sh helpers/taster/dist/taster-*.psp
      
      - name: 📤 Upload Taster Package
        uses: actions/upload-artifact@v4
        with:
          name: taster-${{ matrix.os == 'ubuntu-latest' && 'linux_amd64' || 'darwin_arm64' }}-${{ matrix.launcher }}
          path: helpers/taster/dist/taster-*.psp
          retention-days: 7