name: 03 🌶️ Flavor Pipeline

on:
  workflow_dispatch:
    inputs:
      helper_run_id:
        description: 'Helper Prep run ID (leave empty for latest)'
        type: string
        required: false
      test_filter:
        description: 'Test filter (e.g., -k test_name or -m marker)'
        type: string
        required: false
      platforms:
        description: 'Comma-separated platforms to build/test (e.g. linux_amd64,darwin_arm64). Empty = all.'
        type: string
        required: false
        default: ''
  
  workflow_run:
    workflows: ["01 🥘 Helper Prep"]
    types: [completed]
    branches: [main, develop]

jobs:
  # Setup and download helper artifacts
  setup:
    name: 🔧 Setup & Get Helpers
    runs-on: ubuntu-24.04
    outputs:
      helper_version: ${{ steps.helpers.outputs.version }}
      helper_run_id: ${{ steps.helpers.outputs.run_id }}
      test_matrix: ${{ steps.matrix.outputs.matrix }}
      build_matrix: ${{ steps.build_matrix.outputs.matrix }}
      psp_test_matrix: ${{ steps.build_matrix.outputs.psp_test_matrix }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔧 Ensure gh CLI available
        run: type gh >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq gh)

      - name: 🔍 Determine helper version
        id: helpers
        run: |
          # Source the script to get RUN_ID and VERSION
          source ci/get-helper-run.sh "${{ inputs.helper_run_id }}"
          
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}
      
      - name: 📥 Download helper artifacts
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow: 01-helper-prep.yml
          run_id: ${{ steps.helpers.outputs.run_id }}
          name: flavor-helpers-${{ steps.helpers.outputs.version }}-all
          path: ./helpers-dist
      
      - name: 📤 Upload helpers for test jobs
        uses: actions/upload-artifact@v7
        with:
          name: test-helpers-${{ github.run_id }}
          path: |
            helpers-dist/*.zip
      
      - name: 🧪 Define test matrix
        id: matrix
        run: |
          # Define test categories
          cat > matrix.json << 'EOF'
          {
            "include": [
              {"name": "unit", "runner": "ubuntu-24.04", "marker": "unit", "timeout": 10},
              {"name": "integration", "runner": "ubuntu-24.04", "marker": "integration", "timeout": 20},
              {"name": "security", "runner": "ubuntu-24.04", "marker": "security", "timeout": 15},
              {"name": "format-2025", "runner": "ubuntu-24.04", "path": "tests/format_2025", "timeout": 30},
              {"name": "packaging", "runner": "ubuntu-24.04", "path": "tests/packaging", "timeout": 25},
              {"name": "cross-language", "runner": "ubuntu-24.04", "marker": "cross_language", "timeout": 30},
              {"name": "parity", "runner": "ubuntu-24.04", "marker": "parity", "timeout": 10, "parity_report": true}
            ]
          }
          EOF
          
          MATRIX=$(cat matrix.json | jq -c .)
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Test matrix: $MATRIX"

      - name: 📦 Define build matrix
        id: build_matrix
        run: ci/build-flavor-matrix.sh "${{ inputs.platforms }}"

  # Run tests in parallel
  test:
    name: 🧪 Test ${{ matrix.name }}
    needs: setup
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.test_matrix) }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      
      - name: 📥 Download helpers
        uses: actions/download-artifact@v8
        with:
          name: test-helpers-${{ github.run_id }}
          path: ./helpers-dist
      
      - name: 🔧 Extract helpers
        run: |
          ci/download-helpers.sh helpers-dist "${{ needs.setup.outputs.helper_version }}" "linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64 windows_arm64"

          # List available helpers
          ls -la helpers/bin/
      
      - name: 📦 Setup uv + Python
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: '3.11'
          enable-cache: true

      - name: 📦 Install dependencies
        run: |
          # Create virtual environment
          uv venv workenv
          source workenv/bin/activate

          # Install project with dev dependency group
          # PEP 735 dependency groups work with uv pip install when using --group flag
          uv pip install --group dev -e .

          # Install sibling packages if needed
          if [ -f "../pyvider-telemetry/pyproject.toml" ]; then
            uv pip install -e "../pyvider-telemetry"
          fi

      - name: 🧪 Run tests
        run: |
          source workenv/bin/activate
          EXTRA_ARGS=""
          if [ "${{ matrix.parity_report }}" = "true" ]; then
            EXTRA_ARGS="--parity-report"
          fi
          ci/run-tests.sh "${{ matrix.marker }}" "${{ matrix.path }}" "${{ inputs.test_filter }}" "$EXTRA_ARGS"
        env:
          FLAVOR_REQUIRE_HELPERS: "1"

      - name: 📊 Upload parity report
        if: matrix.parity_report == true && always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-report-${{ github.run_id }}
          path: reports/parity-report.md
        continue-on-error: true

      - name: 📊 Collect Test Metadata
        if: always()
        run: |
          python3 ci/test-metadata.py collect test-metadata
        continue-on-error: true
      
      - name: 📊 Test Summary
        if: always()
        uses: test-summary/action@v2.4
        with:
          paths: |
            pytest-results.xml
        continue-on-error: true
      
      - name: 📊 Upload coverage
        if: always()
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          flags: ${{ matrix.name }}
          name: flavor-coverage-${{ matrix.name }}
        continue-on-error: true
      
      - name: 📤 Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.name }}-${{ github.run_id }}
          path: |
            pytest-results.xml
            test-report.json
            .coverage
            coverage.xml
            coverage.json
            htmlcov/
            test-outputs/
            test-metadata/
          retention-days: 30
          if-no-files-found: warn

  # Build platform-specific Python wheels with helpers
  build-wheels:
    name: 🎡 Build Wheel ${{ matrix.platform }}
    needs: [setup]  # Run in parallel with tests, not after
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_amd64
            runner: ubuntu-24.04
            python_platform: manylinux2014_x86_64
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
            python_platform: manylinux2014_aarch64
          - platform: darwin_amd64
            runner: macos-15-intel
            python_platform: macosx_10_9_x86_64
          - platform: darwin_arm64
            runner: macos-15
            python_platform: macosx_11_0_arm64
          # Windows re-enabled
          - platform: windows_amd64
            runner: windows-2025
            python_platform: win_amd64
          - platform: windows_arm64
            runner: windows-11-arm
            python_platform: win_arm64
    continue-on-error: ${{ matrix.continue_on_error == true }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # setup-python MUST come before setup-uv here.
      # uv's python-build-standalone has no Python 3.11 ARM64 Windows build —
      # it only added Windows ARM64 support starting with Python 3.13.
      # Official CPython has had ARM64 Windows builds since 3.11.0, and
      # actions/setup-python@v6 installs the native ARM64 binary on
      # windows-11-arm runners. setup-uv then finds and uses that system
      # Python instead of downloading an x86_64 fallback.
      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 📦 Setup uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true

      - name: 📥 Download Go helpers
        uses: dawidd6/action-download-artifact@v19
        continue-on-error: true
        with:
          workflow: 01-helper-prep.yml
          run_id: ${{ needs.setup.outputs.helper_run_id }}
          name: flavor-go-helpers-${{ needs.setup.outputs.helper_version }}-${{ matrix.platform }}
          path: ./helpers-dist

      - name: 📥 Download Rust helpers
        uses: dawidd6/action-download-artifact@v19
        continue-on-error: true
        with:
          workflow: 01-helper-prep.yml
          run_id: ${{ needs.setup.outputs.helper_run_id }}
          name: flavor-rust-helpers-${{ needs.setup.outputs.helper_version }}-${{ matrix.platform }}
          path: ./helpers-dist


      - name: 🔧 Extract and organize helpers
        shell: bash
        run: |
          # Create the helpers directory structure
          mkdir -p src/flavor/helpers/bin
          
          # Extract platform-specific helpers
          ci/download-helpers.sh helpers-dist "${{ needs.setup.outputs.helper_version }}" "${{ matrix.platform }}"
          
          # Copy ONLY the versioned platform-specific helpers to the package location
          echo "Copying ONLY versioned ${{ matrix.platform }} helpers to src/flavor/helpers/bin..."
          
          # Copy only versioned files for the CURRENT version that end with the platform name
          # e.g., flavor-go-launcher-0.3.0-linux_arm64 but NOT flavor-go-launcher-0.2.9-linux_arm64
          VERSION="${{ needs.setup.outputs.helper_version }}"
          # Windows binaries have .exe extension
          if [[ "${{ matrix.platform }}" == "windows_"* ]]; then
            for binary in helpers/bin/*-${VERSION}-${{ matrix.platform }}.exe; do
              if [ -f "$binary" ]; then
                cp -v "$binary" src/flavor/helpers/bin/
              fi
            done
          else
            for binary in helpers/bin/*-${VERSION}-${{ matrix.platform }}; do
              if [ -f "$binary" ]; then
                cp -v "$binary" src/flavor/helpers/bin/
              fi
            done
          fi
          
          # Make sure they're executable
          chmod +x src/flavor/helpers/bin/* || true
          
          # Verify we only have platform-specific binaries and no duplicates
          echo ""
          echo "Verifying helpers for ${{ matrix.platform }}:"
          for file in src/flavor/helpers/bin/*; do
            if [ -f "$file" ]; then
              base=$(basename "$file")
              # Check if the file ends with the correct platform suffix
              # Windows files end with .exe extension
              if [[ "${{ matrix.platform }}" == "windows_"* ]]; then
                if [[ "$base" == *"-${{ matrix.platform }}.exe" ]]; then
                  echo "✅ $base (correct platform)"
                else
                  echo "❌ $base (WRONG platform - removing)"
                  rm "$file"
                fi
              else
                if [[ "$base" == *"-${{ matrix.platform }}" ]]; then
                  echo "✅ $base (correct platform)"
                else
                  echo "❌ $base (WRONG platform - removing)"
                  rm "$file"
                fi
              fi
            fi
          done
          
          # Final count and list
          echo ""
          count=$(ls -1 src/flavor/helpers/bin/ | wc -l)
          echo "Final helpers for ${{ matrix.platform }} in wheel: $count files (should be 4: 2 launchers + 2 builders)"
          ls -la src/flavor/helpers/bin/
      
      - name: 📦 Install build tools
        shell: bash
        run: |
          uv venv .venv
          uv pip install build wheel setuptools

      - name: 🎡 Build platform wheel
        shell: bash
        run: |
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate 2>/dev/null
          ci/build-platform-wheel.sh "${{ matrix.python_platform }}"
      
      - name: 🔍 Validate wheel structure
        shell: bash
        run: |
          # Basic validation that the wheel has the expected structure
          echo "Validating wheel structure..."
          
          # Check that wheel contains the flavor package
          python -m zipfile -l dist/*.whl | grep -q "^flavor/" && echo "✅ Flavor package found in wheel" || echo "❌ Flavor package not found"
          
          # Check that wheel contains platform-specific helpers
          python -m zipfile -l dist/*.whl | grep -q "flavor/helpers/bin/" && echo "✅ Helpers found in wheel" || echo "❌ Helpers not found"
          
          # List the helpers in the wheel
          echo ""
          echo "Platform-specific helpers in wheel:"
          python -m zipfile -l dist/*.whl | grep "flavor/helpers/bin/" | grep -v "/$" || echo "No helpers found"
          
          # Verify we only have this platform's helpers
          helper_count=$(python -m zipfile -l dist/*.whl | grep "flavor/helpers/bin/flavor-" | wc -l)
          echo "Helper binaries count: $helper_count (should be 2-4 for builders/launchers)"
          
          # Check that wheel contains metadata
          python -m zipfile -l dist/*.whl | grep -q "\.dist-info/METADATA" && echo "✅ Metadata found in wheel" || echo "❌ Metadata not found"
      
      - name: 📤 Upload platform wheel
        uses: actions/upload-artifact@v7
        with:
          name: flavor-wheel-${{ needs.setup.outputs.helper_version }}-${{ matrix.platform }}
          path: dist/*.whl
          retention-days: 30

  # Build Flavor PSP packages using the wheel
  build-flavor:
    name: 📦 Build Flavor ${{ matrix.platform }}
    needs: [setup, test, build-wheels]  # Still waits for both to complete
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.build_matrix) }}
    continue-on-error: ${{ matrix.continue_on_error == true }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # setup-python MUST come before setup-uv here.
      # uv's python-build-standalone has no Python 3.11 ARM64 Windows build —
      # it only added Windows ARM64 support starting with Python 3.13.
      # Official CPython has had ARM64 Windows builds since 3.11.0, and
      # actions/setup-python@v6 installs the native ARM64 binary on
      # windows-11-arm runners. setup-uv then finds and uses that system
      # Python instead of downloading an x86_64 fallback, which would cause
      # uv to reject the win_arm64 wheel as incompatible.
      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 📦 Setup uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true

      - name: 📥 Download platform wheel
        uses: actions/download-artifact@v8
        with:
          name: flavor-wheel-${{ needs.setup.outputs.helper_version }}-${{ matrix.platform }}
          path: ./wheel-dist
      
      - name: 📥 Download Go helpers
        uses: dawidd6/action-download-artifact@v19
        continue-on-error: true
        with:
          workflow: 01-helper-prep.yml
          run_id: ${{ needs.setup.outputs.helper_run_id }}
          name: flavor-go-helpers-${{ needs.setup.outputs.helper_version }}-${{ matrix.platform }}
          path: ./helpers-dist

      - name: 📥 Download Rust helpers
        uses: dawidd6/action-download-artifact@v19
        continue-on-error: true
        with:
          workflow: 01-helper-prep.yml
          run_id: ${{ needs.setup.outputs.helper_run_id }}
          name: flavor-rust-helpers-${{ needs.setup.outputs.helper_version }}-${{ matrix.platform }}
          path: ./helpers-dist

      - name: 🔧 Extract helpers
        shell: bash
        run: |
          ci/download-helpers.sh helpers-dist "${{ needs.setup.outputs.helper_version }}" "${{ matrix.platform }}"
          ls -la helpers/bin/
      
      - name: 📦 Install Flavor from wheel
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash ci/install-flavor-wheel.sh wheel-dist "${{ matrix.platform }}"

      - name: 🔧 Prepare Flavor build
        id: prepare
        shell: bash
        run: |
          # Determine binary extension for Windows
          EXT=""
          if [[ "${{ matrix.platform }}" == "windows_"* ]]; then
            EXT=".exe"
          fi

          # Find the appropriate launcher
          LAUNCHER="helpers/bin/flavor-rs-launcher-${{ needs.setup.outputs.helper_version }}-${{ matrix.platform }}${EXT}"
          if [ ! -f "$LAUNCHER" ]; then
            LAUNCHER="helpers/bin/flavor-rs-launcher-${{ matrix.platform }}${EXT}"
          fi

          if [ ! -f "$LAUNCHER" ]; then
            echo "❌ Launcher not found"
            ls -la helpers/bin/
            exit 1
          fi

          # Find the wheel
          WHEEL=$(find wheel-dist -name "flavorpack-*.whl" | head -1)

          if [ -z "$WHEEL" ]; then
            echo "❌ Wheel not found"
            ls -la wheel-dist/
            exit 1
          fi

          echo "launcher=$LAUNCHER" >> $GITHUB_OUTPUT
          echo "wheel=$WHEEL" >> $GITHUB_OUTPUT

      - name: 📦 Pre-warm wheel cache for offline PSPF build
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash ci/prewarm-wheel-cache.sh "$GITHUB_WORKSPACE/.flavor-wheel-cache"
        continue-on-error: true

      - name: 🔨 Build Flavor PSP using itself
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export PIP_RETRIES=10
          export PIP_TIMEOUT=120
          export PYTHONIOENCODING=utf-8
          export PYTHONUTF8=1
          export FLAVOR_LOG_LEVEL=trace
          ci/build-flavor-self.sh "${{ matrix.platform }}" "${{ needs.setup.outputs.helper_version }}" "${{ steps.prepare.outputs.wheel }}" "${{ steps.prepare.outputs.launcher }}"

      - name: 📤 Upload Flavor package
        uses: actions/upload-artifact@v7
        with:
          name: flavor-${{ needs.setup.outputs.helper_version }}-${{ matrix.platform }}
          path: |
            artifacts/flavor-*.psp
            artifacts/flavor-*.exe
  
  # Test Flavor PSP packages are self-contained
  test-flavor-psp:
    name: 🧪 Test Flavor PSP ${{ matrix.platform }}
    needs: [setup, build-flavor]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.psp_test_matrix) }}
    continue-on-error: ${{ matrix.continue_on_error == true }}
    steps:
      - name: 📥 Checkout scripts
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            ci/
          sparse-checkout-cone-mode: false

      - name: 📥 Download Flavor package
        uses: actions/download-artifact@v8
        with:
          name: flavor-${{ needs.setup.outputs.helper_version }}-${{ matrix.platform }}
          path: ./

      - name: 🧪 Test Flavor PSP self-contained
        shell: bash
        env:
          FLAVOR_LOG_LEVEL: trace
        run: |
          ci/test-flavor-self-contained.sh "${{ matrix.platform }}"
      
      - name: 📤 Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flavor-psp-test-${{ matrix.platform }}-${{ github.run_id }}
          path: test-result.txt
          if-no-files-found: ignore

  # Summary and validation
  validate:
    name: ✅ Validate & Summary
    needs: [setup, test, build-wheels, build-flavor, test-flavor-psp]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      
      - name: 📥 Download test results
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          path: test-results
      
      - name: 📥 Download wheels
        if: needs.build-wheels.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: flavor-wheel-${{ needs.setup.outputs.helper_version }}-*
          path: wheel-artifacts
          merge-multiple: true
        continue-on-error: true
      
      - name: 🔍 Validate wheel contents
        if: needs.build-wheels.result == 'success'
        run: |
          if ls wheel-artifacts/*.whl 2>/dev/null | head -1 | grep -q .; then
            python3 tools/validate_wheel.py --all --dist-dir wheel-artifacts/
          else
            echo "No wheel files found to validate"
          fi

      - name: 📥 Download Flavor packages
        if: needs.build-flavor.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: flavor-${{ needs.setup.outputs.helper_version }}-*
          path: flavor-artifacts
          merge-multiple: true

      - name: 📊 Generate summary
        run: |
          echo "## 🌶️ Flavor Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Helper Version:** ${{ needs.setup.outputs.helper_version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Parse test results
          for result_dir in test-results/test-results-*; do
            if [ -d "$result_dir" ]; then
              TEST_NAME=$(basename "$result_dir" | sed 's/test-results-//' | sed "s/-${{ github.run_id }}//")
              echo "- **$TEST_NAME**: " >> $GITHUB_STEP_SUMMARY
              
              if [ -f "$result_dir/pytest-results.xml" ]; then
                # Parse pytest XML for pass/fail counts
                echo "✅ Completed" >> $GITHUB_STEP_SUMMARY
              else
                echo "⚠️ No results" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          done
          
          # Show wheel artifacts if they were built
          if [ -d "wheel-artifacts" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🎡 Python Wheels" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            for wheel in wheel-artifacts/*.whl; do
              if [ -f "$wheel" ]; then
                SIZE=$(du -h "$wheel" | cut -f1)
                echo "- \`$(basename "$wheel")\` ($SIZE)" >> $GITHUB_STEP_SUMMARY
              fi
            done
          fi
          
          # Only show Flavor packages section if they were built
          if [ -d "flavor-artifacts" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📦 Flavor & Taster Packages" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # List Flavor packages
            echo "#### Flavor PSP Packages:" >> $GITHUB_STEP_SUMMARY
            for pkg in flavor-artifacts/flavor-*.psp flavor-artifacts/flavor-*.exe; do
              if [ -f "$pkg" ]; then
                SIZE=$(du -h "$pkg" | cut -f1)
                echo "- \`$(basename "$pkg")\` ($SIZE)" >> $GITHUB_STEP_SUMMARY
              fi
            done
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Taster Test Packages:" >> $GITHUB_STEP_SUMMARY
            for pkg in flavor-artifacts/taster-*.psp flavor-artifacts/taster-*.exe; do
              if [ -f "$pkg" ]; then
                SIZE=$(du -h "$pkg" | cut -f1)
                echo "- \`$(basename "$pkg")\` ($SIZE)" >> $GITHUB_STEP_SUMMARY
              fi
            done
          fi
          
          # Add PSP test results
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🧪 Flavor PSP Self-Contained Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.test-flavor-psp.result }}" == "success" ]; then
            echo "✅ All Flavor PSP packages verified successfully (self-contained, no external dependencies)" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.test-flavor-psp.result }}" == "skipped" ]; then
            echo "⏭️ PSP tests were skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some PSP self-contained tests failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- [View test results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "- [Download Flavor packages](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)" >> $GITHUB_STEP_SUMMARY
      
      - name: 🎯 Check status
        run: |
          # Check if any test job failed
          if [ "${{ needs.test.result }}" != "success" ]; then
