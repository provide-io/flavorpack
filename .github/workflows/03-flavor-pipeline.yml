name: 03 🌶️ Flavor Pipeline

on:
  workflow_dispatch:
    inputs:
      helper_run_id:
        description: 'Helper Prep run ID (leave empty for latest)'
        type: string
        required: false
      test_filter:
        description: 'Test filter (e.g., -k test_name or -m marker)'
        type: string
        required: false

jobs:
  setup:
    name: 🔧 Setup & Get Helpers
    runs-on: ubuntu-24.04
    outputs:
      helper_version: ${{ steps.helpers.outputs.version }}
      helper_run_id: ${{ steps.helpers.outputs.run_id }}
      test_matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔍 Determine helper version
        id: helpers
        run: .github/scripts/determine-helper-version.sh "${{ inputs.helper_run_id }}"
        env:
          GH_TOKEN: ${{ github.token }}
      
      - name: 📥 Download helper artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: 01-helper-prep.yml
          run_id: ${{ steps.helpers.outputs.run_id }}
          name: flavor-helpers-${{ steps.helpers.outputs.version }}-all
          path: ./helpers-dist
      
      - name: 📤 Upload helpers for test jobs
        uses: actions/upload-artifact@v4
        with:
          name: test-helpers-${{ github.run_id }}
          path: |
            helpers-dist/*.zip
      
      - name: 🧪 Define test matrix
        id: matrix
        run: |
          MATRIX=$(bash .github/scripts/create-test-matrix.sh)
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Test matrix: $MATRIX"

  test:
    name: 🧪 Test ${{ matrix.name }}
    needs: setup
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.test_matrix) }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 📥 Download helpers
        uses: actions/download-artifact@v4
        with:
          name: test-helpers-${{ github.run_id }}
          path: ./helpers-dist
      
      - name: 🔧 Extract helpers
        run: .github/scripts/download-helpers.sh helpers-dist "${{ needs.setup.outputs.helper_version }}" "linux_amd64 linux_arm64 darwin_amd64 darwin_arm64"
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: 📦 Install dependencies
        run: .github/scripts/install-dependencies.sh

      - name: 🧪 Run tests
        shell: bash
        run: |
          source workenv/bin/activate
          .github/scripts/run-tests.sh "${{ matrix.marker }}" "${{ matrix.path }}" "${{ inputs.test_filter }}"
      
      - name: 📊 Collect Test Metadata
        if: always()
        run: python3 .github/scripts/test-metadata.py collect test-metadata
        continue-on-error: true
      
      - name: 📊 Test Summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: |
            pytest-results.xml
        continue-on-error: true
      
      - name: 📊 Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: ${{ matrix.name }}
          name: flavor-coverage-${{ matrix.name }}
        continue-on-error: true
      
      - name: 📤 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}-${{ github.run_id }}
          path: |
            pytest-results.xml
            test-report.json
            .coverage
            coverage.xml
            coverage.json
            htmlcov/
            test-outputs/
            test-metadata/
          retention-days: 30
          if-no-files-found: warn

  build-wheels:
    name: 🎡 Build Wheel ${{ matrix.platform }}
    needs: [setup]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux_amd64, runner: ubuntu-24.04, python_platform: manylinux2014_x86_64 }
          - { platform: linux_arm64, runner: ubuntu-24.04-arm, python_platform: manylinux2014_aarch64 }
          - { platform: darwin_amd64, runner: macos-15-intel, python_platform: macosx_11_0_x86_64 }
          - { platform: darwin_arm64, runner: macos-15, python_platform: macosx_11_0_arm64 }
          - { platform: windows_amd64, runner: windows-2025, python_platform: win_amd64 }
          - { platform: windows_arm64, runner: windows-11-arm, python_platform: win_arm64 }
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📥 Download platform-specific helpers
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: 01-helper-prep.yml
          run_id: ${{ needs.setup.outputs.helper_run_id }}
          name: flavor-helpers-${{ needs.setup.outputs.helper_version }}-${{ matrix.platform }}
          path: ./helpers-dist

      - name: 🔧 Extract and organize helpers
        shell: bash
        run: .github/scripts/organize-platform-helpers.sh "${{ matrix.platform }}" "helpers-dist/flavor-helpers-${{ needs.setup.outputs.helper_version }}-${{ matrix.platform }}.zip" "src/flavor/helpers/bin" "${{ needs.setup.outputs.helper_version }}"

      - name: 🎡 Build platform wheel
        shell: bash
        run: .github/scripts/build-platform-wheel.sh "${{ matrix.python_platform }}"
      
      - name: 🔍 Validate wheel structure
        shell: bash
        run: |
          WHEEL_FILE=$(ls dist/*.whl | head -1)
          if [ -z "$WHEEL_FILE" ]; then
            echo "❌ No wheel file found in dist/"
            exit 1
          fi
          .github/scripts/validate-wheel-structure.sh "$WHEEL_FILE" "${{ matrix.platform }}"
      
      - name: 📤 Upload platform wheel
        uses: actions/upload-artifact@v4
        with:
          name: flavor-wheel-${{ needs.setup.outputs.helper_version }}-${{ matrix.platform }}
          path: dist/*.whl
          retention-days: 30

  build-flavor:
    name: 📦 Build Flavor ${{ matrix.platform }}
    needs: [setup, test, build-wheels]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux_amd64, runner: ubuntu-24.04 }
          - { platform: linux_arm64, runner: ubuntu-24.04-arm }
          - { platform: darwin_amd64, runner: macos-15-intel }
          - { platform: darwin_arm64, runner: macos-15 }
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 📥 Download platform wheel
        uses: actions/download-artifact@v4
        with:
          name: flavor-wheel-${{ needs.setup.outputs.helper_version }}-${{ matrix.platform }}
          path: ./wheel-dist

      - name: 📥 Download helper artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: 01-helper-prep.yml
          name: flavor-helpers-${{ needs.setup.outputs.helper_version }}-${{ matrix.platform }}
          path: ./helpers-dist

      - name: 🔧 Extract helpers
        shell: bash
        run: .github/scripts/download-helpers.sh helpers-dist "${{ needs.setup.outputs.helper_version }}" "${{ matrix.platform }}"

      - name: 📦 Install Flavor from wheel
        shell: bash
        run: |
          WHEEL=$(find wheel-dist -name "flavorpack-*.whl" | head -1)
          if [ -z "$WHEEL" ]; then
            echo "❌ Flavor wheel not found for ${{ matrix.platform }}"
            exit 1
          fi
          uv tool install "$WHEEL"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          which flavor
          flavor --version
      
      - name: 🔧 Prepare Flavor build
        id: prepare
        shell: bash
        run: .github/scripts/prepare-flavor-build.sh "${{ matrix.platform }}" "${{ needs.setup.outputs.helper_version }}" "wheel-dist"

      - name: 🔨 Build Flavor PSP using itself (with retry)
        uses: Wandalen/wretry.action@v3.5.0
        with:
          attempt_limit: 5
          attempt_delay: 15000
          command: bash -c 'export PIP_RETRIES=10 && export PIP_TIMEOUT=120 && export PYTHONIOENCODING=utf-8 && export PYTHONUTF8=1 && export FLAVOR_LOG_LEVEL=trace && .github/scripts/build-flavor-self.sh "${{ matrix.platform }}" "${{ needs.setup.outputs.helper_version }}" "${{ steps.prepare.outputs.wheel }}" "${{ steps.prepare.outputs.launcher }}"'
      
      - name: 📤 Upload Flavor package
        uses: actions/upload-artifact@v4
        with:
          name: flavor-${{ needs.setup.outputs.helper_version }}-${{ matrix.platform }}
          path: |
            artifacts/flavor-*.psp
            artifacts/flavor-*.psp.exe

  test-flavor-psp:
    name: 🧪 Test Flavor PSP ${{ matrix.platform }}
    needs: [setup, build-flavor]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux_amd64, runner: ubuntu-24.04 }
          - { platform: linux_arm64, runner: ubuntu-24.04-arm }
          - { platform: darwin_amd64, runner: macos-15-intel }
          - { platform: darwin_arm64, runner: macos-15 }
          # Windows: wheels built only, no PSP packages
    steps:
      - name: 📥 Checkout scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false
      
      - name: 📥 Download Flavor package
        uses: actions/download-artifact@v4
        with:
          name: flavor-${{ needs.setup.outputs.helper_version }}-${{ matrix.platform }}
          path: ./
      
      - name: 🧪 Test Flavor PSP self-contained
        shell: bash
        env:
          FLAVOR_LOG_LEVEL: trace
        run: .github/scripts/test-flavor-self-contained.sh "${{ matrix.platform }}"
      
      - name: 📤 Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flavor-psp-test-${{ matrix.platform }}-${{ github.run_id }}
          path: test-result.txt

  validate:
    name: ✅ Validate & Summary
    needs: [setup, test, build-wheels, build-flavor, test-flavor-psp]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 📥 Download test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: test-results
      
      - name: 📥 Download wheels
        if: needs.build-wheels.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: flavor-wheels-${{ needs.setup.outputs.helper_version }}
          path: wheel-artifacts
        continue-on-error: true
      
      - name: 📥 Download Flavor packages
        if: needs.build-flavor.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: flavor-${{ needs.setup.outputs.helper_version }}-*
          path: flavor-artifacts
          merge-multiple: true
      
      - name: 📊 Generate summary
        run: .github/scripts/generate-flavor-summary.sh "${{ needs.setup.outputs.helper_version }}" "${{ needs.test-flavor-psp.result }}" "${{ github.repository }}" "${{ github.run_id }}"
      
      - name: 🎯 Check status
        run: .github/scripts/check-status.sh "${{ needs.test.result }}" "${{ needs.build-wheels.result }}" "${{ needs.build-flavor.result }}" "${{ needs.test-flavor-psp.result }}"
