name: Build All Helpers

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all helpers'
        required: false
        default: false
        type: boolean
  workflow_call:
    outputs:
      artifact-name:
        description: 'Name of combined artifact'
        value: 'all-helpers'
  # Disabled automatic triggers - use simple-ci.yml instead
  # push:
  #   branches: [main, develop, "feature/*"]
  #   paths:
  #     - 'helpers/**'
  #     - '.github/workflows/helpers-*.yml'
  # pull_request:
  #   branches: [main, develop]
  #   paths:
  #     - 'helpers/**'
  #     - '.github/workflows/helpers-*.yml'

jobs:
  # Build Go helpers
  go-helpers:
    name: Go Helpers
    needs: check-cache
    if: needs.check-cache.outputs.cache-hit != 'true'
    uses: ./.github/workflows/helpers-go.yml
    secrets: inherit

  # Build Rust helpers
  rust-helpers:
    name: Rust Helpers
    needs: check-cache
    if: needs.check-cache.outputs.cache-hit != 'true'
    uses: ./.github/workflows/helpers-rust.yml
    secrets: inherit

  # Check if we can use cached helpers
  check-cache:
    name: Check Helper Cache
    runs-on: ubuntu-24.04
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔑 Generate cache key
        id: cache-key
        run: |
          # Generate hash from all helper source files
          HASH=$(find helpers -type f \( -name "*.go" -o -name "*.rs" -o -name "*.toml" -o -name "*.mod" -o -name "*.sum" -o -name "Makefile" \) -exec sha256sum {} \; | sort | sha256sum | cut -d' ' -f1)
          echo "key=helpers-all-platforms-$HASH" >> $GITHUB_OUTPUT
          echo "📦 Cache key: helpers-all-platforms-$HASH"
      
      - name: 💾 Check cache
        id: cache
        uses: actions/cache@v4
        with:
          path: cached-helpers
          key: ${{ steps.cache-key.outputs.key }}
          lookup-only: true
      
      - name: 📊 Cache status
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" == "true" ]; then
            echo "✅ Cache hit! Helpers will be restored from cache."
          else
            echo "🔨 Cache miss. Helpers will be built fresh."
          fi

  # Combine all helpers into a single artifact
  combine-helpers:
    name: Combine All Helpers
    runs-on: ubuntu-24.04
    needs: [go-helpers, rust-helpers, check-cache]
    if: needs.check-cache.outputs.cache-hit != 'true'
    
    steps:
      - name: 📥 Download all Go helpers
        uses: actions/download-artifact@v4
        with:
          pattern: flavor-go-helpers-*
          path: helpers/go
      
      - name: 📥 Download all Rust helpers
        uses: actions/download-artifact@v4
        with:
          pattern: flavor-rs-helpers-*
          path: helpers/rust
      
      - name: 📦 Organize helpers
        run: |
          echo "📦 Organizing all helper artifacts..."
          
          # List all downloaded artifacts
          echo "📁 Go helpers:"
          ls -la helpers/go/ || echo "No Go helpers"
          
          echo "📁 Rust helpers:"
          ls -la helpers/rust/ || echo "No Rust helpers"
          
          # Create combined directory preserving structure
          mkdir -p all-helpers
          
          # Copy all helper directories
          cp -r helpers/go/* all-helpers/ 2>/dev/null || true
          cp -r helpers/rust/* all-helpers/ 2>/dev/null || true
          
          # Count platforms
          PLATFORM_COUNT=$(ls -d all-helpers/flavor-*-helpers-* 2>/dev/null | wc -l || echo 0)
          
          echo "📊 Summary:"
          echo "  Total platform builds: $PLATFORM_COUNT"
          echo "  Expected: 10 (2 languages × 5 platforms)"
          
          # List final structure
          echo "📦 Final artifact structure:"
          ls -la all-helpers/
      
      - name: 💾 Save to cache
        uses: actions/cache@v4
        with:
          path: all-helpers
          key: ${{ needs.check-cache.outputs.cache-key }}
      
      - name: 📤 Upload combined helpers
        uses: actions/upload-artifact@v4
        with:
          name: all-helpers
          path: all-helpers/
          retention-days: 30

  # Restore cached helpers when available
  restore-cached-helpers:
    name: Restore Cached Helpers
    runs-on: ubuntu-24.04
    needs: check-cache
    if: needs.check-cache.outputs.cache-hit == 'true'
    
    steps:
      - name: 💾 Restore from cache
        uses: actions/cache@v4
        with:
          path: cached-helpers
          key: ${{ needs.check-cache.outputs.cache-key }}
      
      - name: 📤 Upload restored helpers
        uses: actions/upload-artifact@v4
        with:
          name: all-helpers
          path: cached-helpers/
          retention-days: 30


  # Summary job
  summary:
    name: Build Summary
    runs-on: ubuntu-24.04
    needs: [check-cache, go-helpers, rust-helpers, combine-helpers, restore-cached-helpers]
    if: always()
    
    steps:
      - name: 📊 Summary
        run: |
          echo "## 📊 Build Summary"
          echo ""
          
          # Show cache status
          if [ "${{ needs.check-cache.outputs.cache-hit }}" == "true" ]; then
            echo "### 💾 Cache Status:"
            echo "✅ **Cache hit! Helpers restored from cache.**"
            echo ""
          else
            echo "### 💾 Cache Status:"
            echo "🔨 **Cache miss. Helpers built fresh.**"
            echo ""
          fi
          
          echo "### Helper Builds:"
          if [ "${{ needs.check-cache.outputs.cache-hit }}" == "true" ]; then
            echo "- Go Helpers: skipped (cached)"
            echo "- Rust Helpers: skipped (cached)"
          else
            echo "- Go Helpers: ${{ needs.go-helpers.result }}"
            echo "- Rust Helpers: ${{ needs.rust-helpers.result }}"
          fi
          echo ""
          
          # Check if everything succeeded
          if [ "${{ needs.go-helpers.result }}" == "success" ] || [ "${{ needs.go-helpers.result }}" == "skipped" ]; then
            if [ "${{ needs.rust-helpers.result }}" == "success" ] || [ "${{ needs.rust-helpers.result }}" == "skipped" ]; then
              echo "✅ **All helper builds completed successfully!**"
              echo ""
              echo "### Next Steps:"
              echo "- Integration tests will run automatically if this was a push/PR"
              echo "- Or manually trigger the 'Integration Tests' workflow"
              exit 0
            fi
          fi
          
          echo "⚠️ **Some builds failed or were skipped**"
          exit 1