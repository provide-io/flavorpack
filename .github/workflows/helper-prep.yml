name: 01 🥘 Helper Prep
# ─────────────────────────────────────────────────────────────────────────────
# Script policy: keep inline run: blocks to ≤ 3 lines.
# Anything longer belongs in ci/ and should be called from here.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (comma-separated, or "all")'
        type: string
        default: 'all'
        required: false

jobs:
  # ── Setup ──────────────────────────────────────────────────────────────────
  setup:
    name: 📊 Setup
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      go_cache_key_base: ${{ steps.cache.outputs.go_key_base }}
      rust_cache_key_base: ${{ steps.cache.outputs.rust_key_base }}
      tastesh_cache_key_base: ${{ steps.cache.outputs.tastesh_key_base }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 🔍 Get version
        id: version
        run: |
          VERSION=$(cat VERSION || echo "0.0.1")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

      - name: 🔑 Calculate cache key bases
        id: cache
        run: |
          GO_HASH=$(find src/flavor-go -type f \( -name "*.go" -o -name "go.mod" \) | sort | xargs sha256sum | sha256sum | cut -d' ' -f1 | head -c 16)
          RUST_HASH=$(find src/flavor-rs -type f \( -name "*.rs" -o -name "Cargo.toml" \) | sort | xargs sha256sum | sha256sum | cut -d' ' -f1 | head -c 16)
          TASTESH_HASH=$(sha256sum ci/build-dash.sh | cut -d' ' -f1 | head -c 16)
          echo "go_key_base=go-helpers-$GO_HASH" >> $GITHUB_OUTPUT
          echo "rust_key_base=rust-helpers-$RUST_HASH" >> $GITHUB_OUTPUT
          echo "tastesh_key_base=tastesh-$TASTESH_HASH" >> $GITHUB_OUTPUT
          echo "🔑 Go cache key:   go-helpers-$GO_HASH"
          echo "🔑 Rust cache key: rust-helpers-$RUST_HASH"
          echo "🔑 tastesh cache:  tastesh-$TASTESH_HASH"

      - name: 📋 Setup build matrix
        id: matrix
        run: |
          # Define all platforms as a single-line JSON.
          # In local act mode we keep this to linux_amd64 so the workflow stays executable.
          # FreeBSD platforms have dedicated jobs below; Windows is included here.
          if [ "${ACT:-}" = "true" ]; then
            ALL_PLATFORMS='[{"platform":"linux_amd64","os":"ubuntu-24.04","rust_target":"x86_64-unknown-linux-musl","use_musl":true,"emoji":"🐧"}]'
          else
            ALL_PLATFORMS='[{"platform":"linux_amd64","os":"ubuntu-24.04","rust_target":"x86_64-unknown-linux-musl","use_musl":true,"emoji":"🐧"},{"platform":"linux_arm64","os":"ubuntu-24.04-arm","rust_target":"aarch64-unknown-linux-musl","use_musl":true,"emoji":"🐧"},{"platform":"darwin_amd64","os":"macos-15-intel","rust_target":"x86_64-apple-darwin","use_musl":false,"emoji":"🍎"},{"platform":"darwin_arm64","os":"macos-15","rust_target":"aarch64-apple-darwin","use_musl":false,"emoji":"🍎"},{"platform":"windows_amd64","os":"windows-2022","rust_target":"x86_64-pc-windows-msvc","use_musl":false,"emoji":"🪟"},{"platform":"windows_arm64","os":"windows-11-arm","rust_target":"aarch64-pc-windows-msvc","use_musl":false,"emoji":"🪟"}]'
          fi

          PLATFORMS="${{ inputs.platforms }}"
          if [ "$PLATFORMS" = "all" ] || [ -z "$PLATFORMS" ]; then
            MATRIX="{\"include\":$ALL_PLATFORMS}"
          else
            FILTERED="[]"
            for platform in $(echo "$PLATFORMS" | tr ',' ' '); do
              PLATFORM_JSON=$(echo "$ALL_PLATFORMS" | jq -c ".[] | select(.platform == \"$platform\")")
              if [ -n "$PLATFORM_JSON" ]; then
                FILTERED=$(echo "$FILTERED" | jq -c ". + [$PLATFORM_JSON]")
              fi
            done
            MATRIX="{\"include\":$FILTERED}"
          fi

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "📋 Build matrix: $MATRIX"

  # ── Native platform builds (Linux, macOS, Windows) ─────────────────────────
  # Go and Rust fan out in parallel over the same matrix (12 jobs total).
  build-go:
    name: ${{ matrix.emoji }}🐹 ${{ matrix.platform }}
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    uses: ./.github/workflows/build-go.yml
    with:
      platform: ${{ matrix.platform }}
      os: ${{ matrix.os }}
      use_musl: ${{ matrix.use_musl }}
      version: ${{ needs.setup.outputs.version }}
      go_cache_key_base: ${{ needs.setup.outputs.go_cache_key_base }}

  build-rust:
    name: ${{ matrix.emoji }}🦀 ${{ matrix.platform }}
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    uses: ./.github/workflows/build-rust.yml
    with:
      platform: ${{ matrix.platform }}
      os: ${{ matrix.os }}
      rust_target: ${{ matrix.rust_target }}
      use_musl: ${{ matrix.use_musl }}
      version: ${{ needs.setup.outputs.version }}
      rust_cache_key_base: ${{ needs.setup.outputs.rust_cache_key_base }}

  build-tastesh:
    name: ${{ matrix.emoji }}🐚 ${{ matrix.platform }}
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    uses: ./.github/workflows/build-tastesh.yml
    with:
      platform: ${{ matrix.platform }}
      os: ${{ matrix.os }}
      use_musl: ${{ matrix.use_musl }}
      version: ${{ needs.setup.outputs.version }}
      tastesh_cache_key_base: ${{ needs.setup.outputs.tastesh_cache_key_base }}

  # ── FreeBSD builds (QEMU VM via cross-platform-actions) ────────────────────
  # Separate dedicated jobs because these use a VM action rather than a native runner.
  # cross-platform-actions ships x86-64 QEMU binaries; all jobs run on ubuntu-24.04.
  # freebsd_arm64 is additionally run on ubuntu-24.04-arm to benchmark QEMU performance.
  build-freebsd-amd64:
    name: 😈🔨 freebsd_amd64
    needs: setup
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 💾 Cache FreeBSD helpers
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            dist/bin/flavor-go-*-${{ needs.setup.outputs.version }}-freebsd_amd64
            dist/bin/flavor-rs-*-${{ needs.setup.outputs.version }}-freebsd_amd64
            dist/bin/flavor-tastesh-freebsd_amd64
            artifacts/*.zip
          key: ${{ needs.setup.outputs.go_cache_key_base }}-${{ needs.setup.outputs.rust_cache_key_base }}-${{ needs.setup.outputs.tastesh_cache_key_base }}-freebsd_amd64-${{ needs.setup.outputs.version }}

      - name: 💾 Cache Rust toolchain + registry
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: vm-rust-home
          key: freebsd-rust-amd64-${{ vars.RUST_VERSION }}-${{ hashFiles('src/flavor-rs/Cargo.lock') }}
          restore-keys: freebsd-rust-amd64-${{ vars.RUST_VERSION }}-

      - name: 🏗️ Prep FreeBSD system
        if: steps.cache.outputs.cache-hit != 'true'
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: freebsd
          version: '14.2'
          architecture: x86-64
          shell: bash
          run: ci/freebsd-prep-system.sh

      - name: 🐹 Build Go helpers
        if: steps.cache.outputs.cache-hit != 'true'
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: freebsd
          version: '14.2'
          architecture: x86-64
          shell: bash
          sync_files: runner-to-vm
          run: ci/freebsd-build-go.sh ${{ needs.setup.outputs.version }} amd64

      - name: 🐚 Build tastesh
        if: steps.cache.outputs.cache-hit != 'true'
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: freebsd
          version: '14.2'
          architecture: x86-64
          shell: bash
          sync_files: runner-to-vm
          run: ci/freebsd-build-tastesh.sh amd64

      - name: 🦀 Prep Rust
        if: steps.cache.outputs.cache-hit != 'true'
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: freebsd
          version: '14.2'
          architecture: x86-64
          shell: bash
          sync_files: runner-to-vm
          run: RUST_VERSION=${{ vars.RUST_VERSION }} ci/freebsd-prep-rust.sh

      - name: 🔨 Build Rust helpers
        if: steps.cache.outputs.cache-hit != 'true'
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: freebsd
          version: '14.2'
          architecture: x86-64
          shell: bash
          sync_files: runner-to-vm
          run: ci/freebsd-build-rust.sh ${{ needs.setup.outputs.version }} amd64

      - name: 🧪 Test Go
        if: steps.cache.outputs.cache-hit != 'true'
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: freebsd
          version: '14.2'
          architecture: x86-64
          shell: bash
          sync_files: true
          run: ci/freebsd-test-go.sh

      - name: 📦 Package artifacts
        shell: bash
        run: ci/package-helpers.sh freebsd_amd64 ${{ needs.setup.outputs.version }}

      - name: 🧪 Test binaries
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p test-results
          ci/test-binaries.sh freebsd_amd64 dist/bin test-results

      - name: 📊 Generate metadata
        if: always()
        shell: bash
        run: |
          export PYTHONUTF8=1 PYTHONIOENCODING=utf-8
          python3 ci/test-metadata.py platform freebsd_amd64 ${{ needs.setup.outputs.version }} ${{ steps.cache.outputs.cache-hit }}

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: flavor-helpers-${{ needs.setup.outputs.version }}-freebsd_amd64
          path: artifacts/*.zip

      # Upload tastesh as a separate artifact so pretaster pipeline can download it
      - name: 📤 Upload tastesh
        uses: actions/upload-artifact@v7
        with:
          name: flavor-tastesh-${{ needs.setup.outputs.version }}-freebsd_amd64
          path: dist/bin/flavor-tastesh-freebsd_amd64
          if-no-files-found: warn

      - name: 📤 Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-freebsd_amd64
          path: test-results/

      - name: 📤 Upload metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: metadata-freebsd_amd64
          path: artifacts/metadata/

  build-freebsd-arm64:
    name: 😈🔨 freebsd_arm64
    needs: setup
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 💾 Cache FreeBSD helpers
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            dist/bin/flavor-go-*-${{ needs.setup.outputs.version }}-freebsd_arm64
            dist/bin/flavor-rs-*-${{ needs.setup.outputs.version }}-freebsd_arm64
            dist/bin/flavor-tastesh-freebsd_arm64
            artifacts/*.zip
          key: ${{ needs.setup.outputs.go_cache_key_base }}-${{ needs.setup.outputs.rust_cache_key_base }}-${{ needs.setup.outputs.tastesh_cache_key_base }}-freebsd_arm64-${{ needs.setup.outputs.version }}

      - name: 💾 Cache Rust toolchain + registry
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: vm-rust-home
          key: freebsd-rust-arm64-${{ vars.RUST_VERSION }}-${{ hashFiles('src/flavor-rs/Cargo.lock') }}
          restore-keys: freebsd-rust-arm64-${{ vars.RUST_VERSION }}-

      - name: 🏗️ Prep FreeBSD system
        if: steps.cache.outputs.cache-hit != 'true'
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: freebsd
          version: '14.2'
          architecture: arm64
          shell: bash
          run: ci/freebsd-prep-system.sh

      - name: 🐹 Build Go helpers
        if: steps.cache.outputs.cache-hit != 'true'
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: freebsd
          version: '14.2'
          architecture: arm64
          shell: bash
          sync_files: runner-to-vm
          run: ci/freebsd-build-go.sh ${{ needs.setup.outputs.version }} arm64

      - name: 🐚 Build tastesh
        if: steps.cache.outputs.cache-hit != 'true'
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: freebsd
          version: '14.2'
          architecture: arm64
          shell: bash
          sync_files: runner-to-vm
          run: ci/freebsd-build-tastesh.sh arm64

      - name: 🦀 Prep Rust
        if: steps.cache.outputs.cache-hit != 'true'
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: freebsd
          version: '14.2'
          architecture: arm64
          shell: bash
          sync_files: runner-to-vm
          run: RUST_VERSION=${{ vars.RUST_VERSION }} ci/freebsd-prep-rust.sh

      - name: 🔨 Build Rust helpers
        if: steps.cache.outputs.cache-hit != 'true'
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: freebsd
          version: '14.2'
          architecture: arm64
          shell: bash
          sync_files: runner-to-vm
          run: ci/freebsd-build-rust.sh ${{ needs.setup.outputs.version }} arm64

      - name: 🧪 Test Go
        if: steps.cache.outputs.cache-hit != 'true'
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: freebsd
          version: '14.2'
          architecture: arm64
          shell: bash
          sync_files: true
          run: ci/freebsd-test-go.sh

      - name: 📦 Package artifacts
        shell: bash
        run: ci/package-helpers.sh freebsd_arm64 ${{ needs.setup.outputs.version }}

      - name: 🧪 Test binaries
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p test-results
          ci/test-binaries.sh freebsd_arm64 dist/bin test-results

      - name: 📊 Generate metadata
        if: always()
        shell: bash
        run: |
          export PYTHONUTF8=1 PYTHONIOENCODING=utf-8
          python3 ci/test-metadata.py platform freebsd_arm64 ${{ needs.setup.outputs.version }} ${{ steps.cache.outputs.cache-hit }}

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: flavor-helpers-${{ needs.setup.outputs.version }}-freebsd_arm64
          path: artifacts/*.zip

      # Upload tastesh as a separate artifact so pretaster pipeline can download it
      - name: 📤 Upload tastesh
        uses: actions/upload-artifact@v7
        with:
          name: flavor-tastesh-${{ needs.setup.outputs.version }}-freebsd_arm64
          path: dist/bin/flavor-tastesh-freebsd_arm64
          if-no-files-found: warn

      - name: 📤 Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-freebsd_arm64
          path: test-results/

      - name: 📤 Upload metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: metadata-freebsd_arm64
          path: artifacts/metadata/

  # ── Combine all artifacts ──────────────────────────────────────────────────
  combine:
    name: 📦 Combine & Validate
    needs: [setup, build-go, build-rust, build-tastesh, build-freebsd-amd64, build-freebsd-arm64]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-artifacts

      - name: 🔀 Combine artifacts
        run: ci/combine-helpers.sh all-artifacts final ${{ needs.setup.outputs.version }}

      - name: 🧪 Combine test results
        run: ci/combine-test-results.sh all-artifacts final/test-report.json

      - name: 📊 Generate summary
        run: |
          export PYTHONUTF8=1 PYTHONIOENCODING=utf-8
          python3 ci/test-metadata.py summary final/test-report.json ${{ needs.setup.outputs.version }}

      - name: 📤 Upload combined artifacts
        uses: actions/upload-artifact@v7
        with:
          name: flavor-helpers-${{ needs.setup.outputs.version }}-all
          path: |
            final/*.zip
            final/*.json
