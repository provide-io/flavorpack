name: 🚀 Release Pipeline

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.3.1)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry run (no actual release)'
        required: false
        default: false
        type: boolean
      publish_testpypi:
        description: '☑️ Publish to TestPyPI'
        required: false
        default: false
        type: boolean
      publish_pypi:
        description: '☑️ Publish to PyPI'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write
  actions: read

jobs:
  prepare:
    name: 🔍 Prepare Release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_tag: ${{ steps.version.outputs.version_tag }}
      helper_run_id: ${{ steps.helper.outputs.run_id }}
      flavor_run_id: ${{ steps.flavor.outputs.run_id }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 📝 Validate Version
        id: version
        run: .github/scripts/validate-release-version.sh "${{ github.event.inputs.version }}"
      
      - name: 🔍 Find Latest Successful Runs
        id: find_runs
        run: .github/scripts/get-release-runs.sh
        env:
          GH_TOKEN: ${{ github.token }}

  collect-wheels:
    name: 🎡 Collect Platform Wheels
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout for scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false
      
      - name: 📥 Download wheel artifacts from Flavor Pipeline
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: 03-flavor-pipeline.yml
          run_id: ${{ needs.prepare.outputs.flavor_run_id }}
          name_is_regexp: true
          name: ^flavor-wheel-
          path: ./wheels
          workflow_conclusion: ""
      
      - name: 🔧 Organize and rename wheels
        run: .github/scripts/organize-release-wheels.sh wheels release-wheels "${{ needs.prepare.outputs.version }}"
      
      - name: 📤 Upload collected wheels
        uses: actions/upload-artifact@v4
        with:
          name: release-wheels
          path: release-wheels/*.whl
          retention-days: 30

  collect-packages:
    name: 📦 Collect PSP Packages
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout for scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false
      
      - name: 📥 Download Flavor PSP artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: 03-flavor-pipeline.yml
          run_id: ${{ needs.prepare.outputs.flavor_run_id }}
          name_is_regexp: true
          name: ^flavor-${{ needs.prepare.outputs.version }}-
          path: ./flavor-psp
          workflow_conclusion: ""
        continue-on-error: true
      
      - name: 📥 Download Taster artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: 04-taster-pipeline.yml
          name_is_regexp: true
          name: ^taster-
          path: ./taster-psp
        continue-on-error: true
      
      - name: 🔧 Organize PSP packages
        run: .github/scripts/organize-release-packages.sh release-psp "${{ needs.prepare.outputs.version }}" flavor-psp taster-psp
      
      - name: 📤 Upload collected packages
        uses: actions/upload-artifact@v4
        with:
          name: release-psp
          path: release-psp/*.psp
          retention-days: 30

  generate-assets:
    name: 📊 Generate Release Assets
    needs: [prepare, collect-wheels, collect-packages]
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 📥 Download wheels
        uses: actions/download-artifact@v4
        with:
          name: release-wheels
          path: ./release
      
      - name: 📥 Download PSP packages
        uses: actions/download-artifact@v4
        with:
          name: release-psp
          path: ./release
      
      - name: 🔧 Generate checksums
        run: .github/scripts/generate-checksums.sh
      
      - name: 📝 Generate Release Notes
        run: .github/scripts/generate-release-notes.sh "${{ needs.prepare.outputs.version }}" "${{ github.repository }}"
      
      - name: 📤 Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/
          retention-days: 30

  create-release:
    name: 🏷️ Create GitHub Release
    needs: [prepare, generate-assets]
    if: github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 📥 Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      
      - name: 🗂️ Extract and organize release files
        run: .github/scripts/organize-release-artifacts.sh
      
      - name: 🏷️ Create Git Tag
        run: .github/scripts/create-git-tag.sh "${{ needs.prepare.outputs.version }}" "${{ needs.prepare.outputs.version_tag }}"
      
      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version_tag }}
          name: Flavor Pack ${{ needs.prepare.outputs.version }}
          body_path: release/release-notes.md
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: |
            release/*.whl
            release/*.psp
            release/checksums.txt
          generate_release_notes: false

  publish-testpypi:
    name: 🧪 Publish to TestPyPI
    needs: [prepare, generate-assets]
    if: github.event.inputs.dry_run != 'true' && github.event.inputs.publish_testpypi == 'true'
    uses: ./.github/workflows/reusable-publish.yml
    with:
      repository-url: https://test.pypi.org/legacy/
      environment-name: testpypi
      environment-url: https://test.pypi.org/project/flavorpack
    secrets:
      api-token: ${{ secrets.TEST_PYPI_API_TOKEN }}

  publish-pypi:
    name: 🐍 Publish to PyPI
    needs: [prepare, create-release]
    if: github.event.inputs.dry_run != 'true' && github.event.inputs.publish_pypi == 'true'
    uses: ./.github/workflows/reusable-publish.yml
    with:
      repository-url: https://upload.pypi.org/legacy/
      environment-name: pypi
      environment-url: https://pypi.org/project/flavorpack
    secrets:
      api-token: ${{ secrets.PYPI_API_TOKEN }}

  summary:
    name: 📊 Release Summary
    needs: [prepare, collect-wheels, collect-packages, create-release, publish-pypi, publish-testpypi]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: 📊 Generate Summary
        env:
          NEEDS_PREPARE_OUTPUTS_VERSION: ${{ needs.prepare.outputs.version }}
          NEEDS_PREPARE_OUTPUTS_VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
          INPUTS_PRERELEASE: ${{ github.event.inputs.prerelease == 'true' && 'Pre-release' || 'Stable Release' }}
          INPUTS_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'Dry Run' || 'Production' }}
          NEEDS_PREPARE_OUTPUTS_HELPER_RUN_ID: ${{ needs.prepare.outputs.helper_run_id }}
          NEEDS_PREPARE_OUTPUTS_FLAVOR_RUN_ID: ${{ needs.prepare.outputs.flavor_run_id }}
          NEEDS_COLLECT_WHEELS_RESULT: ${{ needs.collect-wheels.result == 'success' && '✅ Collected' || '❌ Failed' }}
          NEEDS_COLLECT_PACKAGES_RESULT: ${{ needs.collect-packages.result == 'success' && '✅ Collected' || '❌ Failed' }}
          NEEDS_GENERATE_ASSETS_RESULT: ${{ needs.generate-assets.result == 'success' && '✅ Generated' || '❌ Failed' }}
          NEEDS_CREATE_RELEASE_RESULT: ${{ needs.create-release.result == 'success' && '✅ Published' || needs.create-release.result == 'skipped' && '⏭️ Skipped (Dry Run)' || '❌ Failed' }}
          CREATE_RELEASE_LINK: ${{ needs.create-release.result == 'success' && format('[View Release](https://github.com/{0}/releases/tag/{1})', github.repository, needs.prepare.outputs.version_tag) || 'N/A' }}
          NEEDS_PUBLISH_TESTPYPI_RESULT: ${{ needs.publish-testpypi.result == 'success' && '✅ Published' || needs.publish-testpypi.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }}
          TESTPYPI_LINK: ${{ needs.publish-testpypi.result == 'success' && format('[View on TestPyPI](https://test.pypi.org/project/flavorpack/{0}/)', needs.prepare.outputs.version) || 'N/A' }}
          NEEDS_PUBLISH_PYPI_RESULT: ${{ needs.publish-pypi.result == 'success' && '✅ Published' || needs.publish-pypi.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }}
          PYPI_LINK: ${{ needs.publish-pypi.result == 'success' && format('[View on PyPI](https://pypi.org/project/flavorpack/{0}/)', needs.prepare.outputs.version) || 'N/A' }}
        run: .github/scripts/generate-summary.sh
