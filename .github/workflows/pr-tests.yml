name: 03b 🧪 Test Suites (PR)
# ─────────────────────────────────────────────────────────────────────────────
# Script policy: keep inline run: blocks to ≤ 3 lines.
# Anything longer belongs in ci/ and should be called from here.
# ─────────────────────────────────────────────────────────────────────────────
#
# Runs the Rust, Go and Python test suites on a pull request.
#
# 03a holds those suites, and cannot serve a PR: its workflow_run trigger is
# gated to main and develop, and it consumes helper artifacts published by 01
# Helper Prep, which is workflow_dispatch-only. In practice that meant the
# suites ran when somebody manually started a helper build -- four times in a
# fortnight, then a three-month gap -- and never on a pull request. A PR could
# add or break a test and merge green.
#
# So this builds helpers from the PR's own source, exactly as 02b does, and
# runs the suites against them. Tests only: wheels, PSP builds and the coverage
# badge stay in 03a.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which suite to run (all, rust, go, python)'
        type: string
        required: false
        default: 'all'

  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.py'
      - '**.go'
      - '**.rs'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'build.sh'
      - 'src/flavor-go/go.mod'
      - 'src/flavor-go/go.sum'
      - 'src/flavor-go/Makefile'
      - 'src/flavor-rs/Cargo.toml'
      - 'src/flavor-rs/Cargo.lock'
      - 'src/flavor-rs/Makefile'
      # tests/ci/ covers the release pipeline's shell scripts; without this the
      # tests exist and never run on a PR that changes what they cover.
      - 'ci/**'
      - 'tests/ci/**'
      # Fixtures are inputs to the suites, so a change to one has to re-run them.
      - 'tests/**'
      - 'ci/pr-tests.sh'
      - 'ci/run-tests.sh'
      - '.github/workflows/pr-tests.yml'

concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: 🧪 Tests (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # Both platforms run: the helper-discovery path in tests/conftest.py used
      # to name darwin_arm64 literally, which passed on macOS and skipped every
      # helper-backed test on Linux. One platform would not have shown it.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux_amd64
          - os: macos-14
            label: darwin_arm64

    steps:
      # Source under test: the PR's own tree, helpers built from it below.
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # uv provides the project environment the Python suite runs in.
      - name: 📦 Setup uv + Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # Go toolchain, version pinned by the module itself.
      - name: 🐹 Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/flavor-go/go.mod
          cache: true
          cache-dependency-path: src/flavor-go/go.sum

      # Rust toolchain, with the cargo registry and target dir cached.
      - name: 🦀 Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          workspaces: src/flavor-rs

      # build.sh builds tastesh from autotools sources; musl-tools provides the
      # linker for the static Rust build that is the default target on Linux.
      - name: 🔧 Install autotools and musl (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y autoconf automake musl-tools

      # Linux helpers ship as musl static binaries, so the toolchain needs that
      # target available.
      - name: 🦀 Add musl target (Linux)
        if: runner.os == 'Linux'
        run: rustup target add x86_64-unknown-linux-musl

      # Same prerequisite on macOS runners.
      - name: 🔧 Install autotools (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf automake

      # Builds helpers from source, then runs every suite. Each suite's exit
      # code is reported separately and a failure in one does not stop the rest.
      - name: 🧪 Build helpers and run the test suites
        run: ci/pr-tests.sh "${{ inputs.suite || 'all' }}"

      # Renders pass/fail counts in the job summary rather than in the log.
      - name: 📊 Test summary
        if: always()
        uses: test-summary/action@v2.6
        with:
          paths: pytest-results.xml
        continue-on-error: true

      # Per-suite logs and the junit XML are the record of what failed.
      - name: 📤 Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-test-results-${{ matrix.label }}
          path: |
            test-logs/
            pytest-results.xml
            test-outputs/
          if-no-files-found: ignore
          retention-days: 7
