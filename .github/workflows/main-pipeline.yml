name: 🎯 Main CI Pipeline

on:
  workflow_dispatch:
    inputs:
      skip_helpers:
        description: 'Skip helper builds'
        type: boolean
        default: false
      skip_tests:
        description: 'Skip tests'
        type: boolean
        default: false
      fast_mode:
        description: 'Fast mode (minimal testing)'
        type: boolean
        default: false
      platforms:
        description: 'Platforms to test (comma-separated: linux,macos,windows)'
        type: string
        default: 'linux,macos'

jobs:
  # ==================================================================================
  # 🔨 Build all helpers per platform (Go + Rust together)
  # ==================================================================================
  build-helpers:
    name: 🔨 Build Helpers
    if: ${{ !inputs.skip_helpers }}
    uses: ./.github/workflows/platform-helpers.yml
    secrets: inherit

  # ==================================================================================
  # 🧪 Platform Tests - All tests consolidated per platform
  # ==================================================================================
  platform-tests:
    name: 🧪 ${{ matrix.name }} Tests
    needs: [build-helpers]
    if: |
      always() && 
      !inputs.skip_tests &&
      (needs.build-helpers.result == 'success' || needs.build-helpers.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux
            platform: linux_amd64
            python: "3.13"
            run_slow: true
            enabled: ${{ contains(inputs.platforms, 'linux') || inputs.platforms == '' }}
            
          - os: macos-15
            name: macOS
            platform: darwin_arm64
            python: "3.13"
            run_slow: false
            enabled: ${{ contains(inputs.platforms, 'macos') || inputs.platforms == '' }}
            
          - os: windows-2025
            name: Windows
            platform: windows_amd64
            python: "3.13"
            run_slow: false
            enabled: ${{ contains(inputs.platforms, 'windows') }}
            
    steps:
      - name: 🎯 Check if platform is enabled
        if: matrix.enabled == false
        run: |
          echo "⏭️ Skipping ${{ matrix.name }} (not in selected platforms)"
          exit 0
      
      - name: 📥 Checkout
        if: matrix.enabled != false
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python ${{ matrix.python }}
        if: matrix.enabled != false
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
      
      - name: 📦 Download Platform Helpers
        if: matrix.enabled != false && !inputs.skip_helpers
        uses: actions/download-artifact@v4
        with:
          name: all-helpers-${{ github.sha }}
          path: helpers
      
      - name: 🔐 Set executable permissions
        if: matrix.enabled != false && matrix.os != 'windows-2025' && !inputs.skip_helpers
        run: |
          chmod +x helpers/bin/*-${{ matrix.platform }}
          ls -la helpers/bin/*-${{ matrix.platform }}
      
      - name: 🔧 Setup Environment
        if: matrix.enabled != false
        shell: bash
        run: |
          # Install uv for faster pip operations
          pip install uv
          
          # Setup virtual environment
          uv venv workenv
          
          # Activate and install (Unix)
          if [ "${{ matrix.os }}" != "windows-2025" ]; then
            source workenv/bin/activate
          else
            source workenv/Scripts/activate
          fi
          
          # Install flavor and dependencies
          uv pip install -e .
          uv pip install pytest pytest-xdist pytest-timeout pytest-mock
      
      # Run all test categories using dedicated script
      - name: 🧪 Run Platform Tests
        if: matrix.enabled != false
        shell: bash
        run: |
          chmod +x .github/scripts/run-platform-tests.sh
          .github/scripts/run-platform-tests.sh \
            "${{ matrix.platform }}" \
            "${{ matrix.os }}" \
            "${{ inputs.fast_mode }}" \
            "${{ matrix.run_slow }}"
      
      - name: 📊 Test Summary
        if: always() && matrix.enabled != false
        run: |
          echo "✅ Completed tests for ${{ matrix.name }}"

  # ==================================================================================
  # 🔄 Python Compatibility Tests (minimal, only on Linux)
  # ==================================================================================
  compatibility-tests:
    name: 🔄 Python ${{ matrix.python }} Compatibility
    needs: [build-helpers]
    if: |
      always() &&
      !inputs.skip_tests &&
      !inputs.fast_mode &&
      (needs.build-helpers.result == 'success' || needs.build-helpers.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
      
      - name: 📦 Download Linux Helpers
        if: !inputs.skip_helpers
        uses: actions/download-artifact@v4
        with:
          name: all-helpers-${{ github.sha }}
          path: helpers
      
      - name: 🔐 Set executable permissions
        if: !inputs.skip_helpers
        run: |
          chmod +x helpers/bin/*-linux_amd64
      
      - name: 🔧 Setup Environment
        run: |
          pip install uv
          uv venv workenv
          source workenv/bin/activate
          uv pip install -e .
          uv pip install pytest pytest-xdist pytest-timeout pytest-mock
      
      - name: 🧪 Run Compatibility Tests
        run: |
          source workenv/bin/activate
          
          echo "🧪 Testing Python ${{ matrix.python }} compatibility..."
          
          # Run essential tests only
          pytest tests/unit -n auto --timeout=60
          pytest tests/test_helpers.py -n auto --timeout=60
          pytest tests/integration -m "not slow" -n auto --timeout=120
      
      - name: 📊 Compatibility Summary
        if: always()
        run: |
          echo "✅ Python ${{ matrix.python }} compatibility tests completed"

  # ==================================================================================
  # 🍯 Taster-specific Tests (consolidated)
  # ==================================================================================
  taster-tests:
    name: 🍯 Taster Tests
    needs: [build-helpers]
    if: |
      always() &&
      !inputs.skip_tests &&
      (needs.build-helpers.result == 'success' || needs.build-helpers.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'
      
      - name: 📦 Download Helpers
        if: !inputs.skip_helpers
        uses: actions/download-artifact@v4
        with:
          name: all-helpers-${{ github.sha }}
          path: helpers
      
      - name: 🔐 Set executable permissions
        if: !inputs.skip_helpers
        run: |
          if [ "${{ runner.os }}" == "Linux" ]; then
            chmod +x helpers/bin/*-linux_amd64
            PLATFORM="linux_amd64"
          else
            chmod +x helpers/bin/*-darwin_arm64
            PLATFORM="darwin_arm64"
          fi
          echo "PLATFORM=$PLATFORM" >> $GITHUB_ENV
      
      - name: 🔧 Setup Environment
        run: |
          pip install uv
          uv venv workenv
          source workenv/bin/activate
          
          # Install taster and dependencies
          cd helpers/taster
          uv pip install -e .
          cd ../..
          uv pip install pytest pytest-xdist
      
      - name: 🧪 Run Taster Tests
        run: |
          source workenv/bin/activate
          
          echo "🍯 Testing Taster functionality..."
          cd helpers/taster
          pytest tests -n auto -v
      
      - name: 🔄 Test Taster Self-Package
        if: ${{ !inputs.fast_mode }}
        run: |
          source workenv/bin/activate
          
          echo "🔄 Testing Taster self-packaging..."
          
          # Build taster with Go launcher
          flavor package \
            --manifest helpers/taster/pyproject.toml \
            --launcher-bin helpers/bin/flavor-go-launcher-${{ env.PLATFORM }} \
            --output /tmp/taster-go.psp \
            --key-seed test123
          
          # Build taster with Rust launcher
          flavor package \
            --manifest helpers/taster/pyproject.toml \
            --launcher-bin helpers/bin/flavor-rs-launcher-${{ env.PLATFORM }} \
            --output /tmp/taster-rust.psp \
            --key-seed test123
          
          # Test both packages
          chmod +x /tmp/taster-go.psp /tmp/taster-rust.psp
          
          echo "Testing Go-packaged Taster..."
          /tmp/taster-go.psp --version
          /tmp/taster-go.psp info
          
          echo "Testing Rust-packaged Taster..."
          /tmp/taster-rust.psp --version
          /tmp/taster-rust.psp info

  # ==================================================================================
  # 📊 Pipeline Summary
  # ==================================================================================
  pipeline-summary:
    name: 📊 Pipeline Summary
    needs: [build-helpers, platform-tests, compatibility-tests, taster-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📊 Generate Summary
        run: |
          echo "# 🎯 Main CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Helper build status
          if [ "${{ needs.build-helpers.result }}" == "success" ]; then
            echo "✅ **Helper Build**: Success" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.build-helpers.result }}" == "skipped" ]; then
            echo "⏭️ **Helper Build**: Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Helper Build**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Platform tests status
          if [ "${{ needs.platform-tests.result }}" == "success" ]; then
            echo "✅ **Platform Tests**: All passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.platform-tests.result }}" == "skipped" ]; then
            echo "⏭️ **Platform Tests**: Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Platform Tests**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Compatibility tests status
          if [ "${{ needs.compatibility-tests.result }}" == "success" ]; then
            echo "✅ **Compatibility Tests**: All passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.compatibility-tests.result }}" == "skipped" ]; then
            echo "⏭️ **Compatibility Tests**: Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Compatibility Tests**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Taster tests status
          if [ "${{ needs.taster-tests.result }}" == "success" ]; then
            echo "✅ **Taster Tests**: All passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.taster-tests.result }}" == "skipped" ]; then
            echo "⏭️ **Taster Tests**: Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Taster Tests**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- Fast Mode: ${{ inputs.fast_mode }}" >> $GITHUB_STEP_SUMMARY
          echo "- Skip Helpers: ${{ inputs.skip_helpers }}" >> $GITHUB_STEP_SUMMARY
          echo "- Skip Tests: ${{ inputs.skip_tests }}" >> $GITHUB_STEP_SUMMARY
          echo "- Platforms: ${{ inputs.platforms || 'linux,macos' }}" >> $GITHUB_STEP_SUMMARY
          
          # Overall status
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.build-helpers.result }}" == "failure" ]] || \
             [[ "${{ needs.platform-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.compatibility-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.taster-tests.result }}" == "failure" ]]; then
            echo "## ❌ Pipeline Failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "## ✅ Pipeline Succeeded" >> $GITHUB_STEP_SUMMARY
          fi