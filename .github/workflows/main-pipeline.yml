name: 🎯 Main CI Pipeline

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test workflows'
        required: false
        default: false
        type: boolean
      skip_packaging:
        description: 'Skip packaging workflows'
        required: false
        default: false
        type: boolean
  # Disabled automatic triggers - manual dispatch only
  # push:
  #   branches: [main, develop, feature/*]
  # pull_request:
  #   branches: [main, develop]

jobs:
  # ==================================================================================
  # 🔨 Build Helpers First (everything depends on these)
  # ==================================================================================
  build-helpers:
    name: 🔨 Build Helpers
    uses: ./.github/workflows/helpers-build.yml
    secrets: inherit

  # ==================================================================================
  # 🧪 Core Tests (parallel after helpers)
  # ==================================================================================
  flavor-tests:
    name: 🧪 Flavor Tests
    needs: build-helpers
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_tests != 'true' }}
    uses: ./.github/workflows/flavor-tests.yml
    secrets: inherit
    # Note: flavor-tests.yml now properly downloads helpers and runs ALL test categories

  taster-tests:
    name: 🍯 Taster Tests
    needs: build-helpers
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_tests != 'true' }}
    uses: ./.github/workflows/taster-tests.yml
    secrets: inherit

  # ==================================================================================
  # 📦 Packaging Tests (parallel after helpers)
  # ==================================================================================
  flavor-packaging:
    name: 📦 Flavor Packaging
    needs: build-helpers
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_packaging != 'true' }}
    uses: ./.github/workflows/flavor-packaging.yml
    secrets: inherit

  taster-self-packaging:
    name: 🔄 Taster Self-Package
    needs: [build-helpers, flavor-packaging]
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_packaging != 'true' }}
    uses: ./.github/workflows/taster-self-package.yml
    secrets: inherit

  # ==================================================================================
  # 🔧 Integration Tests (after helpers are built)
  # ==================================================================================
  integration-tests:
    name: 🔧 Integration Tests
    needs: build-helpers
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_tests != 'true' }}
    uses: ./.github/workflows/integration-tests.yml
    secrets: inherit

  # ==================================================================================
  # 📊 Consolidated Summary
  # ==================================================================================
  pipeline-summary:
    name: 📊 Pipeline Summary
    needs: [build-helpers, flavor-tests, taster-tests, flavor-packaging, taster-self-packaging, integration-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 📊 Generate Consolidated Report
        run: |
          chmod +x .github/scripts/generate-summary.sh
          .github/scripts/generate-summary.sh \
            "${{ needs.build-helpers.result }}" \
            "${{ needs.flavor-tests.result }}" \
            "${{ needs.taster-tests.result }}" \
            "${{ needs.flavor-packaging.result }}" \
            "${{ needs.taster-self-packaging.result }}" \
            "${{ needs.integration-tests.result }}"
      
