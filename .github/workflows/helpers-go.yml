name: Go Helpers

on:
  push:
    paths:
      - 'helpers/flavor-go/**'
      - 'helpers/Makefile'
      - '.github/workflows/helpers-go.yml'
  pull_request:
    paths:
      - 'helpers/flavor-go/**'
      - 'helpers/Makefile'
      - '.github/workflows/helpers-go.yml'
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact-name:
        description: "Name of the uploaded artifact"
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  # Code quality checks that can run immediately in parallel with builds
  lint:
    name: Go Lint & Format
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: helpers/flavor-go/go.sum
      
      - name: 🎨 Check formatting
        working-directory: helpers/flavor-go
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "❌ Code is not formatted. Run 'make fmt'"
            gofmt -l .
            exit 1
          fi
          echo "✅ Code is properly formatted"
      
      - name: 🔍 Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.54.2
      
      - name: 🔍 Run golangci-lint
        working-directory: helpers/flavor-go
        run: $(go env GOPATH)/bin/golangci-lint run --timeout=5m
        continue-on-error: true
      
      - name: 🔍 Go vet
        working-directory: helpers/flavor-go
        run: go vet ./...

  security:
    name: Go Security Scan
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: helpers/flavor-go/go.sum
      
      - name: 🔐 Install security tools
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
      
      - name: 🔐 Run gosec
        working-directory: helpers/flavor-go
        run: $(go env GOPATH)/bin/gosec -quiet ./...
        continue-on-error: true
      
      - name: 🔐 Run govulncheck
        working-directory: helpers/flavor-go
        run: $(go env GOPATH)/bin/govulncheck ./...
        continue-on-error: true

  test:
    name: Go Tests
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: helpers/flavor-go/go.sum
      
      - name: 🧪 Run tests with coverage
        working-directory: helpers/flavor-go
        run: |
          go test -v -race -coverprofile=coverage.out ./...
          go tool cover -html=coverage.out -o coverage.html
          echo "📊 Coverage: $(go tool cover -func=coverage.out | grep total | awk '{print $3}')"
      
      - name: 📤 Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: helpers/flavor-go/coverage.html
        continue-on-error: true

  build:
    name: Build Go Helpers
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux builds
          - os: ubuntu-24.04
            platform: linux_amd64
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04
            platform: linux_arm64
            goos: linux
            goarch: arm64
          # macOS builds
          - os: macos-15
            platform: darwin_amd64
            goos: darwin
            goarch: amd64
          - os: macos-15
            platform: darwin_arm64
            goos: darwin
            goarch: arm64
          # Windows builds (native)
          - os: windows-2025
            platform: windows_amd64
            goos: windows
            goarch: amd64
    
    outputs:
      artifact-name: flavor-go-helpers-${{ matrix.platform }}
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔢 Get version
        id: version
        shell: bash
        run: |
          if [ -f pyproject.toml ]; then
            VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2 || echo "0.0.0")
          else
            VERSION="0.0.0"
            echo "⚠️ Warning: pyproject.toml not found, using default version 0.0.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "🔢 Version: $VERSION"
      
      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: helpers/flavor-go/go.sum
      
      - name: 📦 Install dependencies
        working-directory: helpers/flavor-go
        run: go mod download
      
      - name: 🔨 Build helpers
        working-directory: helpers/flavor-go
        run: make build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      
      - name: ✅ Verify binaries
        working-directory: helpers
        run: |
          echo "🔍 Checking built binaries..."
          ls -la bin/
          
          # Test version flag on each binary
          for binary in bin/flavor-go-*; do
            if [ -f "$binary" ] && [ -x "$binary" ] && [[ ! "$binary" == *.exe ]]; then
              echo "Testing: $binary"
              $binary --version || echo "  ⚠️ No --version flag"
            fi
          done
        if: runner.os != 'Windows'
      
      - name: ✅ Verify binaries (Windows)
        working-directory: helpers
        shell: pwsh
        run: |
          Write-Host "🔍 Checking built binaries..."
          Get-ChildItem bin/
          
          # Test version flag on each binary
          Get-ChildItem bin/flavor-go-*.exe -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "Testing: $_"
            & $_.FullName --version
          }
        if: runner.os == 'Windows'
      
      - name: 📦 Package artifacts
        working-directory: helpers
        run: |
          chmod +x scripts/package-artifacts.sh
          if [ -f ../../pyproject.toml ]; then
            VERSION=$(grep '^version = ' ../../pyproject.toml | cut -d'"' -f2 || echo "0.0.0")
          else
            VERSION="0.0.0"
            echo "⚠️ Warning: pyproject.toml not found, using default version 0.0.0"
          fi
          ./scripts/package-artifacts.sh go "${{ matrix.platform }}" bin . "$VERSION"
        if: runner.os != 'Windows'
      
      - name: 📦 Package artifacts (Windows)
        working-directory: helpers
        shell: pwsh
        run: |
          if (Test-Path ..\..\pyproject.toml) {
            $version = (Get-Content ..\..\pyproject.toml | Select-String '^version = "(.+)"').Matches.Groups[1].Value
            if (-not $version) { 
              $version = "0.0.0"
              Write-Warning "Could not extract version from pyproject.toml, using default 0.0.0"
            }
          } else {
            $version = "0.0.0"
            Write-Warning "pyproject.toml not found, using default version 0.0.0"
          }
          .\scripts\package-artifacts.ps1 -Language go -Platform "${{ matrix.platform }}" -BinDir bin -OutputDir . -Version $version
        if: runner.os == 'Windows'
      
      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flavor-go-helpers-${{ steps.version.outputs.version }}_${{ matrix.platform }}
          path: helpers/flavor-go-helpers-*_${{ matrix.platform }}
          retention-days: 7

  # Summary of all Go helper jobs
  summary:
    name: Go Summary
    runs-on: ubuntu-24.04
    needs: [lint, security, test, build]
    if: always()
    steps:
      - name: 📊 Summary
        run: |
          echo "## Go Helpers Build Summary"
          echo ""
          echo "### Quality Checks:"
          echo "- Lint & Format: ${{ needs.lint.result }}"
          echo "- Security: ${{ needs.security.result }}"
          echo "- Tests: ${{ needs.test.result }}"
          echo ""
          echo "### Builds:"
          echo "- Build Jobs: ${{ needs.build.result }}"
          echo ""
          
          if [ "${{ needs.build.result }}" == "success" ] && [ "${{ needs.test.result }}" == "success" ]; then
            echo "✅ **Go helpers ready!**"
          else
            echo "⚠️ **Some checks failed**"
          fi