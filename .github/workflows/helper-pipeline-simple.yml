name: 🔨 Helper Pipeline

on:
  workflow_dispatch:

jobs:
  build-and-test:
    name: 🔨 Build and Test Helpers
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: 🔨 Build Helpers
        run: |
          cd helpers/flavor-go
          make install
          cd ../flavor-rs  
          make install
      
      - name: 🧪 Test Helpers
        run: |
          # Run helper-specific tests
          cd helpers/flavor-go
          make test
          cd ../flavor-rs
          make test
      
      - name: ✅ Done
        run: echo "Helpers built and tested"