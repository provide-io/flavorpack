name: 01 🥘 Ingredient Prep

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (comma-separated, or "all")'
        type: string
        default: 'all'
        required: false

jobs:
  # Setup job - determine version and what to build
  setup:
    name: 📊 Setup
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      cache_key_base: ${{ steps.cache.outputs.key_base }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🔍 Get version
        id: version
        run: |
          VERSION=$(cat VERSION || echo "0.0.1")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"
      
      - name: 🔑 Calculate cache key base
        id: cache
        run: |
          # Hash the ingredients directory to detect changes
          HELPERS_HASH=$(find ingredients -type f -name "*.go" -o -name "*.rs" -o -name "Cargo.toml" -o -name "go.mod" | xargs sha256sum | sha256sum | cut -d' ' -f1 | head -c 16)
          echo "key_base=ingredients-$HELPERS_HASH" >> $GITHUB_OUTPUT
          echo "🔑 Cache key base: ingredients-$HELPERS_HASH"
      
      - name: 📋 Setup build matrix
        id: matrix
        run: |
          # Define all platforms as a single-line JSON
          # Note: Linux platforms use musl for static linking to ensure compatibility with older glibc versions
          ALL_PLATFORMS='[{"platform":"linux_amd64","os":"ubuntu-latest","rust_target":"x86_64-unknown-linux-musl","use_musl":true},{"platform":"linux_arm64","os":"ubuntu-latest","rust_target":"aarch64-unknown-linux-musl","use_musl":true},{"platform":"darwin_amd64","os":"macos-13","rust_target":"x86_64-apple-darwin","use_musl":false},{"platform":"darwin_arm64","os":"macos-15","rust_target":"aarch64-apple-darwin","use_musl":false}]'
          
          # Check if specific platforms requested
          PLATFORMS="${{ inputs.platforms }}"
          if [ "$PLATFORMS" = "all" ] || [ -z "$PLATFORMS" ]; then
            MATRIX="{\"include\":$ALL_PLATFORMS}"
          else
            # Filter to requested platforms
            FILTERED="[]"
            for platform in $(echo "$PLATFORMS" | tr ',' ' '); do
              PLATFORM_JSON=$(echo "$ALL_PLATFORMS" | jq -c ".[] | select(.platform == \"$platform\")")
              if [ -n "$PLATFORM_JSON" ]; then
                FILTERED=$(echo "$FILTERED" | jq -c ". + [$PLATFORM_JSON]")
              fi
            done
            MATRIX="{\"include\":$FILTERED}"
          fi
          
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "📋 Build matrix: $MATRIX"

  # Single matrix job for all platforms
  build:
    name: 🔨 Build ${{ matrix.platform }}
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 💾 Cache ingredients
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ingredients/bin/*-${{ matrix.platform }}*
            artifacts/*.zip
          key: ${{ needs.setup.outputs.cache_key_base }}-${{ matrix.platform }}-${{ needs.setup.outputs.version }}
          restore-keys: |
            ${{ needs.setup.outputs.cache_key_base }}-${{ matrix.platform }}-
      
      - name: 🐹 Setup Go
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: 🦀 Setup Rust
        if: steps.cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2024-12-01
          targets: ${{ matrix.rust_target }}
          components: rustfmt, clippy
      
      - name: 📦 Install cargo-zigbuild (alternative for older glibc)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux' && matrix.use_musl != true
        run: |
          # cargo-zigbuild can target specific glibc versions
          cargo install cargo-zigbuild
          echo "ℹ️ cargo-zigbuild installed for glibc version targeting"
      
      - name: 🔧 Setup musl toolchain (Linux)
        if: steps.cache.outputs.cache-hit != 'true' && matrix.use_musl && runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Install musl tools and cross-compilation support
          sudo apt-get install -y musl-tools
          
          # For ARM64 cross-compilation
          if [ "${{ matrix.platform }}" = "linux_arm64" ]; then
            # Install cross-compilation tools for ARM64
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            # Download and setup musl cross-compiler for ARM64
            wget -q https://musl.cc/aarch64-linux-musl-cross.tgz
            tar -xzf aarch64-linux-musl-cross.tgz
            echo "$PWD/aarch64-linux-musl-cross/bin" >> $GITHUB_PATH
            echo "CC_aarch64_unknown_linux_musl=aarch64-linux-musl-gcc" >> $GITHUB_ENV
            echo "CXX_aarch64_unknown_linux_musl=aarch64-linux-musl-g++" >> $GITHUB_ENV
            echo "AR_aarch64_unknown_linux_musl=aarch64-linux-musl-ar" >> $GITHUB_ENV
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-musl-gcc" >> $GITHUB_ENV
          fi
      
      - name: 🔨 Build ingredients
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "🔨 Building ingredients for ${{ matrix.platform }}"
          
          # Extract platform parts
          PLATFORM="${{ matrix.platform }}"
          OS=$(echo $PLATFORM | cut -d_ -f1)
          ARCH=$(echo $PLATFORM | cut -d_ -f2)
          VERSION="${{ needs.setup.outputs.version }}"
          
          # Map to Go env vars
          export GOOS=$OS
          export GOARCH=$ARCH
          
          # Build Go ingredients
          echo "🐹 Building Go ingredients..."
          cd ingredients/flavor-go
          
          # Builder (with -buildvcs=false to avoid git issues in CI)
          go build -buildvcs=false -ldflags "-X main.Version=$VERSION" \
            -o ../bin/flavor-go-builder-$VERSION-$PLATFORM \
            cmd/flavor-go-builder/main.go
          
          # Launcher (with -buildvcs=false to avoid git issues in CI)
          go build -buildvcs=false -ldflags "-X main.Version=$VERSION" \
            -o ../bin/flavor-go-launcher-$VERSION-$PLATFORM \
            cmd/flavor-go-launcher/main.go
          
          cd ../..
          
          # Build Rust ingredients
          echo "🦀 Building Rust ingredients..."
          cd ingredients/flavor-rs
          
          # Set version via environment variable for build.rs
          export FLAVOR_VERSION="$VERSION"
          
          # Build with target
          cargo build --release --target ${{ matrix.rust_target }}
          
          # Copy to bin with platform suffix
          cp target/${{ matrix.rust_target }}/release/flavor-rs-builder ../bin/flavor-rs-builder-$VERSION-$PLATFORM
          cp target/${{ matrix.rust_target }}/release/flavor-rs-launcher ../bin/flavor-rs-launcher-$VERSION-$PLATFORM
          
          cd ../..
          
          # Make executable
          chmod +x ingredients/bin/* 2>/dev/null || true
          
          echo "✅ Build complete for ${{ matrix.platform }}"
          ls -la ingredients/bin/*-${{ matrix.platform }}*
      
      - name: 📦 Package artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cd ingredients/bin
          zip -r ../../artifacts/flavor-ingredients-${{ needs.setup.outputs.version }}-${{ matrix.platform }}.zip \
            *-${{ matrix.platform }}* || true
          cd ../..
          echo "📦 Packaged ingredients:"
          ls -la artifacts/
      
      - name: 🧪 Test binaries
        shell: bash
        run: |
          mkdir -p test-results
          .github/scripts/test-binaries.sh \
            "${{ matrix.platform }}" \
            ingredients/bin \
            test-results
      
      - name: 📊 Generate metadata
        if: always()
        shell: bash
        run: |
          export PYTHONUTF8=1
          export PYTHONIOENCODING=utf-8
          python3 .github/scripts/test-metadata.py platform \
            "${{ matrix.platform }}" \
            "${{ needs.setup.outputs.version }}" \
            "${{ steps.cache.outputs.cache-hit }}"
      
      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flavor-ingredients-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: artifacts/*.zip
      
      - name: 📤 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.platform }}
          path: test-results/
      
      - name: 📤 Upload metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-${{ matrix.platform }}
          path: artifacts/metadata/

  # Combine all artifacts
  combine:
    name: 📦 Combine & Validate
    needs: [setup, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
      
      - name: 🔀 Combine artifacts
        run: |
          mkdir -p final
          
          # Combine all platform zips
          for platform_dir in all-artifacts/flavor-ingredients-*; do
            if [ -d "$platform_dir" ]; then
              cp $platform_dir/*.zip final/ || true
            fi
          done
          
          # Create combined archive
          cd final
          mkdir -p all-ingredients
          for zip in *.zip; do
            [ -f "$zip" ] && unzip -o "$zip" -d all-ingredients/
          done
          zip -r flavor-ingredients-${{ needs.setup.outputs.version }}-all.zip all-ingredients/
          cd ..
          
          echo "📦 Combined artifacts:"
          ls -la final/
      
      - name: 🧪 Combine test results
        run: |
          # Ensure test results directory exists even if no tests ran
          mkdir -p all-artifacts/test-results
          
          # Create empty results if none exist
          if [ -z "$(find all-artifacts -name '*test-report.json' -type f 2>/dev/null)" ]; then
            echo '{"platforms": {}, "summary": {"platforms_tested": 0, "total_tests": 0, "passed": 0, "failed": 0}}' > final/test-report.json
          else
            export PYTHONUTF8=1
            export PYTHONIOENCODING=utf-8
            python3 .github/scripts/test-metadata.py combine \
              all-artifacts \
              final/test-report.json
          fi
      
      - name: 📊 Generate summary
        run: |
          echo "## 🔨 Ingredient Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.setup.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "final/test-report.json" ]; then
            export PYTHONUTF8=1
            export PYTHONIOENCODING=utf-8
            python3 -c "import json; data = json.load(open('final/test-report.json')); s = data.get('summary', {}); print(f\"**Platforms tested:** {s.get('platforms_tested', 0)}\"); print(f\"**Passed:** {s.get('passed', 0)}\"); print(f\"**Failed:** {s.get('failed', 0)}\")" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: 📤 Upload combined artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flavor-ingredients-${{ needs.setup.outputs.version }}-all
          path: |
            final/*.zip
            final/*.json