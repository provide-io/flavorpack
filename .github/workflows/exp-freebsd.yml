name: 🧪 Experimental FreeBSD

on:
  workflow_dispatch:
    inputs:
      freebsd_version:
        description: 'FreeBSD version'
        type: string
        default: '14.2'
        required: false

jobs:
  build-and-test:
    name: 🐡 FreeBSD ${{ inputs.freebsd_version || '14.2' }} amd64
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 🔍 Get version
        id: version
        run: |
          VERSION=$(cat VERSION || echo "0.0.1")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

      - name: 🐡 Build and test inside FreeBSD VM
        uses: cross-platform-actions/action@v0.27.0
        with:
          operating_system: freebsd
          version: ${{ inputs.freebsd_version || '14.2' }}
          architecture: x86-64
          shell: bash
          run: |
            set -eo pipefail

            PLATFORM="freebsd_amd64"
            VERSION="${{ steps.version.outputs.version }}"

            echo "🐡 FreeBSD $(uname -r) — $(uname -m)"
            echo "📦 Version: $VERSION"

            # ── Install Go ──────────────────────────────────────────────
            echo "🐹 Installing Go..."
            sudo env IGNORE_OSVERSION=yes pkg update -f
            sudo env IGNORE_OSVERSION=yes pkg install -y go

            GO_VERSION=$(go version)
            echo "✅ $GO_VERSION"

            # ── Build Go helpers ────────────────────────────────────────
            echo "🔨 Building Go helpers for $PLATFORM..."
            mkdir -p dist/bin
            cd src/flavor-go

            export GOOS=freebsd
            export GOARCH=amd64
            export CGO_ENABLED=0

            go build -buildvcs=false -ldflags "-X main.Version=$VERSION" \
              -o ../../dist/bin/flavor-go-builder-$VERSION-$PLATFORM \
              cmd/flavor-go-builder/main.go

            go build -buildvcs=false -ldflags "-X main.Version=$VERSION" \
              -o ../../dist/bin/flavor-go-launcher-$VERSION-$PLATFORM \
              cmd/flavor-go-launcher/main.go

            cd ../..
            echo "✅ Go helpers built"
            ls -lh dist/bin/

            # ── Run Go tests ────────────────────────────────────────────
            echo "🧪 Running Go test suite..."
            cd src/flavor-go
            go test ./... -count=1 -timeout=300s
            cd ../..
            echo "✅ Go tests passed"

            # ── Smoke test binaries ─────────────────────────────────────
            echo "🔍 Smoke testing binaries..."
            chmod +x dist/bin/flavor-go-builder-$VERSION-$PLATFORM
            chmod +x dist/bin/flavor-go-launcher-$VERSION-$PLATFORM

            echo "  Builder --version:"
            dist/bin/flavor-go-builder-$VERSION-$PLATFORM --version

            echo "  Launcher CLI help:"
            FLAVOR_LAUNCHER_CLI=1 dist/bin/flavor-go-launcher-$VERSION-$PLATFORM help

            echo "✅ Smoke tests passed"

      - name: 📤 Upload FreeBSD binaries
        uses: actions/upload-artifact@v7
        with:
          name: flavor-go-helpers-${{ steps.version.outputs.version }}-freebsd_amd64
          path: dist/bin/*-freebsd_amd64
          if-no-files-found: error
