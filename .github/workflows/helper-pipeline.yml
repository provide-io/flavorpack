  # Combine all artifacts
  combine:
    name: 📦 Combine Artifacts
    # TEMPORARILY REMOVED build-windows-amd64 from dependencies
    needs: [check-diff, build-linux-amd64, build-linux-arm64, build-darwin-amd64, build-darwin-arm64]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout (for scripts)
        uses: actions/checkout@v4
      
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: flavor-helpers-${{ needs.check-diff.outputs.version }}-*
          path: platform-artifacts
      
      - name: 🔀 Combine binaries
        run: |
          .github/scripts/combine-binaries.sh platform-artifacts ${{ needs.check-diff.outputs.version }} final
      
      - name: 📊 Combine metadata
        run: |
          .github/scripts/combine-platform-metadata.sh \
            "platform-artifacts" \
            "${{ needs.check-diff.outputs.version }}" \
            "final/combined-metadata.json"
      
      - name: 🧪 Combine test results
        run: |
          .github/scripts/combine-test-results.sh \
            "platform-artifacts" \
            "final/combined-test-report.json"
      
      - name: 📊 Generate checksums
        run: |
          cd final
          ../.github/scripts/generate-checksums.sh \
            "${{ needs.check-diff.outputs.version }}" \
            "${{ needs.check-diff.outputs.hash }}"
          cd ..
      
      - name: 📤 Upload combined
        uses: actions/upload-artifact@v4
        with:
          name: flavor-helpers-${{ needs.check-diff.outputs.version }}-all
          path: |
            final/*.zip
            final/*.txt
            final/*.json
      
      - name: 📤 Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ needs.check-diff.outputs.version }}
          path: |
            final/combined-test-report.json
      
      - name: 📤 Upload metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata-${{ needs.check-diff.outputs.version }}
          path: |
            final/combined-metadata.json
            platform-artifacts/*/metadata/
  
  # Validate and generate summary
  validate:
    name: 🧪 Validate & Summarize
    needs: [check-diff, combine]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout (for scripts)
        uses: actions/checkout@v4
      
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: flavor-helpers-${{ needs.check-diff.outputs.version }}-*
          path: artifacts
      
      - name: 📥 Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results-${{ needs.check-diff.outputs.version }}
          path: artifacts/final
      
      - name: 🔍 Validate artifacts
        id: validate
        run: |
          python3 .github/scripts/validate-helper-pipeline.py artifacts validation-report.json ${{ needs.check-diff.outputs.version }} || true
      
      - name: 📊 Generate summary
        if: always()
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          python3 .github/scripts/generate-pipeline-summary.py \
            validation-report.json \
            "${{ github.run_id }}"
      
      - name: 📤 Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-${{ needs.check-diff.outputs.version }}
          path: |
            validation-report.json
            pipeline-summary.md
