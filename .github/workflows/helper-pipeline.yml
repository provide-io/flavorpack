name: 🔨 Helper Pipeline

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if cached'
        type: boolean
        default: false
  
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'helpers/flavor-go/**'
      - 'helpers/flavor-rs/**'
      - '.github/workflows/helper-pipeline.yml'
      - '.github/scripts/build-platform-helpers.sh'
  
  pull_request:
    paths:
      - 'helpers/flavor-go/**'
      - 'helpers/flavor-rs/**'
  
  workflow_call:
    outputs:
      artifact-name:
        description: 'Name of the combined artifact'
        value: flavor-helpers-${{ jobs.check-diff.outputs.version }}-all

jobs:
  # Check if helpers changed and get version
  check-diff:
    name: 📊 Check Changes
    runs-on: ubuntu-latest
    outputs:
      helpers_changed: ${{ steps.diff.outputs.changed }}
      hash: ${{ steps.diff.outputs.hash }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for git diff
      
      - name: 🔍 Check helpers diff
        id: diff
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: .github/scripts/check-helpers-diff.sh
      
      - name: 🔍 Get version
        id: version
        run: .github/scripts/get-helper-version.sh

  # Build for Linux AMD64
  build-linux-amd64:
    name: 🐧 Build Linux AMD64
    needs: check-diff
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        id: checkout
        uses: actions/checkout@v4
      
      - name: 📊 Initialize build metadata
        id: metadata
        run: |
          METADATA_FILE=$(.github/scripts/capture-build-metadata.sh \
            "linux_amd64" \
            "${{ needs.check-diff.outputs.version }}" \
            "artifacts/metadata")
          echo "metadata_file=$METADATA_FILE" >> $GITHUB_OUTPUT
          
          # Record container startup time
          .github/scripts/record-timing.sh "$METADATA_FILE" "container_startup" "start"
      
      - name: 💾 Check cache (DISABLED - always rebuild)
        id: cache
        run: |
          echo "cache-hit=false" >> $GITHUB_OUTPUT
          echo "Cache check disabled - always rebuilding"
          # Note: We still upload artifacts for other workflows to use
      
      - name: ⏱️ Record cache check
        if: always()
        run: |
          .github/scripts/record-timing.sh "${{ steps.metadata.outputs.metadata_file }}" "cache_check" "end"
          .github/scripts/record-timing.sh "${{ steps.metadata.outputs.metadata_file }}" "cache_hit" "record" "${{ steps.cache.outputs.cache-hit }}"
      
      - name: 🐹 Setup Go
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: 🦀 Setup Rust
        if: steps.cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      
      - name: 🔨 Build
        id: build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          .github/scripts/record-timing.sh "${{ steps.metadata.outputs.metadata_file }}" "build_total" "start"
          
          # Build Go helpers
          .github/scripts/record-timing.sh "${{ steps.metadata.outputs.metadata_file }}" "build_go" "start"
          .github/scripts/build-platform-helpers.sh linux_amd64 linux amd64 x86_64-unknown-linux-gnu
          .github/scripts/record-timing.sh "${{ steps.metadata.outputs.metadata_file }}" "build_go" "end"
          
          .github/scripts/record-timing.sh "${{ steps.metadata.outputs.metadata_file }}" "build_total" "end"
          
          # Output for compatibility
          echo "timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT
      
      - name: 📦 Package
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          .github/scripts/record-timing.sh "${{ steps.metadata.outputs.metadata_file }}" "package" "start"
          .github/scripts/package-with-metadata.sh \
            "linux_amd64" \
            "${{ needs.check-diff.outputs.version }}" \
            "helpers/bin" \
            "artifacts" \
            "${{ steps.metadata.outputs.metadata_file }}"
          .github/scripts/record-timing.sh "${{ steps.metadata.outputs.metadata_file }}" "package" "end"
      
      - name: 📦 Extract cached binaries
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          mkdir -p helpers/bin
          if [ -f "artifacts/flavor-helpers-${{ needs.check-diff.outputs.version }}-linux_amd64.zip" ]; then
            unzip -o "artifacts/flavor-helpers-${{ needs.check-diff.outputs.version }}-linux_amd64.zip" -d helpers/bin/
          fi
      
      - name: 🧪 Test binaries
        id: test
        continue-on-error: true
        run: |
          mkdir -p artifacts/test-results
          .github/scripts/test-platform-binaries.sh linux_amd64 helpers/bin artifacts/test-results
      
      
      # Cache saving disabled - always rebuilding
      # - name: 💾 Save cache
      #   if: steps.cache.outputs.cache-hit != 'true'
      #   uses: actions/cache/save@v4
      #   with:
      #     path: |
      #       artifacts/flavor-helpers-${{ needs.check-diff.outputs.version }}-linux_amd64.zip
      #     key: flavor-helpers-${{ needs.check-diff.outputs.version }}-linux_amd64
      
      - name: 📊 Generate metadata
        if: always()
        env:
          BUILD_DURATION: ${{ steps.build.outputs.duration || '0' }}
          BUILD_TIMESTAMP: ${{ steps.build.outputs.timestamp || '' }}
        run: |
          .github/scripts/generate-platform-metadata.sh \
            "linux_amd64" \
            "${{ needs.check-diff.outputs.version }}" \
            "${{ steps.cache.outputs.cache-hit == 'true' }}" \
            "artifacts/metadata"
      
      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flavor-helpers-${{ needs.check-diff.outputs.version }}-linux_amd64
          path: |
            artifacts/*.zip
            artifacts/metadata/
            artifacts/test-results/

