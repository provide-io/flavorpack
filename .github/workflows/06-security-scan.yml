name: 06 🔒 Security Scanning

on:
  workflow_dispatch:
    inputs:
      min_score:
        description: 'Minimum security score (0-100)'
        type: number
        default: 85

  push:
    branches: [main, develop]
    paths:
      - '**.py'
      - '**.go'
      - '**.rs'
      - '**.toml'
      - '**.json'
      - 'requirements*.txt'
      - 'go.mod'
      - 'go.sum'
      - 'Cargo.toml'
      - 'Cargo.lock'

  schedule:
    # Run security scan daily at 3 AM UTC
    - cron: '0 3 * * *'

permissions:
  contents: read
  security-events: write
  actions: read

env:
  MIN_SCORE: ${{ inputs.min_score || 85 }}
  UV_SYSTEM_PYTHON: 1

jobs:
  # Unified Python Security Scanning via provide-testkit
  python-security:
    name: 🐍 Python Security (provide-testkit)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install UV
        run: pip install uv

      - name: 🔧 Install provide-testkit
        run: |
          uv pip install --system provide-testkit
          echo "Installed provide-testkit version:"
          provide-testkit --version || echo "Version command not available"

      - name: 🔒 Run Security Analysis
        id: security
        run: |
          echo "## 🔒 Python Security Analysis (provide-testkit)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Run provide-testkit security scan
          provide-testkit quality security src/ \
            --min-score ${{ env.MIN_SCORE }} \
            --artifact-dir .security-artifacts \
            2>&1 | tee security.log || true

          # Extract results
          if [ -f .security-artifacts/security_summary.txt ]; then
            echo "### Security Summary" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat .security-artifacts/security_summary.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f .security-artifacts/security_issues.txt ]; then
            ISSUE_COUNT=$(wc -l < .security-artifacts/security_issues.txt)
            echo "Found $ISSUE_COUNT lines of issues" >> $GITHUB_STEP_SUMMARY
          fi

          # Check pass/fail
          if grep -q "PASSED" security.log; then
            echo "✅ Security scan PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Security scan FAILED" >> $GITHUB_STEP_SUMMARY
            echo "security_failed=true" >> $GITHUB_ENV
          fi

      - name: 📤 Upload Security Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-security-report
          path: |
            .security-artifacts/
            security.log
          retention-days: 30

      - name: 🚨 Fail on Security Issues
        if: env.security_failed == 'true'
        run: |
          echo "Security scan failed to meet minimum score of ${{ env.MIN_SCORE }}"
          exit 1

  # Secret Scanning with Gitleaks
  secret-scan:
    name: 🔑 Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔐 Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Secret Scan Summary
        run: |
          echo "## 🔑 Secret Scanning" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Gitleaks scan completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Note: All cryptographic keys have been removed from git history." >> $GITHUB_STEP_SUMMARY
          echo "Keys are now in .gitignore to prevent future commits." >> $GITHUB_STEP_SUMMARY

  # Go Security Scanning
  go-security:
    name: 🔷 Go Security
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔷 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 🔒 Gosec Security Scan
        continue-on-error: true
        run: |
          echo "## 🔷 Go Security Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          go install github.com/securego/gosec/v2/cmd/gosec@latest

          cd src/flavor-go
          gosec -fmt json -out gosec.json ./... 2>&1 | tee gosec.log || true

          if [ -f gosec.json ]; then
            ISSUE_COUNT=$(jq '.Issues | length' gosec.json)
            echo "Found $ISSUE_COUNT Go security issues" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No Go security issues found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🔍 Go Vulnerability Check
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest

          cd src/flavor-go
          echo "### Go Vulnerability Check" >> $GITHUB_STEP_SUMMARY
          govulncheck ./... 2>&1 | tee govulncheck.log || true

          if grep -q "No vulnerabilities found" govulncheck.log; then
            echo "✅ No known vulnerabilities in Go dependencies" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Check govulncheck.log for potential vulnerabilities" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📤 Upload Go Security Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-security-report
          path: |
            src/flavor-go/gosec.json
            src/flavor-go/gosec.log
            src/flavor-go/govulncheck.log
          retention-days: 30

  # Rust Security Scanning
  rust-security:
    name: 🦀 Rust Security
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: 🔒 Cargo Audit
        continue-on-error: true
        run: |
          echo "## 🦀 Rust Security Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          cargo install cargo-audit

          cd src/flavor-rs
          cargo audit --json > cargo-audit.json 2>&1 || true

          if [ -f cargo-audit.json ]; then
            VULN_COUNT=$(jq '.vulnerabilities.count' cargo-audit.json)
            if [ "$VULN_COUNT" = "0" ] || [ "$VULN_COUNT" = "null" ]; then
              echo "✅ No known vulnerabilities in Rust dependencies" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ Found $VULN_COUNT vulnerabilities in Rust dependencies" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: 📤 Upload Rust Security Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-security-report
          path: src/flavor-rs/cargo-audit.json
          retention-days: 30

  # Security Summary
  security-summary:
    name: 📊 Security Summary
    runs-on: ubuntu-latest
    needs: [python-security, secret-scan, go-security, rust-security]
    if: always()
    steps:
      - name: 📊 Generate Summary
        run: |
          echo "## 🔒 Security Scan Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python (provide-testkit) | ${{ needs.python-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scanning | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Go Security | ${{ needs.go-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rust Security | ${{ needs.rust-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Key Improvements" >> $GITHUB_STEP_SUMMARY
          echo "- All cryptographic keys purged from git history" >> $GITHUB_STEP_SUMMARY
          echo "- Keys are gitignored to prevent future commits" >> $GITHUB_STEP_SUMMARY
          echo "- Using provide-testkit for unified Python security scanning" >> $GITHUB_STEP_SUMMARY
          echo "- Streamlined workflow with clear artifact collection" >> $GITHUB_STEP_SUMMARY
