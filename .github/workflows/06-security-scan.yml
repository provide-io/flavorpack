name: 06 🔒 Security Scanning

on:
  workflow_dispatch:
    inputs:
      scan_depth:
        description: 'Scan depth (shallow/deep/paranoid)'
        type: choice
        options:
          - shallow
          - deep
          - paranoid
        default: deep
      enable_sarif:
        description: 'Enable SARIF reporting for GitHub Security tab'
        type: boolean
        default: true
  
  push:
    branches: [main, develop]
    paths:
      - '**.py'
      - '**.go'
      - '**.rs'
      - '**.yml'
      - '**.yaml'
      - '**.toml'
      - '**.json'
      - 'requirements*.txt'
      - 'Pipfile*'
      - 'poetry.lock'
      - 'go.mod'
      - 'go.sum'
      - 'Cargo.toml'
      - 'Cargo.lock'
  
  schedule:
    # Run security scan daily at 3 AM UTC
    - cron: '0 3 * * *'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  scan:
    name: ${{ matrix.scanner.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scanner:
          - name: 🔑 Secret Scanning
            run-command: |
              .github/scripts/run-trufflehog-scan.sh
              .github/scripts/run-detect-secrets-scan.sh
            upload-name: secret-scan-results
            upload-path: |
              trufflehog.json
              trufflehog.log
              .secrets.baseline
              detect-secrets.log
          - name: 🐍 Python Security
            run-command: |
              .github/scripts/install-security-tools.sh
              source security-env/bin/activate
              .github/scripts/run-bandit-scan.sh
              .github/scripts/run-safety-scan.sh
              .github/scripts/run-pip-audit-scan.sh
              .github/scripts/run-semgrep-scan.sh
              .github/scripts/run-dodgy-scan.sh
            upload-name: python-security-results
            upload-path: |
              *.json
              *.log
              *.sarif
          - name: 🐹 Go Security
            run-command: |
              .github/scripts/install-security-tools.sh
              .github/scripts/run-gosec-scan.sh
              .github/scripts/run-govulncheck-scan.sh
              cd src/flavor-go
              go list -json -deps ./... | nancy sleuth 2>&1 | tee nancy.log || true
            upload-name: go-security-results
            upload-path: |
              src/flavor-go/*.json
              src/flavor-go/*.log
          - name: 🦀 Rust Security
            run-command: |
              .github/scripts/install-security-tools.sh
              .github/scripts/run-cargo-audit-scan.sh
              cd src/flavor-rs
              cargo deny check 2>&1 | tee cargo-deny.log || true
              cargo geiger --output-format Json > cargo-geiger.json 2>&1 || true
            upload-name: rust-security-results
            upload-path: |
              src/flavor-rs/*.json
              src/flavor-rs/*.log
              src/flavor-rs/deny.toml
          - name: 🐳 Container Security
            run-command: |
              .github/scripts/install-security-tools.sh
              .github/scripts/run-trivy-scan.sh
            upload-name: container-security-results
            upload-path: |
              hadolint*.json
              hadolint*.log
              trivy-results.sarif
          - name: 🏗️ IaC Security
            run-command: |
              .github/scripts/install-security-tools.sh
              .github/scripts/run-checkov-scan.sh
              yamllint -f parsable . > yamllint.log 2>&1 || true
            upload-name: iac-security-results
            upload-path: |
              checkov-report.json
              yamllint.log
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 🛡️ Run ${{ matrix.scanner.name }}
        continue-on-error: true
        run: ${{ matrix.scanner.run-command }}

      - name: 📤 Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.scanner.upload-name }}
          path: ${{ matrix.scanner.upload-path }}

  security-report:
    name: 📊 Security Report
    needs: [scan]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Download all security reports
        uses: actions/download-artifact@v4
        with:
          path: security-reports
      
      - name: 🐍 Setup Python for summary generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📊 Generate Consolidated Security Report
        run: |
          python3 .github/scripts/generate-security-summary.py \
            security-reports \
            security-summary.json \
            --github-repo "${{ github.repository }}" \
            --github-ref "${{ github.ref_name }}" \
            --github-sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}"
      
      - name: 📤 Upload Consolidated Report
        uses: actions/upload-artifact@v4
        with:
          name: security-summary
          path: security-summary.json
