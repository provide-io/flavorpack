name: 05 🎨 Code Quality

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Enable verbose output'
        type: boolean
        required: false
        default: false
      skip_cache:
        description: 'Skip cache restoration'
        type: boolean
        required: false
        default: false

  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.py'
      - '**.go'
      - '**.rs'
      - 'pyproject.toml'
      - 'go.mod'
      - 'Cargo.toml'
      - '.github/workflows/05-code-quality.yml'
      - '.github/scripts/*quality*.sh'
      - '.github/scripts/run-*.sh'

  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Python Code Quality
  python-quality:
    name: 🐍 Python Quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Quality Tools
        run: .github/scripts/install-quality-tools.sh

      - name: 🎨 Code Formatting Check
        id: formatting
        continue-on-error: true
        run: .github/scripts/run-formatting-check.sh

      - name: 🔍 Linting Analysis
        id: linting
        continue-on-error: true
        run: .github/scripts/run-linting-analysis.sh

      - name: 🔒 Type Checking
        id: type-checking
        continue-on-error: true
        run: .github/scripts/run-type-checking.sh

      - name: 📊 Complexity Analysis
        id: complexity
        continue-on-error: true
        run: .github/scripts/run-complexity-analysis.sh

      - name: 📝 Documentation Quality
        id: documentation
        continue-on-error: true
        run: .github/scripts/run-documentation-quality.sh

      - name: 🧹 Dead Code Detection
        id: dead-code
        continue-on-error: true
        run: .github/scripts/run-dead-code-detection.sh

      - name: 📈 Generate Quality Metrics
        if: always()
        run: .github/scripts/generate-quality-metrics.sh

      - name: 📤 Upload Quality Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-quality-reports
          path: |
            *.log
            *.json
            mypy-report/
            mypy-txt/
            quality-report.json
          retention-days: 7

  # Go Code Quality
  go-quality:
    name: 🐹 Go Quality
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: |
            src/flavor-go/go.sum

      - name: 📦 Install Go Quality Tools
        run: .github/scripts/install-go-quality-tools.sh

      - name: 🔍 Go Linting
        continue-on-error: true
        run: .github/scripts/run-go-linting.sh

      - name: 📤 Upload Go Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-quality-reports
          path: |
            src/flavor-go/*.log
            src/flavor-go/*.json
          retention-days: 7

  # Rust Code Quality
  rust-quality:
    name: 🦀 Rust Quality
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Rust Toolchain with Cache
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache: true

      - name: 📦 Cache Rust Quality Tools
        uses: actions/cache@v4
        id: cache-rust-tools
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-outdated
            ~/.cargo/bin/cargo-machete
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-geiger
          key: rust-tools-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-v1
          restore-keys: |
            rust-tools-${{ runner.os }}-v1

      - name: 📦 Install Rust Quality Tools
        if: steps.cache-rust-tools.outputs.cache-hit != 'true'
        run: .github/scripts/install-rust-quality-tools.sh

      - name: 🔍 Rust Linting
        continue-on-error: true
        run: .github/scripts/run-rust-linting.sh

      - name: 📤 Upload Rust Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-quality-reports
          path: |
            src/flavor-rs/*.log
          retention-days: 7

  # Aggregate Quality Report
  quality-report:
    name: 📊 Quality Report
    needs: [python-quality, go-quality, rust-quality]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📥 Download all reports
        uses: actions/download-artifact@v4
        with:
          path: quality-reports

      - name: 📊 Generate Final Report
        run: .github/scripts/generate-final-quality-report.sh