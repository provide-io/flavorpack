name: 🧪 Act Local Test

on:
  workflow_dispatch:
  push:
    branches: [act-test]
  pull_request:
    branches: [act-test]

jobs:
  quick-test:
    name: Quick Local Test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        if: env.ACT != 'true'  # Skip checkout in act for now
      
      - name: 🔍 Environment Info
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Is Act: ${ACT:-false}"
          echo "GitHub Ref: $GITHUB_REF"
          echo "Working Directory: $(pwd)"
          echo "Available Tools:"
          which go || echo "  Go: not found"
          which cargo || echo "  Cargo: not found"
          which python3 || echo "  Python3: not found"
      
      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: 🦀 Setup Rust
        if: env.ACT != 'true'  # Skip in act if it takes too long
        uses: dtolnay/rust-toolchain@stable
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: 📦 Quick Dependency Check
        run: |
          echo "Checking Go..."
          cd helpers/flavor-go
          go mod download
          echo "✅ Go dependencies OK"
          
          if [ "$ACT" != "true" ]; then
            echo "Checking Rust..."
            cd ../flavor-rs
            cargo check --quiet
            echo "✅ Rust dependencies OK"
          fi
          
          cd ../..
          echo "Checking Python..."
          pip install --quiet uv
          uv pip install --system --quiet -e .
          echo "✅ Python dependencies OK"
      
      - name: 🔨 Quick Build Test
        run: |
          echo "Building Go helpers..."
          cd helpers/flavor-go
          go build -o /tmp/test-go-launcher ./cmd/flavor-go-launcher
          echo "✅ Go launcher built"
          
          if [ "$ACT" != "true" ]; then
            echo "Building Rust helpers..."
            cd ../flavor-rs
            cargo build --quiet --bin flavor-rs-launcher
            echo "✅ Rust launcher built"
          fi
      
      - name: 🧪 Quick Unit Tests
        run: |
          echo "Running minimal Python tests..."
          python -m pytest tests/unit -x --tb=short -q || echo "⚠️ Some tests failed (expected in act)"
          echo "✅ Basic tests completed"
      
      - name: 📊 Summary
        if: always()
        run: |
          echo "========================================="
          echo "Act Local Test Summary"
          echo "========================================="
          if [ "$ACT" = "true" ]; then
            echo "✅ Running in act environment"
            echo "  Some features may be limited"
          else
            echo "✅ Running in GitHub Actions"
          fi
          echo "========================================="