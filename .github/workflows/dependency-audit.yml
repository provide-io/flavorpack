name: 07 📦 Dependency Audit

on:
  workflow_dispatch:
    inputs:
      check_updates:
        description: 'Check for dependency updates'
        type: boolean
        default: true
      auto_pr:
        description: 'Create PR for updates (if any)'
        type: boolean
        default: false
  
  schedule:
    # Run weekly on Mondays at 4 AM UTC
    - cron: '0 4 * * 1'
  
  push:
    paths:
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'Pipfile*'
      - 'go.mod'
      - 'go.sum'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'yarn.lock'
      - 'pnpm-lock.yaml'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # Python Dependency Audit
  python-deps:
    name: 🐍 Python Dependencies
    runs-on: ubuntu-24.04
    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
      update_count: ${{ steps.check.outputs.update_count }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      
      - name: 📦 Setup uv + Python
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: '3.11'

      - name: 📦 Install Audit Tools
        run: |
          uv sync
          uv pip install pip-audit safety pip-licenses pipdeptree pip-check outdated pipgrip johnnydep pip-autoremove
      
      - name: 🔍 Dependency Tree Analysis
        run: |
          python3 ci/dependency_workflow_helpers.py python-tree
      
      - name: 🔒 Vulnerability Scanning
        id: vuln-scan
        continue-on-error: true
        run: |
          python3 ci/dependency_workflow_helpers.py python-vulns
      
      - name: 📋 License Analysis
        continue-on-error: true
        run: |
          python3 ci/dependency_workflow_helpers.py python-licenses
      
      - name: 🔄 Check for Updates
        id: check
        if: inputs.check_updates == true
        continue-on-error: true
        run: |
          python3 ci/dependency_workflow_helpers.py python-updates
      
      - name: 🧹 Identify Unused Dependencies
        continue-on-error: true
        run: |
          python3 ci/dependency_workflow_helpers.py python-unused
      
      - name: 📊 Generate Dependency Report
        if: always()
        run: |
          python3 ci/dependency_workflow_helpers.py python-report
      
      - name: 📤 Upload Python Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-dependency-reports
          path: |
            *.json
            *.md
            *.txt
            *.log

  # Go Dependency Audit
  go-deps:
    name: 🐹 Go Dependencies
    runs-on: ubuntu-24.04
    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      
      - name: 🐹 Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "${{ vars.GO_VERSION }}"
      
      - name: 🔍 Dependency Analysis
        run: |
          python3 ci/dependency_workflow_helpers.py go-analysis
      
      - name: 🔒 Vulnerability Scanning
        continue-on-error: true
        run: |
          python3 ci/dependency_workflow_helpers.py go-vulns
      
      - name: 📋 License Check
        continue-on-error: true
        run: |
          python3 ci/dependency_workflow_helpers.py go-licenses
      
      - name: 🔄 Check for Updates
        id: check
        if: inputs.check_updates == true
        continue-on-error: true
        run: |
          python3 ci/dependency_workflow_helpers.py go-updates
      
      - name: 🧹 Check Module Tidiness
        continue-on-error: true
        run: |
          python3 ci/dependency_workflow_helpers.py go-tidiness
      
      - name: 📤 Upload Go Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-dependency-reports
          path: |
            src/flavor-go/*.json
            src/flavor-go/*.txt
            src/flavor-go/*.log

  # Rust Dependency Audit
  rust-deps:
    name: 🦀 Rust Dependencies
    runs-on: ubuntu-24.04
    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      
      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: 📦 Install Cargo Tools
        run: |
          cargo install cargo-audit cargo-outdated cargo-tree cargo-license cargo-deny cargo-machete cargo-udeps
      
      - name: 🔍 Dependency Tree
        run: |
          python3 ci/dependency_workflow_helpers.py rust-analysis
      
      - name: 🔒 Security Audit
        continue-on-error: true
        run: |
          python3 ci/dependency_workflow_helpers.py rust-security
      
      - name: 📋 License Analysis
        continue-on-error: true
        run: |
          python3 ci/dependency_workflow_helpers.py rust-licenses
      
      - name: 🔄 Check for Updates
        id: check
        if: inputs.check_updates == true
        continue-on-error: true
        run: |
          python3 ci/dependency_workflow_helpers.py rust-updates
      
      - name: 🧹 Check for Unused Dependencies
        continue-on-error: true
        run: |
          python3 ci/dependency_workflow_helpers.py rust-unused
      
      - name: 📤 Upload Rust Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-dependency-reports
          path: |
            src/flavor-rs/*.json
            src/flavor-rs/*.txt
            src/flavor-rs/*.log

  # Dependency Report and Update PR
  dependency-report:
    name: 📊 Dependency Report
    needs: [python-deps, go-deps, rust-deps]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      
      - name: 📥 Download all reports
        uses: actions/download-artifact@v8
        with:
          path: dependency-reports
      
      - name: 📊 Generate Consolidated Report
        env:
          DEPENDENCY_REPOSITORY: ${{ github.repository }}
          DEPENDENCY_RUN_ID: ${{ github.run_id }}
          DEPENDENCY_GO_HAS_UPDATES: ${{ needs.go-deps.outputs.has_updates }}
          DEPENDENCY_RUST_HAS_UPDATES: ${{ needs.rust-deps.outputs.has_updates }}
        run: |
          export DEPENDENCY_TIMESTAMP="$(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          export DEPENDENCY_ISO_TIMESTAMP="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          python3 ci/dependency_workflow_helpers.py dependency-report
      
      - name: 🔄 Create Update PR
        if: inputs.auto_pr == true && (needs.python-deps.outputs.has_updates == 'true' || needs.go-deps.outputs.has_updates == 'true' || needs.rust-deps.outputs.has_updates == 'true')
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: Update dependencies"
          title: "🔄 Dependency Updates Available"
          body: |
            ## 📦 Dependency Updates
            
            This PR contains available dependency updates identified by the dependency audit workflow.
            
            ### Updates Available:
            - Python: ${{ needs.python-deps.outputs.has_updates == 'true' && needs.python-deps.outputs.update_count || '0' }} packages
            - Go: ${{ needs.go-deps.outputs.has_updates == 'true' && 'Yes' || 'No' }}
            - Rust: ${{ needs.rust-deps.outputs.has_updates == 'true' && 'Yes' || 'No' }}
            
            ### Action Required:
            1. Review the changes
            2. Run tests locally
            3. Check for breaking changes
            4. Merge if all checks pass
            
            ---
            *Generated by Dependency Audit Workflow - Run #${{ github.run_id }}*
          branch: deps/update-${{ github.run_id }}
          delete-branch: true
      
      - name: 📤 Upload Summary
        uses: actions/upload-artifact@v7
        with:
          name: dependency-summary
          path: dependency-summary.json
