name: 05 🎨 Code Quality

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Enable verbose output'
        type: boolean
        required: false
        default: false
      skip_cache:
        description: 'Skip cache restoration'
        type: boolean
        required: false
        default: false
  
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.py'
      - '**.go'
      - '**.rs'
      - 'Makefile'
      - 'src/flavor-go/Makefile'
      - 'src/flavor-rs/Makefile'
      - 'src/flavor-rs/fuzz/**'
      - 'pyproject.toml'
      - 'src/flavor-go/go.mod'
      - 'src/flavor-rs/Cargo.toml'
      - 'src/flavor-rs/fuzz/Cargo.toml'
      - '.github/workflows/code-quality.yml'
  
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Python Code Quality
  python-quality:
    name: 🐍 Python Quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # Full history for better analysis
      
      - name: 📦 Setup uv + Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.11'

      # The linters live in the pinned "quality" dependency group so a local run
      # and this one enforce the same versions. Installing them unpinned here
      # meant an upstream release could change what CI enforces with no commit.
      - name: 📦 Install Quality Tools
        run: uv sync --group quality

      - name: 🔍 Python Quality Checks
        run: source .venv/bin/activate && ci/quality-checks.sh python

      - name: 📤 Upload Quality Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-quality-reports
          path: quality-logs/
          if-no-files-found: ignore

  # Go Code Quality
  go-quality:
    name: 🐹 Go Quality
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      
      - name: 🐹 Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "${{ vars.GO_VERSION }}"
          cache: true
          cache-dependency-path: |
            src/flavor-go/go.sum
      
      # Pinned versions, and only the tools quality-checks.sh runs.
      - name: 📦 Install Go Quality Tools
        run: ci/install-go-quality-tools.sh

      # Blocking: go vet, golangci-lint, staticcheck. Advisory: gocyclo, whose
      # backlog is complexity in existing functions rather than new findings.
      - name: 🔍 Go Quality Checks
        run: ci/quality-checks.sh go

      - name: 📤 Upload Go Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-quality-reports
          path: quality-logs/
          if-no-files-found: ignore

  # Rust Code Quality
  rust-quality:
    name: 🦀 Rust Quality
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      
      - name: 🔧 Setup Rust Toolchain with Cache
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache: true

      # Cached by binary, not gated on the cache: the installer verifies the
      # tool is runnable, so a stale cache cannot silently skip installation.
      - name: 📦 Cache Rust Quality Tools
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-machete
          key: rust-tools-${{ runner.os }}-cargo-machete-0.9.1

      # Pinned, and only the tool quality-checks.sh runs.
      - name: 📦 Install Rust Quality Tools
        run: ci/install-rust-quality-tools.sh
      
      # Blocking: clippy, rustfmt -- both green on main.
      # All three Rust checks are enforced; cargo machete reports nothing on main.
      - name: 🔍 Rust Quality Checks
        run: ci/quality-checks.sh rust

      - name: 📤 Upload Rust Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-quality-reports
          path: quality-logs/
          if-no-files-found: ignore

  # Aggregate Quality Report
  quality-report:
    name: 📊 Quality Report
    needs: [python-quality, go-quality, rust-quality]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Download all reports
        uses: actions/download-artifact@v8
        with:
          path: quality-reports
      
      - name: 📊 Generate Final Report
        run: |
          echo "# 🎨 Code Quality Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## Language Reports" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check each language status
          echo "| Language | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|---------|" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "quality-reports/python-quality-reports" ]; then
            if [ -f "quality-reports/python-quality-reports/quality-report.json" ]; then
              TOTAL=$(jq -r '.metrics.total_issues' quality-reports/python-quality-reports/quality-report.json)
              echo "| 🐍 Python | $([ $TOTAL -lt 100 ] && echo '✅' || echo '⚠️') | $TOTAL issues |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| 🐍 Python | ❌ | Report generation failed |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| 🐍 Python | ⏭️ | Skipped |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -d "quality-reports/go-quality-reports" ]; then
            echo "| 🐹 Go | ✅ | Analysis complete |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🐹 Go | ⏭️ | Skipped |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -d "quality-reports/rust-quality-reports" ]; then
            echo "| 🦀 Rust | ✅ | Analysis complete |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🦀 Rust | ⏭️ | Skipped |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Review the detailed reports in each job" >> $GITHUB_STEP_SUMMARY
          echo "2. Fix critical issues first (type errors, security issues)" >> $GITHUB_STEP_SUMMARY
          echo "3. Address formatting and style issues" >> $GITHUB_STEP_SUMMARY
          echo "4. Consider refactoring high-complexity code" >> $GITHUB_STEP_SUMMARY
          echo "5. Add missing documentation" >> $GITHUB_STEP_SUMMARY

  python-quality-observability:
    name: 🐍 Python Intent Observability
    # Mutation testing is expensive; skip on PRs and run nightly/on-demand only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Deliberately tolerated: fuzzing and mutation testing are time-boxed and
    # non-deterministic, so a run that finds nothing new is not a regression.
    # The blocking gates live in the quality jobs above.
    continue-on-error: true
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 📦 Setup uv + Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          uv sync --group dev

      - name: 🧪 Run Python fast quality
        run: |
          source .venv/bin/activate
          make quality-python-fast

      - name: 🧬 Run Python mutation quality
        run: |
          source .venv/bin/activate
          make quality-python-deep

      - name: 📊 Summarize Python observability
        if: always()
        run: |
          echo "## 🐍 Python Intent Observability" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Commands: \`make quality-python-fast\`, \`make quality-python-deep\`" >> $GITHUB_STEP_SUMMARY
          echo "- Intent categories: Unit / Integration / Cross-Language / Security / Adversarial / Property / Fuzz / Mutation / Smoke" >> $GITHUB_STEP_SUMMARY
          ci/summarize-python-coverage.sh coverage.json >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload Python observability artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-quality-observability-${{ github.run_id }}
          path: |
            .coverage
            coverage.xml
            coverage.json
            htmlcov/
            .mutmut-cache/
          if-no-files-found: warn

  go-quality-observability:
    name: 🐹 Go Intent Observability
    # Mutation testing is expensive; skip on PRs and run nightly/on-demand only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # 45, not 30: the first run of this job to ever finish took 24m20s, which is
    # 81% of a 30-minute budget -- one slow runner from being killed and reported
    # as "cancelled", which is what happened to every run of this workflow
    # between July and 2026-08-23.
    timeout-minutes: 45
    # Deliberately tolerated: fuzzing and mutation testing are time-boxed and
    # non-deterministic, so a run that finds nothing new is not a regression.
    # The blocking gates live in the quality jobs above.
    continue-on-error: true
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🐹 Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/flavor-go/go.mod

      - name: 🧬 Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@latest

      - name: 📊 Run Go fast quality
        run: make quality-go-fast

      - name: 🧪 Run Go deep quality
        run: make quality-go-deep QUALITY_GO_FUZZTIME=15s QUALITY_GO_MUTATION_ARGS="./pkg/psp/format_2025"

      - name: 📊 Summarize Go observability
        if: always()
        run: |
          echo "## 🐹 Go Intent Observability" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Commands: \`make quality-go-fast\`, \`make quality-go-deep\`" >> $GITHUB_STEP_SUMMARY
          echo "- Intent categories: Unit / Integration / Cross-Language / Security / Adversarial / Property / Fuzz / Mutation / Smoke" >> $GITHUB_STEP_SUMMARY
          if [ -f src/flavor-go/coverage.txt ]; then
            echo "- Coverage summary:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -5 src/flavor-go/coverage.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📤 Upload Go observability artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-quality-observability-${{ github.run_id }}
          path: |
            src/flavor-go/coverage.out
            src/flavor-go/coverage.txt
          if-no-files-found: warn

  rust-quality-observability:
    name: 🦀 Rust Intent Observability
    # Mutation testing is expensive; skip on PRs and run nightly/on-demand only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Deliberately tolerated: fuzzing and mutation testing are time-boxed and
    # non-deterministic, so a run that finds nothing new is not a regression.
    # The blocking gates live in the quality jobs above.
    continue-on-error: true
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: 🧰 Install Rust quality tools
        run: |
          cargo install cargo-llvm-cov --locked || true
          cargo install cargo-mutants --locked || true
          cargo install cargo-fuzz --locked || true
          rustup toolchain install nightly --profile minimal

      - name: 📊 Run Rust fast quality
        run: make quality-rust-fast

      - name: 🧪 Run Rust deep quality
        run: make quality-rust-deep QUALITY_RUST_FUZZ_SECONDS=15 QUALITY_RUST_MUTATION_ARGS="--timeout 120 --iterate"

      - name: 📊 Summarize Rust observability
        if: always()
        run: |
          echo "## 🦀 Rust Intent Observability" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Commands: \`make quality-rust-fast\`, \`make quality-rust-deep\`" >> $GITHUB_STEP_SUMMARY
          echo "- Intent categories: Unit / Integration / Cross-Language / Security / Adversarial / Property / Fuzz / Mutation / Smoke" >> $GITHUB_STEP_SUMMARY
          if [ -f src/flavor-rs/coverage.txt ]; then
            echo "- Coverage summary:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat src/flavor-rs/coverage.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📤 Upload Rust observability artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-quality-observability-${{ github.run_id }}
          path: |
            src/flavor-rs/coverage.lcov
            src/flavor-rs/coverage.txt
            src/flavor-rs/.cargo-mutants.out/
            src/flavor-rs/fuzz/artifacts/
          if-no-files-found: warn

  quality-observability-report:
    name: 📈 Intent Observability Report
    needs: [python-quality-observability, go-quality-observability, rust-quality-observability]
    # Only runs when the observability jobs themselves run (not on PRs).
    if: github.event_name != 'pull_request' && always()
    runs-on: ubuntu-24.04
    steps:
      - name: 📊 Summarize observability jobs
        run: |
          echo "# 📈 Intent Observability Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🐍 Python | ${{ needs.python-quality-observability.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐹 Go | ${{ needs.go-quality-observability.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🦀 Rust | ${{ needs.rust-quality-observability.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Intent Categories" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Unit / Integration / Cross-Language" >> $GITHUB_STEP_SUMMARY
          echo "- Security / Adversarial / Property" >> $GITHUB_STEP_SUMMARY
          echo "- Fuzz / Mutation / Smoke" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "These jobs are observational in this rollout phase. They run the tools in strict mode, but they are not intended to be required merge checks yet." >> $GITHUB_STEP_SUMMARY
