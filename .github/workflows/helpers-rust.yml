name: Rust Helpers

on:
  push:
    paths:
      - 'helpers/flavor-rs/**'
      - 'helpers/Makefile'
      - '.github/workflows/helpers-rust.yml'
  pull_request:
    paths:
      - 'helpers/flavor-rs/**'
      - 'helpers/Makefile'
      - '.github/workflows/helpers-rust.yml'
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact-name:
        description: "Name of the uploaded artifact"
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  # Fast checks that run in parallel with builds
  lint:
    name: Rust Lint & Format
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: 🎨 Check formatting
        working-directory: helpers/flavor-rs
        run: |
          cargo fmt -- --check
          echo "✅ Code is properly formatted"
      
      - name: 🔍 Clippy lint
        working-directory: helpers/flavor-rs
        run: cargo clippy -- -D warnings
        continue-on-error: true

  security:
    name: Rust Security Scan
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: 📦 Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            helpers/flavor-rs/target/
          key: ${{ runner.os }}-cargo-security-${{ hashFiles('helpers/flavor-rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-security-
      
      - name: 🔐 Install cargo-audit
        run: cargo install cargo-audit --locked
        continue-on-error: true
      
      - name: 🔐 Run cargo-audit
        working-directory: helpers/flavor-rs
        run: |
          if command -v cargo-audit >/dev/null 2>&1; then
            cargo audit
          else
            echo "⚠️ cargo-audit not available"
          fi
        continue-on-error: true

  test:
    name: Rust Tests
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: 📦 Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            helpers/flavor-rs/target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('helpers/flavor-rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      
      - name: 🧪 Run tests
        working-directory: helpers/flavor-rs
        run: cargo test --verbose
      
      - name: 📊 Install tarpaulin for coverage
        run: cargo install cargo-tarpaulin --locked
        continue-on-error: true
      
      - name: 📊 Generate coverage
        working-directory: helpers/flavor-rs
        run: |
          if command -v cargo-tarpaulin >/dev/null 2>&1; then
            cargo tarpaulin --out html --output-dir coverage
            echo "📊 Coverage report generated"
          else
            echo "⚠️ cargo-tarpaulin not available"
          fi
        continue-on-error: true
      
      - name: 📤 Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: helpers/flavor-rs/coverage/
        continue-on-error: true

  build:
    name: Build Rust Helpers
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux builds
          - os: ubuntu-24.04
            platform: linux_amd64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04
            platform: linux_arm64
            target: aarch64-unknown-linux-gnu
          # macOS builds
          - os: macos-15
            platform: darwin_amd64
            target: x86_64-apple-darwin
          - os: macos-15
            platform: darwin_arm64
            target: aarch64-apple-darwin
          # Windows builds
          - os: windows-2025
            platform: windows_amd64
            target: x86_64-pc-windows-msvc
    
    outputs:
      artifact-name: flavor-rs-helpers-${{ matrix.platform }}
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔢 Get version
        id: version
        shell: bash
        run: |
          if [ -f pyproject.toml ]; then
            VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2 || echo "0.0.0")
          else
            VERSION="0.0.0"
            echo "⚠️ Warning: pyproject.toml not found, using default version 0.0.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "🔢 Version: $VERSION"
      
      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: 📦 Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            helpers/flavor-rs/target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('helpers/flavor-rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-
            ${{ runner.os }}-cargo-
      
      - name: 🔨 Build helpers
        working-directory: helpers/flavor-rs
        run: make build
        env:
          RUST_TARGET: ${{ matrix.target }}
      
      - name: ✅ Verify binaries
        working-directory: helpers
        run: |
          echo "🔍 Checking built binaries..."
          ls -la bin/
          
          # Test version flag on each binary
          for binary in bin/flavor-rs-*; do
            if [ -f "$binary" ] && [ -x "$binary" ] && [[ ! "$binary" == *.exe ]]; then
              echo "Testing: $binary"
              $binary --version || echo "  ⚠️ No --version flag"
            fi
          done
        if: runner.os != 'Windows'
      
      - name: ✅ Verify binaries (Windows)
        working-directory: helpers
        shell: pwsh
        run: |
          Write-Host "🔍 Checking built binaries..."
          Get-ChildItem bin/
          
          # Test version flag on each binary
          Get-ChildItem bin/flavor-rs-*.exe -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "Testing: $_"
            & $_.FullName --version
          }
        if: runner.os == 'Windows'
      
      - name: 📦 Package artifacts
        working-directory: helpers
        run: |
          chmod +x scripts/package-artifacts.sh
          if [ -f ../../pyproject.toml ]; then
            VERSION=$(grep '^version = ' ../../pyproject.toml | cut -d'"' -f2 || echo "0.0.0")
          else
            VERSION="0.0.0"
            echo "⚠️ Warning: pyproject.toml not found, using default version 0.0.0"
          fi
          ./scripts/package-artifacts.sh rs "${{ matrix.platform }}" bin . "$VERSION"
        if: runner.os != 'Windows'
      
      - name: 📦 Package artifacts (Windows)
        working-directory: helpers
        shell: pwsh
        run: |
          if (Test-Path ..\..\pyproject.toml) {
            $version = (Get-Content ..\..\pyproject.toml | Select-String '^version = "(.+)"').Matches.Groups[1].Value
            if (-not $version) { 
              $version = "0.0.0"
              Write-Warning "Could not extract version from pyproject.toml, using default 0.0.0"
            }
          } else {
            $version = "0.0.0"
            Write-Warning "pyproject.toml not found, using default version 0.0.0"
          }
          .\scripts\package-artifacts.ps1 -Language rs -Platform "${{ matrix.platform }}" -BinDir bin -OutputDir . -Version $version
        if: runner.os == 'Windows'
      
      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flavor-rs-helpers-${{ steps.version.outputs.version }}_${{ matrix.platform }}
          path: helpers/flavor-rs-helpers-*_${{ matrix.platform }}
          retention-days: 7

  # Summary of all Rust helper jobs
  summary:
    name: Rust Summary
    runs-on: ubuntu-24.04
    needs: [lint, security, test, build]
    if: always()
    steps:
      - name: 📊 Summary
        run: |
          echo "## Rust Helpers Build Summary"
          echo ""
          echo "### Quality Checks:"
          echo "- Lint & Format: ${{ needs.lint.result }}"
          echo "- Security: ${{ needs.security.result }}"
          echo "- Tests: ${{ needs.test.result }}"
          echo ""
          echo "### Builds:"
          echo "- Build Jobs: ${{ needs.build.result }}"
          echo ""
          
          if [ "${{ needs.build.result }}" == "success" ] && [ "${{ needs.test.result }}" == "success" ]; then
            echo "✅ **Rust helpers ready!**"
          else
            echo "⚠️ **Some checks failed**"
          fi