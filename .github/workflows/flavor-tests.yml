name: 🧪 Flavor Core Tests

on:
  workflow_dispatch:
  workflow_call:

jobs:
  # ==================================================================================
  # 🚀 Fast Tests (no helpers required)
  # ==================================================================================
  fast-tests:
    name: 🚀 Fast Tests
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-15]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      
      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: 🔧 Setup Environment
        run: |
          chmod +x .github/scripts/setup-workenv.sh
          source .github/scripts/setup-workenv.sh
      
      - name: 🚀 Run Unit Tests
        run: |
          source workenv/flavor_*/bin/activate
          pytest tests/ -m "unit and not requires_helpers" \
            --cov=src/flavor \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=term \
            -n auto --tb=short
      
      - name: 🔐 Run Security Tests
        run: |
          source workenv/flavor_*/bin/activate
          pytest tests/ -m "security and not requires_helpers" \
            --cov=src/flavor \
            --cov-append \
            --cov-report=xml:coverage-security.xml \
            -v --tb=short
      
      - name: 🗺️ Run MMap Tests
        run: |
          source workenv/flavor_*/bin/activate
          pytest tests/ -m "mmap and not requires_helpers" \
            --cov=src/flavor \
            --cov-append \
            --cov-report=xml:coverage-mmap.xml \
            -v --tb=short
      
      - name: 📤 Upload Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-fast-${{ matrix.os }}-${{ matrix.python }}
          path: coverage-*.xml

  # ==================================================================================
  # 🔧 Helper-Dependent Tests (requires built helpers)
  # ==================================================================================
  helper-tests:
    name: 🔧 Helper Tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      
      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: 📥 Download Helpers
        uses: actions/download-artifact@v4
        with:
          name: all-helpers
          path: all-helpers-download
      
      - name: 🔧 Organize Helpers
        run: |
          chmod +x .github/scripts/organize-artifacts.sh
          .github/scripts/organize-artifacts.sh all-helpers-download
      
      - name: 🔧 Setup Environment
        run: |
          chmod +x .github/scripts/setup-workenv.sh
          source .github/scripts/setup-workenv.sh
      
      - name: 🔧 Run Integration Tests
        run: |
          chmod +x .github/scripts/run-tests-with-helpers.sh
          .github/scripts/run-tests-with-helpers.sh "integration"
          mv coverage-integration.xml coverage-integration-${{ matrix.os }}.xml
      
      - name: 🌐 Run Cross-Language Tests
        run: |
          chmod +x .github/scripts/run-tests-with-helpers.sh
          .github/scripts/run-tests-with-helpers.sh "cross_language"
          mv coverage-cross_language.xml coverage-crosslang-${{ matrix.os }}.xml
      
      - name: 📦 Run Packaging Tests with Helpers
        run: |
          chmod +x .github/scripts/run-tests-with-helpers.sh
          .github/scripts/run-tests-with-helpers.sh "packaging and requires_helpers"
          mv coverage-packaging.xml coverage-packaging-${{ matrix.os }}.xml
      
      - name: 📤 Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-helper-${{ matrix.os }}-${{ matrix.python }}
          path: coverage-*.xml

  # ==================================================================================
  # 🐌 Slow/Stress Tests (separate for timeout management)
  # ==================================================================================
  slow-tests:
    name: 🐌 Slow Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: 📥 Download Helpers
        uses: actions/download-artifact@v4
        with:
          name: all-helpers
          path: all-helpers-download
      
      - name: 🔧 Organize Helpers
        run: |
          chmod +x .github/scripts/organize-artifacts.sh
          .github/scripts/organize-artifacts.sh all-helpers-download
      
      - name: 🔧 Setup Environment
        run: |
          chmod +x .github/scripts/setup-workenv.sh
          source .github/scripts/setup-workenv.sh
      
      - name: 🐌 Run Slow Tests
        run: |
          chmod +x .github/scripts/run-tests-with-helpers.sh
          .github/scripts/run-tests-with-helpers.sh "slow"
      
      - name: 💪 Run Stress Tests
        if: github.event_name == 'workflow_dispatch'
        run: |
          chmod +x .github/scripts/run-tests-with-helpers.sh
          .github/scripts/run-tests-with-helpers.sh "stress"
      
      - name: 📤 Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-slow
          path: coverage-*.xml

  # ==================================================================================
  # 📊 Combine Coverage Reports
  # ==================================================================================
  combine-coverage:
    name: 📊 Combined Coverage
    needs: [fast-tests, helper-tests, slow-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📥 Download All Coverage Reports
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-reports
      
      - name: 📊 Combine Coverage
        run: |
          pip install coverage[toml]
          
          # Find all coverage files
          find coverage-reports -name "*.xml" -exec cp {} . \;
          
          # List what we have
          echo "📊 Coverage files found:"
          ls -la coverage-*.xml
          
          # Combine using coverage.py
          coverage combine coverage-*.xml || true
          coverage xml -o coverage-combined.xml
          coverage report
      
      - name: 📤 Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage-combined.xml
          flags: combined
          name: combined-coverage
      
      - name: 📤 Save Combined Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-combined
          path: coverage-combined.xml