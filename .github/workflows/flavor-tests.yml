name: 🧪 Flavor Core Tests

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main, develop, feature/*]
    paths:
      - 'src/flavor/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/flavor-tests.yml'
  pull_request:
    branches: [main, develop]

jobs:
  # ==================================================================================
  # 🚀 Fast Unit Tests (run first, fail fast)
  # ==================================================================================
  unit-tests:
    name: 🚀 Unit Tests
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-15]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      
      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: 🔧 Setup Environment
        run: |
          uv venv workenv/flavor_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m)
          source workenv/flavor_*/bin/activate
          uv pip install -e .[dev]
          uv pip install pytest pytest-cov pytest-xdist
      
      - name: 🚀 Run Unit Tests
        run: |
          source workenv/flavor_*/bin/activate
          pytest tests/ -m "unit and not requires_helpers" -n auto --tb=short -q
      
      - name: 📊 Coverage (Ubuntu 3.11 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: |
          source workenv/flavor_*/bin/activate
          pytest tests/ -m "unit" --cov=src/flavor --cov-report=xml --cov-report=term-missing
      
      - name: 📤 Upload Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unit
          name: unit-coverage

  # ==================================================================================
  # 🔧 Integration Tests (after unit tests pass)
  # ==================================================================================
  integration-tests:
    name: 🔧 Integration Tests
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      
      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: 🔧 Setup Environment
        run: |
          uv venv workenv/flavor_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m)
          source workenv/flavor_*/bin/activate
          uv pip install -e .[dev]
          uv pip install pytest pytest-cov pytest-xdist
      
      - name: 🔧 Run Integration Tests
        run: |
          source workenv/flavor_*/bin/activate
          pytest tests/ -m "integration and not requires_helpers" -n auto -v --tb=short

  # ==================================================================================
  # 🔐 Security Tests (parallel with integration)
  # ==================================================================================
  security-tests:
    name: 🔐 Security Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: 🔧 Setup Environment
        run: |
          uv venv workenv/flavor_linux_x86_64
          source workenv/flavor_*/bin/activate
          uv pip install -e .[dev]
          uv pip install bandit safety
      
      - name: 🔐 Run Security Tests
        run: |
          source workenv/flavor_*/bin/activate
          pytest tests/ -m "security" -v --tb=short
      
      - name: 🔍 Bandit Security Scan
        run: |
          source workenv/flavor_*/bin/activate
          bandit -r src/flavor -f json -o bandit-report.json || true
      
      - name: 📤 Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: bandit-report.json

  # ==================================================================================
  # 📦 Packaging Tests (parallel with integration)
  # ==================================================================================
  packaging-tests:
    name: 📦 Packaging Tests
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: 🔧 Setup Environment
        run: |
          uv venv workenv/flavor_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m)
          source workenv/flavor_*/bin/activate
          uv pip install -e .[dev]
          uv pip install pytest pytest-cov pytest-xdist
      
      - name: 📦 Run Packaging Tests
        run: |
          source workenv/flavor_*/bin/activate
          pytest tests/ -m "packaging and not requires_helpers" -v --tb=short

  # ==================================================================================
  # 🗺️ Memory-Mapped Tests (parallel with integration)
  # ==================================================================================
  mmap-tests:
    name: 🗺️ MMap Tests
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: 🔧 Setup Environment
        run: |
          uv venv workenv/flavor_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m)
          source workenv/flavor_*/bin/activate
          uv pip install -e .[dev]
          uv pip install pytest pytest-cov pytest-xdist
      
      - name: 🗺️ Run MMap Tests
        run: |
          source workenv/flavor_*/bin/activate
          pytest tests/ -m "mmap" -v --tb=short

  # ==================================================================================
  # 🐌 Slow Tests (run separately)
  # ==================================================================================
  slow-tests:
    name: 🐌 Slow Tests
    needs: [integration-tests, packaging-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: 🔧 Setup Environment
        run: |
          uv venv workenv/flavor_linux_x86_64
          source workenv/flavor_*/bin/activate
          uv pip install -e .[dev]
      
      - name: 🐌 Run Slow Tests
        run: |
          source workenv/flavor_*/bin/activate
          pytest tests/ -m "slow" -v --tb=short

  # ==================================================================================
  # 💪 Stress Tests (optional, manual trigger)
  # ==================================================================================
  stress-tests:
    name: 💪 Stress Tests
    if: github.event_name == 'workflow_dispatch'
    needs: [integration-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: 🔧 Setup Environment
        run: |
          uv venv workenv/flavor_linux_x86_64
          source workenv/flavor_*/bin/activate
          uv pip install -e .[dev]
          uv pip install hypothesis
      
      - name: 💪 Run Stress Tests
        run: |
          source workenv/flavor_*/bin/activate
          pytest tests/ -m "stress" -v --tb=short

  # ==================================================================================
  # ✅ Test Summary
  # ==================================================================================
  test-summary:
    name: ✅ Test Summary
    needs: [unit-tests, integration-tests, security-tests, packaging-tests, mmap-tests, slow-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📊 Generate Summary
        run: |
          echo "# 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check each test job result
          echo "## Test Categories" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.unit-tests.result }}" = "success" ]; then
            echo "✅ **Unit Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Unit Tests**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.integration-tests.result }}" = "success" ]; then
            echo "✅ **Integration Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Integration Tests**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.security-tests.result }}" = "success" ]; then
            echo "✅ **Security Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Security Tests**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.packaging-tests.result }}" = "success" ]; then
            echo "✅ **Packaging Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Packaging Tests**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.mmap-tests.result }}" = "success" ]; then
            echo "✅ **Memory-Mapped Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Memory-Mapped Tests**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.slow-tests.result }}" = "success" ]; then
            echo "✅ **Slow Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Slow Tests**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Coverage" >> $GITHUB_STEP_SUMMARY
          echo "Coverage reports available in Codecov for unit tests" >> $GITHUB_STEP_SUMMARY