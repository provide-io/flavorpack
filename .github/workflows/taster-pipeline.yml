name: 04 🍰 Taster Pipeline

on:
  workflow_dispatch:
    inputs:
      flavor_run_id:
        description: 'Flavor Pipeline run ID (leave empty for latest)'
        type: string
        required: false
      taster_args:
        description: 'Arguments to pass to taster (e.g., --help, info, env)'
        type: string
        required: false
        default: '--help'
  
  workflow_run:
    workflows: ["03 🌶️ Flavor Pipeline"]
    types: [completed]
    branches: [main, develop]

jobs:
  # Setup and download Flavor PSP
  setup:
    name: 🔧 Setup & Get Flavor PSP
    runs-on: ubuntu-24.04
    # Only run taster when the triggering Flavor pipeline succeeded.
    # workflow_run fires on all conclusions (success, failure, cancelled);
    # this if-guard skips everything when Flavor failed or was cancelled.
    # workflow_dispatch bypasses this (github.event_name != 'workflow_run').
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      version: ${{ steps.version.outputs.version }}
      helper_version: ${{ steps.version.outputs.version }}
      test_matrix: ${{ steps.matrix.outputs.matrix }}
      flavor_run_id: ${{ steps.flavor.outputs.run_id }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔧 Ensure gh CLI available
        run: type gh >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq gh)

      - name: 🔍 Determine version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 🔍 Get Flavor run
        id: flavor
        run: python3 ci/workflow_helpers.py resolve-workflow-run --workflow flavor-pipeline.yml --input-run "${{ inputs.flavor_run_id }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 📥 Download Flavor PSP artifacts
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow: flavor-pipeline.yml
          run_id: ${{ steps.flavor.outputs.run_id }}
          name_is_regexp: true
          name: "^flavor-${{ steps.version.outputs.version }}-"
          path: ./flavor-artifacts
      
      - name: 🔧 Organize Flavor artifacts
        run: python3 ci/workflow_helpers.py organize-flavor-artifacts flavor-artifacts flavor-psp
      
      - name: 📥 Download helper artifacts
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow: helper-prep.yml
          name: flavor-helpers-${{ steps.version.outputs.version }}-all
          path: ./helpers-dist

      - name: 📤 Upload Flavor PSP for test jobs
        uses: actions/upload-artifact@v7
        with:
          name: flavor-psp-${{ github.run_id }}
          path: |
            flavor-psp/*.psp
            flavor-psp/*.exe

      - name: 🧪 Define test matrix
        id: matrix
        run: python3 ci/workflow_helpers.py taster-test-matrix

  # Build and test taster on different platforms
  test-taster:
    name: 🧪 Test Taster ${{ matrix.name }}
    needs: setup
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.continue_on_error == true }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.test_matrix) }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 📥 Download Flavor PSP
        uses: actions/download-artifact@v8
        with:
          name: flavor-psp-${{ github.run_id }}
          path: ./flavor-psp
      
      - name: 📥 Download helpers
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow: helper-prep.yml
          name: flavor-helpers-${{ needs.setup.outputs.version }}-all
          path: ./helpers-dist
      
      - name: 🔧 Extract helpers
        shell: bash
        run: |
          ci/download-helpers.sh helpers-dist "${{ needs.setup.outputs.version }}" "${{ matrix.platform }}"

      - name: 🔍 Resolve build inputs
        id: resolve
        shell: bash
        run: python3 ci/workflow_helpers.py resolve-taster-build --flavor-dir flavor-psp --helpers-dir helpers/bin --platform "${{ matrix.platform }}" --version "${{ needs.setup.outputs.version }}"

      - name: 🔨 Build Taster using Flavor PSP
        id: build
        shell: bash
        run: ci/build-taster-with-psp.sh "${{ steps.resolve.outputs.flavor_psp }}" "${{ steps.resolve.outputs.launcher }}" "${{ matrix.platform }}" "${{ needs.setup.outputs.version }}"

      - name: 🔍 Verify Built Package
        shell: bash
        run: python3 ci/workflow_helpers.py verify-executable "${{ steps.resolve.outputs.taster_path }}"

      - name: 🧪 Test Taster Commands
        shell: bash
        timeout-minutes: 5
        run: |
          TASTER="${{ steps.resolve.outputs.taster_path }}"
          WITH_TIMEOUT="${{ runner.os == 'Linux' && 'true' || 'false' }}"
          ci/test-taster-basic.sh "$TASTER" "$WITH_TIMEOUT"
          [ -z "${{ inputs.taster_args }}" ] || "$TASTER" ${{ inputs.taster_args }}

      # Crosslang testing removed - the command interface varies and causes issues
      # The main tests above are sufficient to verify taster is working

      - name: 📊 Collect test results
        if: always()
        shell: bash
        run: python3 ci/workflow_helpers.py write-taster-result "test-results/taster-${{ matrix.platform }}.json" --platform "${{ matrix.platform }}" --runner "${{ matrix.runner }}" --status "${{ job.status }}" --taster-path "${{ steps.resolve.outputs.taster_path }}" --helper-version "${{ needs.setup.outputs.helper_version }}"

      - name: 📤 Upload taster package
        uses: actions/upload-artifact@v7
        with:
          name: taster-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: |
            tests/taster/taster-${{ needs.setup.outputs.version }}-${{ matrix.platform }}.psp
            tests/taster/taster-${{ needs.setup.outputs.version }}-${{ matrix.platform }}.exe

      - name: 📤 Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: taster-results-${{ matrix.platform }}-${{ github.run_id }}
          path: test-results/

  # Comprehensive taster testing
  comprehensive-test:
    name: 🔬 Comprehensive Taster Tests (${{ matrix.platform }}-${{ matrix.launcher_name }})
    needs: [setup, test-taster]
    strategy:
      matrix:
        include:
          # Linux: both launchers are reliable
          - runner: ubuntu-24.04
            platform: linux_amd64
            activate: workenv/bin/activate
            launcher_ext: ""
            bundled_launcher: flavor-rs-launcher
            launcher_name: rust
            allow_failure: false
          - runner: ubuntu-24.04
            platform: linux_amd64
            activate: workenv/bin/activate
            launcher_ext: ""
            bundled_launcher: flavor-go-launcher
            launcher_name: go
            allow_failure: false
          # Windows AMD64: Go is reliable; Rust may work now that encoding is fixed
          - runner: windows-2025
            platform: windows_amd64
            activate: workenv/Scripts/activate
            launcher_ext: ".exe"
            bundled_launcher: flavor-go-launcher
            launcher_name: go
            allow_failure: false
          - runner: windows-2025
            platform: windows_amd64
            activate: workenv/Scripts/activate
            launcher_ext: ".exe"
            bundled_launcher: flavor-rs-launcher
            launcher_name: rust
            allow_failure: false
          # Windows ARM64
          - runner: windows-11-arm
            platform: windows_arm64
            activate: workenv/Scripts/activate
            launcher_ext: ".exe"
            bundled_launcher: flavor-go-launcher
            launcher_name: go
            allow_failure: false
          - runner: windows-11-arm
            platform: windows_arm64
            activate: workenv/Scripts/activate
            launcher_ext: ".exe"
            bundled_launcher: flavor-rs-launcher
            launcher_name: rust
            allow_failure: false
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.allow_failure }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 📥 Download all test results
        uses: actions/download-artifact@v8
        with:
          pattern: taster-results-*
          path: all-results

      - name: 📥 Download helpers
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow: helper-prep.yml
          name: flavor-helpers-${{ needs.setup.outputs.version }}-all
          path: ./helpers-dist

      - name: 🔧 Extract all helpers
        run: |
          ci/download-helpers.sh helpers-dist "${{ needs.setup.outputs.helper_version }}"

      - name: 🔧 Copy helpers into flavor wheel source
        run: python3 ci/workflow_helpers.py install-platform-helpers --source-dir helpers/bin --dest-dir src/flavor/helpers/bin --platform "${{ matrix.platform }}"

      - name: 📦 Setup uv + Python
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: '3.11'

      - name: 📦 Setup environment
        run: ci/setup-python-workenv.sh

      - name: 🧪 Test 1 - Flavor pack with explicit launcher
        run: |
          source ${{ matrix.activate }}
          cd tests/taster
          LAUNCHER="../../helpers/bin/${{ matrix.bundled_launcher }}-${{ matrix.platform }}${{ matrix.launcher_ext }}"
          python3 ../../ci/workflow_helpers.py taster-scenario explicit-launcher --launcher "$LAUNCHER" --output taster-bundled.psp --include-info

      - name: 🧪 Test 2a - Taster help
        run: |
          source ${{ matrix.activate }}
          cd tests/taster

          echo "=== Testing Taster help command ==="
          ./taster-bundled.psp --help
          echo "✅ Help test passed"

      - name: 🧪 Test 2b - Taster info
        run: |
          source ${{ matrix.activate }}
          cd tests/taster

          echo "=== Testing Taster info command ==="
          ./taster-bundled.psp info
          echo "✅ Info test passed"

      - name: 🧪 Test 2c - Taster env
        run: |
          source ${{ matrix.activate }}
          cd tests/taster

          echo "=== Testing Taster env command ==="
          ./taster-bundled.psp env
          echo "✅ Env test passed"

      - name: 🧪 Test 2d - Taster cache info
        run: |
          source ${{ matrix.activate }}
          cd tests/taster

          echo "=== Testing Taster cache info command ==="
          ./taster-bundled.psp cache info
          echo "✅ Cache info test passed"

      - name: 🧪 Test 2e - Taster exit
        run: |
          source ${{ matrix.activate }}
          cd tests/taster

          echo "=== Testing Taster exit command ==="
          ./taster-bundled.psp exit 0 --message "Test success"
          echo "✅ Exit test passed"

      - name: 🧪 Test 3a - Check launcher location
        run: |
          source ${{ matrix.activate }}
          cd tests/taster
          python3 ../../ci/workflow_helpers.py taster-scenario launcher-location

      - name: 🧪 Test 3b - Build with Rust launcher
        if: ${{ !(startsWith(matrix.platform, 'windows_') && matrix.bundled_launcher == 'flavor-go-launcher') }}
        run: |
          source ${{ matrix.activate }}
          cd tests/taster
          python3 ../../ci/workflow_helpers.py taster-scenario rust-explicit --platform "${{ matrix.platform }}" --launcher-ext "${{ matrix.launcher_ext }}" --output taster-rust-explicit.psp

      - name: 🧪 Test 3c - Build with Go launcher
        run: |
          source ${{ matrix.activate }}
          cd tests/taster
          python3 ../../ci/workflow_helpers.py taster-scenario go-explicit --platform "${{ matrix.platform }}" --launcher-ext "${{ matrix.launcher_ext }}" --output taster-go-explicit.psp

      - name: 🧪 Test 4 - Pipe operations
        run: |
          source ${{ matrix.activate }}
          cd tests/taster
          python3 ../../ci/workflow_helpers.py taster-scenario pipe

      - name: 🧪 Test 5 - Signal handling
        run: |
          source ${{ matrix.activate }}
          cd tests/taster
          python3 ../../ci/workflow_helpers.py taster-scenario signal

      - name: 🧪 Test 6 - Memory-mapped I/O
        run: |
          source ${{ matrix.activate }}
          cd tests/taster
          python3 ../../ci/workflow_helpers.py taster-scenario mmap

      - name: 🧪 Test 7 - Taster self-packaging
        run: |
          source ${{ matrix.activate }}
          cd tests/taster
          LAUNCHER="../../helpers/bin/${{ matrix.bundled_launcher }}-${{ matrix.platform }}${{ matrix.launcher_ext }}"
          ../../ci/test-taster-self-package.sh ./taster-bundled.psp "$LAUNCHER"

      - name: 🧪 Test 8 - Bootstrap and cache regression coverage
        run: |
          source ${{ matrix.activate }}
          cd tests/taster
          python3 ../../ci/workflow_helpers.py taster-scenario exec-test --platform "${{ matrix.platform }}"

  # Summary and validation
  validate:
    name: ✅ Validate & Summary
    needs: [setup, test-taster, comprehensive-test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 📥 Download all test results
        uses: actions/download-artifact@v8
        with:
          pattern: taster-results-*
          path: test-results

      - name: 📊 Generate summary
        run: python3 ci/workflow_helpers.py taster-summary --results-dir test-results --helper-version "${{ needs.setup.outputs.helper_version }}" --repository "${{ github.repository }}" --run-id "${{ github.run_id }}"

      - name: 🎯 Check status
        run: '[ "${{ needs.test-taster.result }}" = "success" ] && [ "${{ needs.comprehensive-test.result }}" = "success" ]'
