name: 08 ⚖️ License Compliance

on:
  workflow_dispatch:
    inputs:
      strict_mode:
        description: 'Enable strict license checking'
        type: boolean
        default: false
      allowed_licenses:
        description: 'Comma-separated list of allowed licenses (e.g., MIT,Apache-2.0,BSD-3-Clause)'
        type: string
        default: 'MIT,Apache-2.0,BSD-3-Clause,BSD-2-Clause,ISC,Python-2.0,PSF,ZPL'
      generate_sbom:
        description: 'Generate Software Bill of Materials (SBOM)'
        type: boolean
        default: true
  
  pull_request:
    paths:
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'Pipfile*'
      - 'go.mod'
      - 'go.sum'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'LICENSE*'
      - 'NOTICE*'
  
  schedule:
    # Run monthly on the 1st at 5 AM UTC
    - cron: '0 5 1 * *'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Project License Analysis
  project-license:
    name: 📜 Project License
    runs-on: ubuntu-24.04
    outputs:
      project_license: ${{ steps.detect.outputs.license }}
      has_license: ${{ steps.detect.outputs.has_license }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      
      - name: 🔍 Detect Project License
        id: detect
        run: |
          python3 ci/license_workflow_helpers.py project-license-scan

  # Python License Compliance
  python-license:
    name: 🐍 Python Licenses
    runs-on: ubuntu-24.04
    outputs:
      compliant: ${{ steps.check.outputs.compliant }}
      violations: ${{ steps.check.outputs.violations }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      
      - name: 📦 Setup uv + Python
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: '3.11'

      - name: 📦 Install License Tools
        run: |
          uv sync
          uv pip install pip-licenses licensecheck license-expression pip-audit pipdeptree
      
      - name: 📋 Generate License Report
        run: |
          python3 ci/license_workflow_helpers.py python-license-report
      
      - name: 🔍 Check License Compliance
        id: check
        run: |
          python3 ci/license_workflow_helpers.py python-license-check \
            --allowed-licenses "${{ inputs.allowed_licenses }}" \
            ${{ inputs.strict_mode && '--strict-mode' || '' }}
      
      - name: 📊 License Statistics
        run: |
          python3 ci/license_workflow_helpers.py python-license-stats
      
      - name: 📤 Upload Python License Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-license-reports
          path: |
            python-licenses.*
            python-license-summary.txt
            license-analysis.txt

  # Go License Compliance
  go-license:
    name: 🐹 Go Licenses
    runs-on: ubuntu-24.04
    outputs:
      compliant: ${{ steps.check.outputs.compliant }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      
      - name: 🐹 Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "${{ vars.GO_VERSION }}"
      
      - name: 📦 Install go-licenses
        run: |
          go install github.com/google/go-licenses@latest
      
      - name: 📋 Generate License Report
        run: |
          python3 ci/license_workflow_helpers.py go-license-report
      
      - name: 🔍 Check Compliance
        id: check
        run: |
          python3 ci/license_workflow_helpers.py go-license-check \
            ${{ inputs.strict_mode && '--strict-mode' || '' }}
      
      - name: 📤 Upload Go License Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-license-reports
          path: |
            src/flavor-go/go-licenses.*

  # Rust License Compliance
  rust-license:
    name: 🦀 Rust Licenses
    runs-on: ubuntu-24.04
    outputs:
      compliant: ${{ steps.check.outputs.compliant }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      
      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: 📦 Install cargo-license
        run: |
          cargo install cargo-license
          cargo install cargo-deny
      
      - name: 📋 Generate License Report
        run: |
          python3 ci/license_workflow_helpers.py rust-license-report
      
      - name: 🔍 Check Compliance with cargo-deny
        id: check
        run: |
          python3 ci/license_workflow_helpers.py rust-license-check \
            ${{ inputs.strict_mode && '--strict-mode' || '' }}
      
      - name: 📤 Upload Rust License Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-license-reports
          path: |
            src/flavor-rs/rust-licenses.*
            src/flavor-rs/cargo-deny-licenses.log
            src/flavor-rs/deny.toml

  # SBOM Generation
  sbom-generation:
    name: 📜 SBOM Generation
    runs-on: ubuntu-24.04
    if: inputs.generate_sbom == true
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      
      - name: 🛠️ Install SBOM Tools
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          uv tool install cyclonedx-bom || pip install cyclonedx-bom || true
          if command -v npm &>/dev/null; then npm install -g @cyclonedx/cli || true; fi
      
      - name: 📋 Generate SBOM
        run: |
          python3 ci/license_workflow_helpers.py sbom-generate
      
      - name: 🔍 Validate SBOM
        continue-on-error: true
        run: |
          python3 ci/license_workflow_helpers.py sbom-validate
      
      - name: 📤 Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-reports
          path: |
            sbom-*.json
            sbom-*.txt
            cyclonedx-validation.log

  # Compliance Report
  compliance-report:
    name: 📊 Compliance Report
    needs: [project-license, python-license, go-license, rust-license, sbom-generation]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Download all reports
        uses: actions/download-artifact@v8
        with:
          path: license-reports
      
      - name: 📊 Generate Final Compliance Report
        env:
          LICENSE_REPOSITORY: ${{ github.repository }}
          LICENSE_RUN_ID: ${{ github.run_id }}
          LICENSE_PROJECT_LICENSE: ${{ needs.project-license.outputs.project_license }}
          LICENSE_HAS_LICENSE: ${{ needs.project-license.outputs.has_license }}
          LICENSE_PYTHON_COMPLIANT: ${{ needs.python-license.outputs.compliant }}
          LICENSE_PYTHON_VIOLATIONS: ${{ needs.python-license.outputs.violations }}
          LICENSE_GO_COMPLIANT: ${{ needs.go-license.outputs.compliant }}
          LICENSE_RUST_COMPLIANT: ${{ needs.rust-license.outputs.compliant }}
          LICENSE_SBOM_GENERATED: ${{ needs.sbom-generation.result == 'success' && 'true' || 'false' }}
          LICENSE_TIMESTAMP: ${{ github.run_id }}
        run: |
          export LICENSE_TIMESTAMP="$(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          export LICENSE_ISO_TIMESTAMP="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          python3 ci/license_workflow_helpers.py compliance-report ${{ inputs.strict_mode && '--strict-mode' || '' }}
      
      - name: 📤 Upload Compliance Summary
        uses: actions/upload-artifact@v7
        with:
          name: compliance-summary
          path: compliance-summary.json
      
