name: 09 🌍 Cross-Platform Validation

on:
  workflow_dispatch:
    inputs:
      flavor_run_id:
        description: 'Flavor Pipeline run ID (leave empty for latest)'
        type: string
        required: false

  schedule:
    # Run weekly on Sundays at 3 AM UTC
    - cron: '0 3 * * 0'

  workflow_run:
    workflows: ["03 🌶️ Flavor Pipeline"]
    types: [completed]
    branches: [main, develop]

permissions:
  contents: read
  actions: read

jobs:
  # Setup and download Flavor PSP packages from the Flavor Pipeline
  setup:
    name: 🔧 Setup & Get Flavor PSP
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      flavor_run_id: ${{ steps.flavor.outputs.run_id }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔍 Determine version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 🔍 Get Flavor run
        id: flavor
        run: |
          # Get Flavor run ID - prefer input, then triggering workflow, then latest success
          if [ -n "${{ inputs.flavor_run_id }}" ]; then
            RUN_ID="${{ inputs.flavor_run_id }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
          else
            RUN_ID=$(gh run list --workflow 03-flavor-pipeline.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')
          fi
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Using Flavor Pipeline run: $RUN_ID"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 📥 Download all Flavor PSP artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: 03-flavor-pipeline.yml
          run_id: ${{ steps.flavor.outputs.run_id }}
          name_is_regexp: true
          name: "^flavor-${{ steps.version.outputs.version }}-"
          path: ./flavor-artifacts

      - name: 🔧 Organize Flavor packages
        run: |
          mkdir -p flavor-psp
          # Move all PSP and EXE files from subdirectories to flavor-psp
          find flavor-artifacts -type f \( -name "*.psp" -o -name "*.exe" \) -exec mv {} flavor-psp/ \;
          echo "Available Flavor PSP packages:"
          ls -la flavor-psp/

      - name: 📤 Upload Flavor PSP for test jobs
        uses: actions/upload-artifact@v4
        with:
          name: flavor-psp-${{ github.run_id }}
          path: flavor-psp/

  # Test cross-platform verification, inspection, and extraction
  test-cross-platform:
    name: 🧪 Test ${{ matrix.build_platform }} on ${{ matrix.test_platform_name }}
    needs: setup
    runs-on: ${{ matrix.test_runner }}
    strategy:
      fail-fast: false
      matrix:
        # Test matrix: build platform × test platform
        # Focus on cross-platform scenarios (different OS or arch)
        include:
          # Linux AMD64 packages tested on other platforms
          - build_platform: linux_amd64
            test_platform: linux_arm64
            test_platform_name: Linux ARM64
            test_runner: ubuntu-24.04-arm
          - build_platform: linux_amd64
            test_platform: darwin_amd64
            test_platform_name: macOS Intel
            test_runner: macos-15-intel
          - build_platform: linux_amd64
            test_platform: darwin_arm64
            test_platform_name: macOS ARM64
            test_runner: macos-15

          # Linux ARM64 packages tested on other platforms
          - build_platform: linux_arm64
            test_platform: linux_amd64
            test_platform_name: Linux AMD64
            test_runner: ubuntu-24.04
          - build_platform: linux_arm64
            test_platform: darwin_arm64
            test_platform_name: macOS ARM64
            test_runner: macos-15

          # macOS AMD64 packages tested on other platforms
          - build_platform: darwin_amd64
            test_platform: linux_amd64
            test_platform_name: Linux AMD64
            test_runner: ubuntu-24.04
          - build_platform: darwin_amd64
            test_platform: darwin_arm64
            test_platform_name: macOS ARM64
            test_runner: macos-15

          # macOS ARM64 packages tested on other platforms
          - build_platform: darwin_arm64
            test_platform: linux_amd64
            test_platform_name: Linux AMD64
            test_runner: ubuntu-24.04
          - build_platform: darwin_arm64
            test_platform: linux_arm64
            test_platform_name: Linux ARM64
            test_runner: ubuntu-24.04-arm

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Flavor
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 📥 Download Flavor PSP packages
        uses: actions/download-artifact@v4
        with:
          name: flavor-psp-${{ github.run_id }}
          path: ./test-packages

      - name: 🔍 Find package
        id: find
        shell: bash
        run: |
          # Find the PSP file for the build platform
          PSP_FILE=$(find test-packages -name "flavor-*-${{ matrix.build_platform }}.psp" | head -1)

          if [ -z "$PSP_FILE" ]; then
            echo "❌ No PSP package found for ${{ matrix.build_platform }}"
            ls -la test-packages/
            exit 1
          fi

          echo "psp_file=$PSP_FILE" >> $GITHUB_OUTPUT
          echo "Found: $PSP_FILE"

      - name: 🔍 Verify PSP package
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          echo "## 🔍 Verifying ${{ matrix.build_platform }} package on ${{ matrix.test_platform_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          PSP_FILE="${{ steps.find.outputs.psp_file }}"

          if ! flavor verify "$PSP_FILE"; then
            echo "❌ Verification failed!" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "✅ Verification passed" >> $GITHUB_STEP_SUMMARY

      - name: 📋 Inspect PSP package
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          echo "### 📋 Inspection" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          PSP_FILE="${{ steps.find.outputs.psp_file }}"

          # Inspect in JSON format
          flavor inspect "$PSP_FILE" --json > inspect-output.json

          # Extract key information
          PACKAGE_SIZE=$(stat -f%z "$PSP_FILE" 2>/dev/null || stat -c%s "$PSP_FILE")
          SLOT_COUNT=$(jq -r '.slots | length' inspect-output.json)

          echo "- Package size: $PACKAGE_SIZE bytes" >> $GITHUB_STEP_SUMMARY
          echo "- Slot count: $SLOT_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$SLOT_COUNT" -gt 0 ]; then
            echo "✅ Package has $SLOT_COUNT slots" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Package has no slots!" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: 📂 Extract all slots
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          echo "### 📂 Extraction" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          PSP_FILE="${{ steps.find.outputs.psp_file }}"

          # Extract all slots
          mkdir -p extracted
          if ! flavor extract-all "$PSP_FILE" extracted/; then
            echo "❌ Extraction failed!" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # List extracted content
          echo "Extracted files:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -lhR extracted/ | head -50 >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

          # Validate extracted metadata
          if [ -f "extracted/metadata.json" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ Metadata extracted successfully" >> $GITHUB_STEP_SUMMARY

            # Check for expected fields
            jq -r '.name, .version' extracted/metadata.json > /dev/null || {
              echo "❌ Metadata missing expected fields" >> $GITHUB_STEP_SUMMARY
              exit 1
            }
          fi

      - name: 🔐 Verify slot integrity
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          echo "### 🔐 Integrity Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          PSP_FILE="${{ steps.find.outputs.psp_file }}"

          # Re-verify after extraction (tests checksum validation)
          if ! flavor verify "$PSP_FILE"; then
            echo "❌ Post-extraction verification failed!" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "✅ All slot checksums valid" >> $GITHUB_STEP_SUMMARY

      - name: 📊 Generate test report
        if: always()
        shell: bash
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test Configuration:**" >> $GITHUB_STEP_SUMMARY
          echo "- Built on: ${{ matrix.build_platform }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tested on: ${{ matrix.test_platform }} (${{ matrix.test_platform_name }})" >> $GITHUB_STEP_SUMMARY
          echo "- Runner: ${{ matrix.test_runner }}" >> $GITHUB_STEP_SUMMARY

  # Summary report
  validation-report:
    name: 📊 Validation Report
    needs: [setup, test-cross-platform]
    if: always()
    runs-on: ubuntu-24.04

    steps:
      - name: 📊 Generate summary
        run: |
          echo "# 🌍 Cross-Platform Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run ID:** ${GITHUB_RUN_ID}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          SETUP_RESULT="${{ needs.setup.result }}"
          TEST_RESULT="${{ needs.test-cross-platform.result }}"

          echo "## Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔧 Setup | $SETUP_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Cross-Platform Tests | $TEST_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$SETUP_RESULT" = "success" ] && [ "$TEST_RESULT" = "success" ]; then
            echo "✅ **All cross-platform validation tests passed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Cross-platform validation failed. Check job details.**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
