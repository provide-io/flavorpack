name: Reusable Security Scan

on:
  workflow_call:
    inputs:
      scanner-name:
        description: 'The name of the scanner'
        required: true
        type: string
      run-command:
        description: 'The command to run the scanner'
        required: true
        type: string
      upload-name:
        description: 'The name of the artifact to upload'
        required: true
        type: string
      upload-path:
        description: 'The path of the artifact to upload'
        required: true
        type: string

jobs:
  scan:
    name: ${{ inputs.scanner-name }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 🛡️ Run ${{ inputs.scanner-name }}
        continue-on-error: true
        run: ${{ inputs.run-command }}

      - name: 📤 Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.upload-name }}
          path: ${{ inputs.upload-path }}
