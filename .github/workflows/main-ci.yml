name: 🎯 Main CI

on:
  workflow_dispatch:
    inputs:
      run_python_tests:
        description: 'Run Python tests'
        type: boolean
        default: true
      run_taster_tests:
        description: 'Run Taster tests'
        type: boolean
        default: true
      platforms:
        description: 'Platforms to test (comma-separated)'
        type: string
        default: 'linux,macos'
      python_versions:
        description: 'Python versions to test'
        type: string
        default: '3.13'
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # Check what changed
  changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      taster: ${{ steps.filter.outputs.taster }}
      helpers: ${{ steps.filter.outputs.helpers }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔍 Path filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
            taster:
              - 'helpers/taster/**'
            helpers:
              - 'helpers/flavor-go/**'
              - 'helpers/flavor-rs/**'

  # Check for helper artifacts
  check-helpers:
    name: 📦 Check Helper Artifacts
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
      artifact-name: ${{ steps.check.outputs.artifact-name }}
      needs-build: ${{ steps.check.outputs.needs-build }}
    steps:
      - name: 🔍 Check for helper artifacts
        id: check
        run: |
          # Try to find helpers for this commit
          ARTIFACT_NAME="helpers-${{ github.sha }}"
          
          # Check if artifact exists
          if gh api \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/artifacts \
            --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\")" | grep -q "$ARTIFACT_NAME"; then
            echo "✅ Helper artifacts found: $ARTIFACT_NAME"
            echo "available=true" >> $GITHUB_OUTPUT
            echo "artifact-name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
            echo "needs-build=false" >> $GITHUB_OUTPUT
          else
            # Also check for all-helpers artifact (compatibility)
            ALT_NAME="all-helpers-${{ github.sha }}"
            if gh api \
              -H "Accept: application/vnd.github+json" \
              /repos/${{ github.repository }}/actions/artifacts \
              --jq ".artifacts[] | select(.name == \"$ALT_NAME\")" | grep -q "$ALT_NAME"; then
              echo "✅ Helper artifacts found: $ALT_NAME"
              echo "available=true" >> $GITHUB_OUTPUT
              echo "artifact-name=$ALT_NAME" >> $GITHUB_OUTPUT
              echo "needs-build=false" >> $GITHUB_OUTPUT
            else
              echo "⚠️ No helper artifacts found for ${{ github.sha }}"
              echo "available=false" >> $GITHUB_OUTPUT
              echo "artifact-name=" >> $GITHUB_OUTPUT
              echo "needs-build=true" >> $GITHUB_OUTPUT
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      
      - name: 📊 Helper status
        run: |
          echo "### 📦 Helper Artifacts" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check.outputs.available }}" == "true" ]; then
            echo "✅ **Available**: \`${{ steps.check.outputs.artifact-name }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Not Available** - Tests requiring helpers will be skipped" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "To build helpers, run the **🔨 Helper Pipeline** workflow" >> $GITHUB_STEP_SUMMARY
          fi

  # Run Python tests
  python-tests:
    name: 🐍 Python Tests
    needs: [changes, check-helpers]
    if: |
      (inputs.run_python_tests && github.event_name == 'workflow_dispatch') ||
      (needs.changes.outputs.python == 'true' && github.event_name != 'workflow_dispatch')
    uses: ./.github/workflows/python-tests.yml
    with:
      platforms: ${{ inputs.platforms }}
      python_versions: ${{ inputs.python_versions }}
      helper_artifact: ${{ needs.check-helpers.outputs.artifact-name }}
    secrets: inherit

  # Run Taster tests (only if helpers available)
  taster-tests:
    name: 🍯 Taster Tests
    needs: [changes, check-helpers]
    if: |
      needs.check-helpers.outputs.available == 'true' &&
      ((inputs.run_taster_tests && github.event_name == 'workflow_dispatch') ||
       (needs.changes.outputs.taster == 'true' && github.event_name != 'workflow_dispatch'))
    uses: ./.github/workflows/taster-pipeline.yml
    with:
      test_platforms: ${{ inputs.platforms }}
      helper_artifact: ${{ needs.check-helpers.outputs.artifact-name }}
    secrets: inherit

  # Notify if helpers needed
  notify-helpers:
    name: 📢 Helper Build Notification
    needs: [changes, check-helpers]
    if: |
      needs.check-helpers.outputs.needs-build == 'true' &&
      needs.changes.outputs.helpers == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 📢 Notify about helper changes
        run: |
          echo "### ⚠️ Helper Build Required" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Helper source code has changed but no artifacts exist for commit ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Action Required**: Run the **🔨 Helper Pipeline** workflow to build helpers" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "You can trigger it:" >> $GITHUB_STEP_SUMMARY
          echo "1. From the Actions tab → 🔨 Helper Pipeline → Run workflow" >> $GITHUB_STEP_SUMMARY
          echo "2. Using GitHub CLI: \`gh workflow run build-helpers.yml\`" >> $GITHUB_STEP_SUMMARY
          
          # In PR context, add a comment
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "::warning::Helper source changed but artifacts not built. Run the Helper Pipeline workflow."
          fi

  # Final summary
  summary:
    name: 📊 CI Summary
    needs: [changes, check-helpers, python-tests, taster-tests, notify-helpers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📊 Generate summary
        run: |
          echo "# 🎯 Main CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Helper status
          echo "## 📦 Helpers" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.check-helpers.outputs.available }}" == "true" ]; then
            echo "✅ Helper artifacts available" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No helper artifacts - some tests skipped" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Python tests
          echo "## 🐍 Python Tests" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.python-tests.result }}" == "success" ]; then
            echo "✅ All tests passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.python-tests.result }}" == "skipped" ]; then
            echo "⏭️ Skipped (no changes)" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.python-tests.result }}" == "failure" ]; then
            echo "❌ Tests failed" >> $GITHUB_STEP_SUMMARY
          else
            echo "➖ Not run" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Taster tests
          echo "## 🍯 Taster Tests" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.taster-tests.result }}" == "success" ]; then
            echo "✅ All tests passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.taster-tests.result }}" == "skipped" ]; then
            if [ "${{ needs.check-helpers.outputs.available }}" != "true" ]; then
              echo "⏭️ Skipped (helpers not available)" >> $GITHUB_STEP_SUMMARY
            else
              echo "⏭️ Skipped (no changes)" >> $GITHUB_STEP_SUMMARY
            fi
          elif [ "${{ needs.taster-tests.result }}" == "failure" ]; then
            echo "❌ Tests failed" >> $GITHUB_STEP_SUMMARY
          else
            echo "➖ Not run" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Overall status
          echo "## Overall Status" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.python-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.taster-tests.result }}" == "failure" ]]; then
            echo "### ❌ CI Failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          elif [ "${{ needs.notify-helpers.result }}" == "success" ]; then
            echo "### ⚠️ CI Passed (but helpers need building)" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ CI Passed" >> $GITHUB_STEP_SUMMARY
          fi