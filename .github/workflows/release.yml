name: 09 🚀 Release Pipeline

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.3.1)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry run (no actual release)'
        required: false
        default: false
        type: boolean
      publish_testpypi:
        description: '☑️ Publish to TestPyPI'
        required: false
        default: false
        type: boolean
      publish_pypi:
        description: '☑️ Publish to PyPI'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write
  actions: read

jobs:
  # ==================================================================================
  # 🔍 Validate and Prepare
  # ==================================================================================
  prepare:
    name: 🔍 Prepare Release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_tag: ${{ steps.version.outputs.version_tag }}
      helper_run_id: ${{ steps.find_runs.outputs.helper_run_id }}
      flavor_run_id: ${{ steps.find_runs.outputs.flavor_run_id }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      
      - name: 📝 Validate Version
        id: version
        run: ci/validate-release-version.sh "${{ github.event.inputs.version }}"
      
      - name: 🔍 Find Latest Successful Runs
        id: find_runs
        run: ci/get-release-runs.sh
        env:
          GH_TOKEN: ${{ github.token }}

  # ==================================================================================
  # 🎡 Collect Platform Wheels
  # ==================================================================================
  collect-wheels:
    name: 🎡 Collect Platform Wheels
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout for scripts
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            ci/
          sparse-checkout-cone-mode: false

      - name: 📥 Download wheel artifacts from Flavor Pipeline
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow: flavor-pipeline.yml
          run_id: ${{ needs.prepare.outputs.flavor_run_id }}
          name_is_regexp: true
          name: ^flavor-wheel-
          path: ./wheels
          workflow_conclusion: ""  # Allow any conclusion since wheels may succeed even if PSP fails
      
      - name: 🔧 Organize and rename wheels
        run: |
          ci/organize-release-wheels.sh \
            wheels \
            release-wheels \
            "${{ needs.prepare.outputs.version }}"
      
      - name: 📤 Upload collected wheels
        uses: actions/upload-artifact@v7
        with:
          name: release-wheels
          path: release-wheels/*.whl
          retention-days: 30

  # ==================================================================================
  # 📦 Collect PSP Packages
  # ==================================================================================
  collect-packages:
    name: 📦 Collect PSP Packages
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout for scripts
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            ci/
          sparse-checkout-cone-mode: false

      - name: 📥 Download Flavor PSP artifacts
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow: flavor-pipeline.yml
          run_id: ${{ needs.prepare.outputs.flavor_run_id }}
          name_is_regexp: true
          name: ^flavor-${{ needs.prepare.outputs.version }}-
          path: ./flavor-psp
          workflow_conclusion: ""  # Allow any conclusion since we may have partial success
        continue-on-error: true
      
      - name: 📥 Download Taster artifacts
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow: taster-pipeline.yml
          name_is_regexp: true
          name: ^taster-
          path: ./taster-psp
        continue-on-error: true
      
      - name: 🔧 Organize PSP packages
        run: |
          ci/organize-release-packages.sh \
            release-psp \
            "${{ needs.prepare.outputs.version }}" \
            flavor-psp \
            taster-psp
      
      - name: 📤 Upload collected packages
        uses: actions/upload-artifact@v7
        with:
          name: release-psp
          path: release-psp/*.psp
          retention-days: 30

  # ==================================================================================
  # 📊 Generate Release Assets
  # ==================================================================================
  generate-assets:
    name: 📊 Generate Release Assets
    needs: [prepare, collect-wheels, collect-packages]
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 📥 Download wheels
        uses: actions/download-artifact@v8
        with:
          name: release-wheels
          path: ./release
      
      - name: 📥 Download PSP packages
        uses: actions/download-artifact@v8
        with:
          name: release-psp
          path: ./release
      
      - name: 🔧 Generate checksums
        run: python3 ci/workflow_helpers.py release-checksums release
      
      - name: 📝 Generate Release Notes
        run: python3 ci/workflow_helpers.py release-notes release "${{ needs.prepare.outputs.version }}" "${{ github.repository }}"
      
      - name: 📤 Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release/
          retention-days: 30

  # ==================================================================================
  # 🏷️ Create GitHub Release
  # ==================================================================================
  create-release:
    name: 🏷️ Create GitHub Release
    needs: [prepare, generate-assets]
    if: github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 📥 Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
      
      - name: 🗂️ Extract and organize release files
        run: python3 ci/workflow_helpers.py stage-release artifacts release
      
      - name: 🏷️ Create Git Tag
        run: python3 ci/workflow_helpers.py create-release-tag "${{ needs.prepare.outputs.version }}" "${{ needs.prepare.outputs.version_tag }}" "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: ${{ needs.prepare.outputs.version_tag }}
          name: Flavor Pack ${{ needs.prepare.outputs.version }}
          body_path: release/release-notes.md
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: |
            release/*.whl
            release/*.psp
            release/checksums.txt
          generate_release_notes: false

  # ==================================================================================
  # 🧪 Publish to TestPyPI (optional)
  # ==================================================================================
  publish-testpypi:
    name: 🧪 Publish to TestPyPI
    needs: [prepare, generate-assets]
    if: github.ref == 'refs/heads/main' && github.event.inputs.dry_run != 'true' && github.event.inputs.publish_testpypi == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/flavorpack
    permissions:
      id-token: write
    steps:
      - name: 📥 Download wheels
        uses: actions/download-artifact@v8
        with:
          name: release-wheels
          path: ./dist
      
      - name: 🔍 Verify wheels
        run: python3 ci/workflow_helpers.py verify-release-wheels dist
      
      - name: 🧪 Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true
          verbose: true

  # ==================================================================================
  # 🐍 Publish to PyPI
  # ==================================================================================
  publish-pypi:
    name: 🐍 Publish to PyPI
    needs: [prepare, create-release]
    if: github.ref == 'refs/heads/main' && github.event.inputs.dry_run != 'true' && github.event.inputs.publish_pypi == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/flavorpack
    permissions:
      id-token: write
    steps:
      - name: 📥 Download wheels
        uses: actions/download-artifact@v8
        with:
          name: release-wheels
          path: ./dist
      
      - name: 🔍 Verify wheels
        run: python3 ci/workflow_helpers.py verify-release-wheels dist
      
      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true

  # ==================================================================================
  # 📊 Release Summary
  # ==================================================================================
  summary:
    name: 📊 Release Summary
    needs: [prepare, collect-wheels, collect-packages, generate-assets, create-release, publish-pypi, publish-testpypi]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: 📊 Generate Summary
        run: >
          python3 ci/workflow_helpers.py release-summary
          --version "${{ needs.prepare.outputs.version }}" --version-tag "${{ needs.prepare.outputs.version_tag }}" --repository "${{ github.repository }}"
          --helper-run-id "${{ needs.prepare.outputs.helper_run_id }}" --flavor-run-id "${{ needs.prepare.outputs.flavor_run_id }}"
          --collect-wheels-result "${{ needs.collect-wheels.result }}" --collect-packages-result "${{ needs.collect-packages.result }}" --generate-assets-result "${{ needs.generate-assets.result }}"
          --create-release-result "${{ needs.create-release.result }}" --publish-testpypi-result "${{ needs.publish-testpypi.result }}" --publish-pypi-result "${{ needs.publish-pypi.result }}" ${{ github.event.inputs.prerelease == 'true' && '--prerelease' || '' }} ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
