name: 09 🚀 Release Pipeline

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.3.1)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry run (no actual release)'
        required: false
        default: false
        type: boolean
      publish_testpypi:
        description: '☑️ Publish to TestPyPI'
        required: false
        default: false
        type: boolean
      publish_pypi:
        description: '☑️ Publish to PyPI'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write
  actions: read

jobs:
  # ==================================================================================
  # 🔍 Validate and Prepare
  # ==================================================================================
  prepare:
    name: 🔍 Prepare Release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_tag: ${{ steps.version.outputs.version_tag }}
      helper_run_id: ${{ steps.find_runs.outputs.helper_run_id }}
      flavor_run_id: ${{ steps.find_runs.outputs.flavor_run_id }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      
      - name: 📝 Validate Version
        id: version
        run: ci/validate-release-version.sh "${{ github.event.inputs.version }}"
      
      - name: 🔍 Find Matching Successful Runs
        id: find_runs
        run: ci/get-release-runs.sh "${{ steps.version.outputs.version }}"
        env:
          GH_TOKEN: ${{ github.token }}

  # ==================================================================================
  # 🎡 Collect Platform Wheels
  # ==================================================================================
  collect-wheels:
    name: 🎡 Collect Platform Wheels
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout for scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            ci/
          sparse-checkout-cone-mode: false

      - name: 📥 Download wheel artifacts from Flavor Pipeline
        uses: dawidd6/action-download-artifact@v24
        with:
          workflow: flavor-pipeline.yml
          run_id: ${{ needs.prepare.outputs.flavor_run_id }}
          name_is_regexp: true
          name: ^flavor-wheel-
          path: ./wheels
          workflow_conclusion: ""  # Allow any conclusion since wheels may succeed even if PSP fails
      
      - name: 🔧 Organize and rename wheels
        run: |
          ci/organize-release-wheels.sh \
            wheels \
            release-wheels \
            "${{ needs.prepare.outputs.version }}"
      
      - name: 📤 Upload collected wheels
        uses: actions/upload-artifact@v7
        with:
          name: release-wheels
          path: release-wheels/*.whl
          retention-days: 30

  # ==================================================================================
  # 📦 Collect PSP Packages
  # ==================================================================================
  collect-packages:
    name: 📦 Collect PSP Packages
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout for scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            ci/
          sparse-checkout-cone-mode: false

      - name: 📥 Download Flavor PSP artifacts
        uses: dawidd6/action-download-artifact@v24
        with:
          workflow: flavor-pipeline.yml
          run_id: ${{ needs.prepare.outputs.flavor_run_id }}
          name_is_regexp: true
          name: ^flavor-${{ needs.prepare.outputs.version }}-
          path: ./flavor-psp
          workflow_conclusion: ""  # Allow any conclusion since we may have partial success
        continue-on-error: true
      
      - name: 📥 Download Taster artifacts
        uses: dawidd6/action-download-artifact@v24
        with:
          workflow: taster-pipeline.yml
          name_is_regexp: true
          name: ^taster-
          path: ./taster-psp
        continue-on-error: true
      
      - name: 🔧 Organize PSP packages
        run: |
          ci/organize-release-packages.sh \
            release-psp \
            "${{ needs.prepare.outputs.version }}" \
            flavor-psp \
            taster-psp
      
      # A Windows flavor package is named .exe so it is directly runnable;
      # globbing *.psp alone discarded every Windows package after the organize
      # step had just collected it.
      - name: 📤 Upload collected packages
        uses: actions/upload-artifact@v7
        with:
          name: release-psp
          path: |
            release-psp/*.psp
            release-psp/*.exe
          if-no-files-found: error
          retention-days: 30

  # ==================================================================================
  # 📊 Generate Release Assets
  # ==================================================================================
  generate-assets:
    name: 📊 Generate Release Assets
    needs: [prepare, collect-wheels, collect-packages]
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 📥 Download wheels
        uses: actions/download-artifact@v8
        with:
          name: release-wheels
          path: ./release
      
      - name: 📥 Download PSP packages
        uses: actions/download-artifact@v8
        with:
          name: release-psp
          path: ./release
      
      # Covers wheels and packages under both names (.psp and .exe), and fails
      # when there is nothing to checksum -- the release notes tell users to run
      # `sha256sum -c checksums.txt`, so an asset missing from it is an asset
      # nobody can verify.
      - name: 🔧 Generate checksums
        run: ci/generate-release-checksums.sh release

      # The asset list is derived from one platform table inside the script, so
      # the notes cannot promise a filename the pipeline does not attach.
      - name: 📝 Generate Release Notes
        run: ci/generate-release-notes.sh "${{ needs.prepare.outputs.version }}" "${{ github.repository }}" release/release-notes.md

      - name: 📤 Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release/
          retention-days: 30

  # ==================================================================================
  # 🏷️ Create GitHub Release
  # ==================================================================================
  create-release:
    name: 🏷️ Create GitHub Release
    needs: [prepare, generate-assets]
    if: github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 📥 Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
      
      # Every copy here used to be `cp ... 2>/dev/null || true` over a *.psp
      # glob, so a dropped asset left no trace in the job log.
      - name: 🗂️ Extract and organize release files
        run: ci/assemble-release-files.sh artifacts release

      # Idempotent tag creation: skips ref creation if the tag already exists,
      # so rerunning a partial release does not fail with HTTP 422.
      - name: 🏷️ Create Git Tag
        run: ci/create-release-tag.sh "${{ needs.prepare.outputs.version }}" "${{ needs.prepare.outputs.version_tag }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ needs.prepare.outputs.version_tag }}
          name: Flavor Pack ${{ needs.prepare.outputs.version }}
          body_path: release/release-notes.md
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: |
            release/*.whl
            release/*.psp
            release/*.exe
            release/checksums.txt
          generate_release_notes: false

  # ==================================================================================
  # 🧪 Publish to TestPyPI (optional)
  # ==================================================================================
  publish-testpypi:
    name: 🧪 Publish to TestPyPI
    needs: [prepare, generate-assets]
    if: github.ref == 'refs/heads/main' && github.event.inputs.dry_run != 'true' && github.event.inputs.publish_testpypi == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/flavorpack
    permissions:
      id-token: write
    steps:
      - name: 📥 Download wheels
        uses: actions/download-artifact@v8
        with:
          name: release-wheels
          path: ./dist
      
      - name: 🔍 Verify wheels
        run: |
          echo "📦 Wheels to publish to TestPyPI:"
          ls -la dist/*.whl
          
          # Verify wheel names match PyPI expectations
          for wheel in dist/*.whl; do
            basename=$(basename "$wheel")
            if [[ ! "$basename" =~ ^flavorpack-.*\.whl$ ]]; then
              echo "::error::Invalid wheel name for PyPI: $basename"
              exit 1
            fi
          done
      
      - name: 🧪 Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true
          verbose: true

  # ==================================================================================
  # 🐍 Publish to PyPI
  # ==================================================================================
  publish-pypi:
    name: 🐍 Publish to PyPI
    needs: [prepare, create-release]
    if: github.ref == 'refs/heads/main' && github.event.inputs.dry_run != 'true' && github.event.inputs.publish_pypi == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/flavorpack
    permissions:
      id-token: write
    steps:
      - name: 📥 Download wheels
        uses: actions/download-artifact@v8
        with:
          name: release-wheels
          path: ./dist
      
      - name: 🔍 Verify wheels
        run: |
          echo "📦 Wheels to publish:"
          ls -la dist/*.whl
          
          # Verify wheel names match PyPI expectations
          for wheel in dist/*.whl; do
            basename=$(basename "$wheel")
            if [[ ! "$basename" =~ ^flavorpack-.*\.whl$ ]]; then
              echo "::error::Invalid wheel name for PyPI: $basename"
              exit 1
            fi
          done
      
      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true

  # ==================================================================================
  # 📊 Release Summary
  # ==================================================================================
  summary:
    name: 📊 Release Summary
    needs: [prepare, collect-wheels, collect-packages, generate-assets, create-release, publish-pypi, publish-testpypi]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: 📊 Generate Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          # 🚀 Release Summary for Flavor Pack ${{ needs.prepare.outputs.version }}
          
          ## 📌 Release Information
          - **Version**: ${{ needs.prepare.outputs.version }}
          - **Tag**: ${{ needs.prepare.outputs.version_tag }}
          - **Type**: ${{ github.event.inputs.prerelease == 'true' && 'Pre-release' || 'Stable Release' }}
          - **Mode**: ${{ github.event.inputs.dry_run == 'true' && 'Dry Run' || 'Production' }}
          
          ## 🔨 Build Sources
          - **Helpers**: Run #${{ needs.prepare.outputs.helper_run_id }}
          - **Flavor Pipeline**: Run #${{ needs.prepare.outputs.flavor_run_id }}
          
          ## 📦 Asset Collection
          | Asset Type | Status |
          |------------|--------|
          | Platform Wheels | ${{ needs.collect-wheels.result == 'success' && '✅ Collected' || '❌ Failed' }} |
          | PSP Packages | ${{ needs.collect-packages.result == 'success' && '✅ Collected' || '❌ Failed' }} |
          | Release Assets | ${{ needs.generate-assets.result == 'success' && '✅ Generated' || '❌ Failed' }} |
          
          ## 🚀 Publishing Status
          | Target | Status | Link |
          |--------|--------|------|
          | GitHub Release | ${{ needs.create-release.result == 'success' && '✅ Published' || needs.create-release.result == 'skipped' && '⏭️ Skipped (Dry Run)' || '❌ Failed' }} | ${{ needs.create-release.result == 'success' && format('[View Release](https://github.com/{0}/releases/tag/{1})', github.repository, needs.prepare.outputs.version_tag) || 'N/A' }} |
          | TestPyPI | ${{ needs.publish-testpypi.result == 'success' && '✅ Published' || needs.publish-testpypi.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} | ${{ needs.publish-testpypi.result == 'success' && format('[View on TestPyPI](https://test.pypi.org/project/flavorpack/{0}/)', needs.prepare.outputs.version) || 'N/A' }} |
          | PyPI | ${{ needs.publish-pypi.result == 'success' && '✅ Published' || needs.publish-pypi.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} | ${{ needs.publish-pypi.result == 'success' && format('[View on PyPI](https://pypi.org/project/flavorpack/{0}/)', needs.prepare.outputs.version) || 'N/A' }} |
          
          ## 📋 Next Steps
          EOF
          
          if [ "${{ needs.create-release.result }}" = "success" ]; then
            cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          1. Verify the release at https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.version_tag }}
          2. Test installation: `pip install flavorpack==${{ needs.prepare.outputs.version }}`
          3. Update documentation if needed
          4. Announce the release
          EOF
          elif [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          This was a dry run. To create the actual release:
          1. Review the collected assets
          2. Run the workflow again with dry_run = false
          EOF
          else
            cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ⚠️ The release process encountered issues. Please check the logs and retry if necessary.
          EOF
          fi
