name: 07 📦 Dependency Audit

on:
  workflow_dispatch:
    inputs:
      check_updates:
        description: 'Check for dependency updates'
        type: boolean
        default: true
      auto_pr:
        description: 'Create PR for updates (if any)'
        type: boolean
        default: false
  
  schedule:
    # Run weekly on Mondays at 4 AM UTC
    - cron: '0 4 * * 1'
  
  push:
    paths:
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'Pipfile*'
      - 'go.mod'
      - 'go.sum'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'yarn.lock'
      - 'pnpm-lock.yaml'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # Python Dependency Audit
  python-deps:
    name: 🐍 Python Dependencies
    runs-on: ubuntu-24.04
    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
      update_count: ${{ steps.check.outputs.update_count }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📦 Install Audit Tools
        run: .github/scripts/install-python-audit-tools.sh
      
      - name: 🔍 Dependency Tree Analysis
        run: .github/scripts/run-python-dependency-tree-analysis.sh
      
      - name: 🔒 Vulnerability Scanning
        id: vuln-scan
        continue-on-error: true
        run: .github/scripts/run-python-vulnerability-scanning.sh
      
      - name: 📋 License Analysis
        continue-on-error: true
        run: .github/scripts/run-python-license-analysis.sh
      
      - name: 🔄 Check for Updates
        id: check
        if: inputs.check_updates == true
        continue-on-error: true
        run: .github/scripts/check-python-for-updates.sh
      
      - name: 🧹 Identify Unused Dependencies
        continue-on-error: true
        run: |
          echo "### Unused Dependencies Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ Manual review recommended for unused dependencies" >> $GITHUB_STEP_SUMMARY
          echo "Consider using tools like \`vulture\` or \`pycln\` for dead code detection" >> $GITHUB_STEP_SUMMARY
      
      - name: 📊 Generate Dependency Report
        if: always()
        run: .github/scripts/generate-python-dependency-report.sh
      
      - name: 📤 Upload Python Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-dependency-reports
          path: |
            *.json
            *.md
            *.txt
            *.log

  # Go Dependency Audit
  go-deps:
    name: 🐹 Go Dependencies
    runs-on: ubuntu-24.04
    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: 🔍 Dependency Analysis
        run: .github/scripts/run-go-dependency-analysis.sh
      
      - name: 🔒 Vulnerability Scanning
        continue-on-error: true
        run: .github/scripts/run-go-vulnerability-scanning.sh
      
      - name: 📋 License Check
        continue-on-error: true
        run: .github/scripts/run-go-license-check.sh
      
      - name: 🔄 Check for Updates
        id: check
        if: inputs.check_updates == true
        continue-on-error: true
        run: .github/scripts/check-go-for-updates.sh
      
      - name: 🧹 Check Module Tidiness
        continue-on-error: true
        run: .github/scripts/check-go-module-tidiness.sh
      
      - name: 📤 Upload Go Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-dependency-reports
          path: |
            src/flavor-go/*.json
            src/flavor-go/*.txt
            src/flavor-go/*.log

  # Rust Dependency Audit
  rust-deps:
    name: 🦀 Rust Dependencies
    runs-on: ubuntu-24.04
    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: 📦 Install Cargo Tools
        run: |
          cargo install cargo-audit
          cargo install cargo-outdated
          cargo install cargo-tree
          cargo install cargo-license
          cargo install cargo-deny
          cargo install cargo-machete
          cargo install cargo-udeps
      
      - name: 🔍 Dependency Tree
        run: .github/scripts/run-rust-dependency-tree.sh
      
      - name: 🔒 Security Audit
        continue-on-error: true
        run: .github/scripts/run-rust-security-audit.sh
      
      - name: 📋 License Analysis
        continue-on-error: true
        run: .github/scripts/run-rust-license-analysis.sh
      
      - name: 🔄 Check for Updates
        id: check
        if: inputs.check_updates == true
        continue-on-error: true
        run: .github/scripts/check-rust-for-updates.sh
      
      - name: 🧹 Check for Unused Dependencies
        continue-on-error: true
        run: .github/scripts/check-rust-for-unused-dependencies.sh
      
      - name: 📤 Upload Rust Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-dependency-reports
          path: |
            src/flavor-rs/*.json
            src/flavor-rs/*.txt
            src/flavor-rs/*.log

  # Dependency Report and Update PR
  dependency-report:
    name: 📊 Dependency Report
    needs: [python-deps, go-deps, rust-deps]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 📥 Download all reports
        uses: actions/download-artifact@v4
        with:
          path: dependency-reports
      
      - name: 📊 Generate Consolidated Report
        env:
          NEEDS_PYTHON_DEPS_OUTPUTS_HAS_UPDATES: ${{ needs.python-deps.outputs.has_updates }}
          NEEDS_PYTHON_DEPS_OUTPUTS_UPDATE_COUNT: ${{ needs.python-deps.outputs.update_count }}
          NEEDS_GO_DEPS_OUTPUTS_HAS_UPDATES: ${{ needs.go-deps.outputs.has_updates }}
          NEEDS_RUST_DEPS_OUTPUTS_HAS_UPDATES: ${{ needs.rust-deps.outputs.has_updates }}
        run: .github/scripts/generate-dependency-report.sh
      
      - name: 🔄 Create Update PR
        if: inputs.auto_pr == true && (needs.python-deps.outputs.has_updates == 'true' || needs.go-deps.outputs.has_updates == 'true' || needs.rust-deps.outputs.has_updates == 'true')
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: Update dependencies"
          title: "🔄 Dependency Updates Available"
          body: |
            ## 📦 Dependency Updates
            
            This PR contains available dependency updates identified by the dependency audit workflow.
            
            ### Updates Available:
            - Python: ${{ needs.python-deps.outputs.has_updates == 'true' && needs.python-deps.outputs.update_count || '0' }} packages
            - Go: ${{ needs.go-deps.outputs.has_updates == 'true' && 'Yes' || 'No' }}
            - Rust: ${{ needs.rust-deps.outputs.has_updates == 'true' && 'Yes' || 'No' }}
            
            ### Action Required:
            1. Review the changes
            2. Run tests locally
            3. Check for breaking changes
            4. Merge if all checks pass
            
            ---
            *Generated by Dependency Audit Workflow - Run #${{ github.run_id }}*
          branch: deps/update-${{ github.run_id }}
          delete-branch: true
      
      - name: 📤 Upload Summary
        uses: actions/upload-artifact@v4
        with:
          name: dependency-summary
          path: dependency-summary.json