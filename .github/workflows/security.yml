name: 🔐 Security Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ==================================================================================
  # 🔍 CodeQL Analysis
  # ==================================================================================
  codeql:
    name: 🔍 CodeQL Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    strategy:
      fail-fast: false
      matrix:
        language: [python, go]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔧 Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      
      - name: 🔨 Autobuild
        uses: github/codeql-action/autobuild@v3
      
      - name: 🔍 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ==================================================================================
  # 🛡️ Dependency Scanning
  # ==================================================================================
  dependencies:
    name: 🛡️ Dependency Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 🔍 Run pip-audit
        run: |
          pip install pip-audit
          pip-audit --desc --fix --dry-run
      
      - name: 🔍 Run safety check
        run: |
          pip install safety
          safety check --json --continue-on-error
      
      - name: 🦀 Audit Rust dependencies
        run: |
          cd helpers/flavor-rust
          cargo audit --deny warnings
      
      - name: 🐹 Audit Go dependencies
        run: |
          go install github.com/sonatype-nexus-community/nancy@latest
          cd helpers/flavor-go
          go list -json -deps ./... | nancy sleuth

  # ==================================================================================
  # 🔒 Secret Scanning
  # ==================================================================================
  secrets:
    name: 🔒 Secret Scanning
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🔍 TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'HEAD' }}
          extra_args: --debug --only-verified
      
      - name: 🔍 Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================================================================================
  # 🚨 SAST Scanning
  # ==================================================================================
  sast:
    name: 🚨 SAST Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔍 Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
            p/python
            p/golang
            p/rust
      
      - name: 🔍 Bandit (Python)
        run: |
          pip install bandit[toml]
          bandit -r src/ -ll -f json -o bandit-report.json
      
      - name: 🔍 gosec (Go)
        run: |
          cd helpers/flavor-go
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt json -out gosec-report.json ./...
        continue-on-error: true

  # ==================================================================================
  # 🐳 Container Scanning
  # ==================================================================================
  container:
    name: 🐳 Container Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔍 Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
      
      - name: 📤 Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # ==================================================================================
  # 📜 License Compliance
  # ==================================================================================
  license:
    name: 📜 License Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔍 Check Python licenses
        run: |
          pip install pip-licenses
          pip-licenses --format=json --with-license-file --no-license-path > python-licenses.json
      
      - name: 🔍 Check Go licenses
        run: |
          go install github.com/google/go-licenses@latest
          cd helpers/flavor-go
          go-licenses check ./...
      
      - name: 🔍 Check Rust licenses
        run: |
          cargo install cargo-license
          cd helpers/flavor-rust
          cargo license --json > rust-licenses.json

  # ==================================================================================
  # 🏗️ SBOM Generation
  # ==================================================================================
  sbom:
    name: 🏗️ Generate SBOM
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔧 Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
      
      - name: 📤 Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  # ==================================================================================
  # 🎯 Security Scorecard
  # ==================================================================================
  scorecard:
    name: 🎯 Security Scorecard
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' || github.event_name != 'pull_request') && (github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]'))
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: 🔍 Run Scorecard
        uses: ossf/scorecard-action@v2
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      
      - name: 📤 Upload results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scorecard.sarif

  # ==================================================================================
  # 📊 Security Summary
  # ==================================================================================
  summary:
    name: 📊 Security Summary
    needs: [codeql, dependencies, secrets, sast, container, license, sbom]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📊 Generate Summary
        run: |
          echo "# 🔐 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # CodeQL
          if [ "${{ needs.codeql.result }}" = "success" ]; then
            echo "✅ **CodeQL**: No security issues found" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **CodeQL**: Security issues detected" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Dependencies
          if [ "${{ needs.dependencies.result }}" = "success" ]; then
            echo "✅ **Dependencies**: No vulnerabilities" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Dependencies**: Vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Secrets
          if [ "${{ needs.secrets.result }}" = "success" ]; then
            echo "✅ **Secrets**: No exposed secrets" >> $GITHUB_STEP_SUMMARY
          else
            echo "🚨 **Secrets**: Potential secrets detected" >> $GITHUB_STEP_SUMMARY
          fi
          
          # SAST
          if [ "${{ needs.sast.result }}" = "success" ]; then
            echo "✅ **SAST**: Code analysis passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **SAST**: Code issues found" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Container
          if [ "${{ needs.container.result }}" = "success" ]; then
            echo "✅ **Container**: No vulnerabilities" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Container**: Vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          fi
          
          # License
          if [ "${{ needs.license.result }}" = "success" ]; then
            echo "✅ **License**: Compliance check passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **License**: Compliance issues" >> $GITHUB_STEP_SUMMARY
          fi
          
          # SBOM
          if [ "${{ needs.sbom.result }}" = "success" ]; then
            echo "✅ **SBOM**: Generated successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **SBOM**: Generation failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔒 Security Recommendations" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Review all security findings in the Security tab" >> $GITHUB_STEP_SUMMARY
          echo "2. Update dependencies with known vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "3. Rotate any exposed secrets immediately" >> $GITHUB_STEP_SUMMARY
          echo "4. Address high-severity findings before merge" >> $GITHUB_STEP_SUMMARY