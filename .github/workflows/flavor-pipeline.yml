name: 🌶️ Flavor Pipeline

on:
  workflow_dispatch:
    inputs:
      helper_run_id:
        description: 'Helper Pipeline run ID (leave empty for latest)'
        type: string
        required: false
      test_filter:
        description: 'Test filter (e.g., -k test_name or -m marker)'
        type: string
        required: false
  
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'src/flavor/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/flavor-pipeline.yml'
  
  pull_request:
    paths:
      - 'src/flavor/**'
      - 'tests/**'
  
  workflow_run:
    workflows: ["🔨 Helper Pipeline"]
    types: [completed]
    branches: [main]

jobs:
  # Setup and download helper artifacts
  setup:
    name: 🔧 Setup & Get Helpers
    runs-on: ubuntu-latest
    outputs:
      helper_version: ${{ steps.helpers.outputs.version }}
      test_matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔍 Determine helper version
        id: helpers
        run: |
          # Source the script to get RUN_ID and VERSION
          source .github/scripts/get-helper-run.sh "${{ inputs.helper_run_id }}"
          
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}
      
      - name: 📥 Download helper artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: helper-pipeline.yml
          run_id: ${{ steps.helpers.outputs.run_id }}
          name: flavor-helpers-${{ steps.helpers.outputs.version }}-all
          path: ./helpers-dist
      
      - name: 📤 Upload helpers for test jobs
        uses: actions/upload-artifact@v4
        with:
          name: test-helpers-${{ github.run_id }}
          path: |
            helpers-dist/*.zip
      
      - name: 🧪 Define test matrix
        id: matrix
        run: |
          # Define test categories
          cat > matrix.json << 'EOF'
          {
            "include": [
              {"name": "unit", "runner": "ubuntu-latest", "marker": "unit", "timeout": 10},
              {"name": "integration", "runner": "ubuntu-latest", "marker": "integration", "timeout": 20},
              {"name": "security", "runner": "ubuntu-latest", "marker": "security", "timeout": 15},
              {"name": "format-2025", "runner": "ubuntu-latest", "path": "tests/format_2025", "timeout": 30},
              {"name": "packaging", "runner": "ubuntu-latest", "path": "tests/packaging", "timeout": 25},
              {"name": "cross-language", "runner": "ubuntu-latest", "marker": "cross_language", "timeout": 30}
            ]
          }
          EOF
          
          MATRIX=$(cat matrix.json | jq -c .)
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Test matrix: $MATRIX"

  # Run tests in parallel
  test:
    name: 🧪 Test ${{ matrix.name }}
    needs: setup
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.test_matrix) }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 📥 Download helpers
        uses: actions/download-artifact@v4
        with:
          name: test-helpers-${{ github.run_id }}
          path: ./helpers-dist
      
      - name: 🔧 Extract helpers
        run: |
          # TEMPORARILY REMOVED windows_amd64 - Windows support has path separator issues
          .github/scripts/download-helpers.sh helpers-dist "${{ needs.setup.outputs.helper_version }}" "linux_amd64 linux_arm64 darwin_amd64 darwin_arm64"
          
          # List available helpers
          ls -la helpers/bin/
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          # Set up virtual environment
          python -m venv workenv
          source workenv/bin/activate
          
          # Install uv for faster dependency resolution
          pip install uv
          
          # Install pytest first to ensure it's available
          uv pip install pytest pytest-cov pytest-xdist
          
          # Install flavor and test dependencies
          uv pip install -e ".[dev,test]"
          
          # Install sibling packages if needed
          if [ -f "../pyvider-telemetry/pyproject.toml" ]; then
            uv pip install -e "../pyvider-telemetry"
          fi
      
      - name: 🧪 Run tests
        run: |
          source workenv/bin/activate
          
          # Build test command (use python -m pytest to ensure correct pytest is used)
          TEST_CMD="python -m pytest -xvs"
          
          # Add marker if specified
          if [ -n "${{ matrix.marker }}" ]; then
            TEST_CMD="$TEST_CMD -m ${{ matrix.marker }}"
          fi
          
          # Add path if specified
          if [ -n "${{ matrix.path }}" ]; then
            TEST_CMD="$TEST_CMD ${{ matrix.path }}"
          else
            TEST_CMD="$TEST_CMD tests/"
          fi
          
          # Add user filter if provided
          if [ -n "${{ inputs.test_filter }}" ]; then
            TEST_CMD="$TEST_CMD ${{ inputs.test_filter }}"
          fi
          
          # Add coverage for unit tests
          if [ "${{ matrix.name }}" = "unit" ]; then
            TEST_CMD="$TEST_CMD --cov=src/flavor --cov-report=xml --cov-report=term"
          fi
          
          echo "Running: $TEST_CMD"
          $TEST_CMD
      
      - name: 📊 Upload coverage
        if: matrix.name == 'unit'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: flavor-coverage
      
      - name: 📤 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}-${{ github.run_id }}
          path: |
            pytest-results.xml
            .coverage
            coverage.xml

  # Build Flavor PSP packages
  build-flavor:
    name: 📦 Build Flavor ${{ matrix.platform }}
    needs: [setup, test]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_amd64
            runner: ubuntu-latest
          - platform: linux_arm64
            runner: ubuntu-latest
          - platform: darwin_amd64
            runner: macos-13  # Intel Mac
          - platform: darwin_arm64
            runner: macos-latest  # M1 Mac
          # Windows temporarily disabled due to path issues
          # - platform: windows_amd64
          #   runner: windows-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📥 Download helper artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: helper-pipeline.yml
          name: flavor-helpers-${{ needs.setup.outputs.helper_version }}-${{ matrix.platform }}
          path: ./artifacts
      
      - name: 🔨 Build Flavor PSP
        run: |
          bash .github/scripts/build-flavor.sh \
            "${{ matrix.platform }}" \
            "${{ needs.setup.outputs.helper_version }}" \
            "artifacts"
      
      - name: 📤 Upload Flavor package
        uses: actions/upload-artifact@v4
        with:
          name: flavor-${{ needs.setup.outputs.helper_version }}-${{ matrix.platform }}
          path: |
            artifacts/flavor-*.psp
            artifacts/flavor-*.exe
  
  # Test Flavor with Taster
  test-flavor:
    name: 🧪 Test Flavor with Taster ${{ matrix.platform }}
    needs: [setup, build-flavor]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_amd64
            runner: ubuntu-latest
          - platform: darwin_amd64
            runner: macos-13
          - platform: darwin_arm64
            runner: macos-latest
          # Test Linux ARM64 on AMD64 runner (emulation)
          - platform: linux_arm64
            runner: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📥 Download Flavor package
        uses: actions/download-artifact@v4
        with:
          name: flavor-${{ needs.setup.outputs.helper_version }}-${{ matrix.platform }}
          path: ./artifacts
      
      - name: 📥 Download helper binaries
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: helper-pipeline.yml
          name: flavor-helpers-${{ needs.setup.outputs.helper_version }}-${{ matrix.platform }}
          path: ./artifacts
      
      - name: 🔧 Extract helpers
        run: |
          mkdir -p helpers/bin
          unzip -o "artifacts/flavor-helpers-${{ needs.setup.outputs.helper_version }}-${{ matrix.platform }}.zip" -d helpers/bin/
          chmod +x helpers/bin/* || true
      
      - name: 🧪 Test Flavor with Taster
        run: |
          bash .github/scripts/test-flavor-with-taster.sh \
            "${{ matrix.platform }}" \
            "${{ needs.setup.outputs.helper_version }}" \
            "artifacts"
      
      - name: 📤 Upload Taster package
        uses: actions/upload-artifact@v4
        with:
          name: taster-${{ needs.setup.outputs.helper_version }}-${{ matrix.platform }}
          path: |
            artifacts/taster-*.psp
            artifacts/taster-*.exe
      
      - name: 📤 Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flavor-test-logs-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            *.log
            test-*.txt
  
  # Combine all Flavor artifacts
  combine-flavor:
    name: 📦 Combine Flavor Artifacts
    needs: [setup, build-flavor, test-flavor]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download all Flavor packages
        uses: actions/download-artifact@v4
        with:
          pattern: flavor-${{ needs.setup.outputs.helper_version }}-*
          path: flavor-packages
          merge-multiple: true
      
      - name: 📥 Download all Taster packages
        uses: actions/download-artifact@v4
        with:
          pattern: taster-${{ needs.setup.outputs.helper_version }}-*
          path: taster-packages
          merge-multiple: true
      
      - name: 🗂️ Organize artifacts
        run: |
          mkdir -p combined
          
          # Copy all Flavor packages
          find flavor-packages -type f \( -name "*.psp" -o -name "*.exe" \) -exec cp {} combined/ \;
          
          # Copy all Taster packages
          find taster-packages -type f \( -name "*.psp" -o -name "*.exe" \) -exec cp {} combined/ \;
          
          # List all artifacts
          echo "📦 Combined artifacts:"
          ls -la combined/
      
      - name: 📤 Upload combined artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flavor-packages-${{ needs.setup.outputs.helper_version }}-all
          path: combined/*

  # Summary and validation
  validate:
    name: ✅ Validate & Summary
    needs: [setup, test, build-flavor, test-flavor, combine-flavor]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 📥 Download test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: test-results
      
      - name: 📥 Download Flavor packages
        if: needs.combine-flavor.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: flavor-packages-${{ needs.setup.outputs.helper_version }}-all
          path: flavor-artifacts
      
      - name: 📊 Generate summary
        run: |
          echo "## 🌶️ Flavor Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Helper Version:** ${{ needs.setup.outputs.helper_version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Parse test results
          for result_dir in test-results/test-results-*; do
            if [ -d "$result_dir" ]; then
              TEST_NAME=$(basename "$result_dir" | sed 's/test-results-//' | sed "s/-${{ github.run_id }}//")
              echo "- **$TEST_NAME**: " >> $GITHUB_STEP_SUMMARY
              
              if [ -f "$result_dir/pytest-results.xml" ]; then
                # Parse pytest XML for pass/fail counts
                echo "✅ Completed" >> $GITHUB_STEP_SUMMARY
              else
                echo "⚠️ No results" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          done
          
          # Only show Flavor packages section if they were built
          if [ -d "flavor-artifacts" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📦 Flavor & Taster Packages" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # List Flavor packages
            echo "#### Flavor PSP Packages:" >> $GITHUB_STEP_SUMMARY
            for pkg in flavor-artifacts/flavor-*.psp flavor-artifacts/flavor-*.exe; do
              if [ -f "$pkg" ]; then
                SIZE=$(du -h "$pkg" | cut -f1)
                echo "- \`$(basename "$pkg")\` ($SIZE)" >> $GITHUB_STEP_SUMMARY
              fi
            done
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Taster Test Packages:" >> $GITHUB_STEP_SUMMARY
            for pkg in flavor-artifacts/taster-*.psp flavor-artifacts/taster-*.exe; do
              if [ -f "$pkg" ]; then
                SIZE=$(du -h "$pkg" | cut -f1)
                echo "- \`$(basename "$pkg")\` ($SIZE)" >> $GITHUB_STEP_SUMMARY
              fi
            done
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- [View test results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "- [Download Flavor packages](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)" >> $GITHUB_STEP_SUMMARY
      
      - name: 🎯 Check status
        run: |
          # Check if any test job failed
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Some tests failed"
            exit 1
          fi
          
          # Check if Flavor build failed
          if [ "${{ needs.build-flavor.result }}" != "success" ]; then
            echo "❌ Flavor build failed"
            exit 1
          fi
          
          # Check if Flavor tests failed
          if [ "${{ needs.test-flavor.result }}" != "success" ]; then
            echo "❌ Flavor tests failed"
            exit 1
          fi
          
          echo "✅ All tests and builds passed"