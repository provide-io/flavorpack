name: 02 🔬 Pretaster Validation

on:
  workflow_dispatch:
    inputs:
      helper_run_id:
        description: 'Helper Prep run ID (leave empty for latest)'
        type: string
        required: false
      test_suite:
        description: 'Test suite to run (all, combo, core, direct)'
        type: string
        required: false
        default: 'all'
  
  workflow_run:
    workflows: ["01 🥘 Helper Prep"]
    types: [completed]
    branches: [main, develop]

jobs:
  setup:
    name: 🔧 Setup & Get Helpers
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      helper_run_id: ${{ steps.helpers.outputs.run_id }}
      test_matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔍 Determine version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: 🔍 Get Helper prep run
        id: helpers
        run: .github/scripts/get-helper-run.sh "${{ inputs.helper_run_id }}"
        env:
          GH_TOKEN: ${{ github.token }}
      
      - name: 🧪 Define test matrix
        id: matrix
        run: |
          .github/scripts/create-pretaster-matrix.sh > matrix.json
          MATRIX=$(cat matrix.json | jq -c .)
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build-pretaster:
    name: 🔨 Build Pretaster Packages
    needs: setup
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.test_matrix) }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📥 Download helpers for platform
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: 01-helper-prep.yml
          run_id: ${{ needs.setup.outputs.helper_run_id }}
          name: flavor-helpers-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: ./helpers-dist
      
      - name: 🔧 Setup helpers
        run: .github/scripts/download-helpers.sh helpers-dist "${{ needs.setup.outputs.version }}" "${{ matrix.platform }}"

      - name: 🔨 Build Pretaster packages
        working-directory: tests/pretaster
        run: ../../.github/scripts/build-pretaster-packages.sh "${{ matrix.platform }}" "${{ needs.setup.outputs.version }}" "dist"
      
      - name: 📤 Upload Pretaster packages
        uses: actions/upload-artifact@v4
        with:
          name: pretaster-packages-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: tests/pretaster/dist/

  test-crosslang:
    name: 🧪 Test Cross-Language Chain
    needs: [setup, build-pretaster, test-pretaster]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.test_matrix) }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 📥 Download pretaster packages
        uses: actions/download-artifact@v4
        with:
          name: pretaster-psp-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: ./build
      
      - name: 📥 Download helpers for platform
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: 01-helper-prep.yml
          name: flavor-helpers-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: ./helpers-dist
      
      - name: 🔍 Verify Cross-Language Package
        run: .github/scripts/verify-cross-language-package.sh "${{ matrix.platform }}" "${{ needs.setup.outputs.version }}" "build"

      - name: 🧪 Run cross-language tests
        run: |
          PSP_EXT=".psp"
          if [[ "${{ matrix.platform }}" == "windows_"* ]]; then
            PSP_EXT=".exe"
          fi
          PRETASTER_PSP="$(pwd)/build/pretaster-${{ needs.setup.outputs.version }}-${{ matrix.platform }}${PSP_EXT}"
          chmod +x "$PRETASTER_PSP" 2>/dev/null || true
          TEST_SUITE="${{ inputs.test_suite }}"
          TEST_SUITE="${TEST_SUITE:-all}"
          .github/scripts/run-pretaster-tests.sh "${{ matrix.platform }}" "${{ needs.setup.outputs.version }}" "$TEST_SUITE" "$PRETASTER_PSP"
      
      - name: 📤 Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crosslang-logs-${{ matrix.platform }}-${{ github.run_id }}
          path: tests/pretaster/logs/

      - name: 📤 Upload crosslang PSP files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crosslang-psp-${{ matrix.platform }}-${{ github.run_id }}
          path: tests/pretaster/dist/*.psp

      - name: 📤 Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crosslang-diagnostics-${{ matrix.platform }}-${{ github.run_id }}
          path: tests/pretaster/failure-diagnostics/

  test-pretaster:
    name: 🧪 Build Pretaster ${{ matrix.name }}
    needs: setup
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.test_matrix) }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📥 Download helpers for platform
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: 01-helper-prep.yml
          name: flavor-helpers-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: ./helpers-dist
      
      - name: 🔧 Build pretaster PSP
        run: |
          .github/scripts/download-helpers.sh helpers-dist "${{ needs.setup.outputs.version }}" "${{ matrix.platform }}"
          mkdir -p build
          .github/scripts/build-pretaster.sh "${{ matrix.platform }}" "${{ needs.setup.outputs.version }}" "simple" "build"
      
      - name: 📤 Upload pretaster PSP
        uses: actions/upload-artifact@v4
        with:
          name: pretaster-psp-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: build/pretaster-${{ needs.setup.outputs.version }}-${{ matrix.platform }}.*
      
      - name: 📤 Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pretaster-logs-${{ matrix.platform }}-${{ github.run_id }}
          path: tests/pretaster/logs/

      - name: 📤 Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics-${{ matrix.platform }}-${{ github.run_id }}
          path: tests/pretaster/failure-diagnostics/

  validate:
    name: ✅ Validate PSPF Compatibility
    needs: [setup, test-pretaster, test-crosslang]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 📥 Download all logs
        uses: actions/download-artifact@v4
        with:
          pattern: '*-logs-*'
          path: all-logs
      
      - name: 📊 Generate compatibility report
        run: .github/scripts/generate-pspf-compatibility-report.sh all-logs
