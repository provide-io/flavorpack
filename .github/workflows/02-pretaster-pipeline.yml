name: 02 🔬 Pretaster Validation

on:
  workflow_dispatch:
    inputs:
      helper_run_id:
        description: 'Helper Prep run ID (leave empty for latest)'
        type: string
        required: false
      test_suite:
        description: 'Test suite to run (all, combo, core, direct)'
        type: string
        required: false
        default: 'all'
  
  workflow_run:
    workflows: ["01 🥘 Helper Prep"]
    types: [completed]
    branches: [main, develop]

jobs:
  setup:
    name: 🔧 Setup & Get Helpers
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      helper_run_id: ${{ steps.helpers.outputs.run_id }}
      test_matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔧 Ensure gh CLI available
        run: type gh >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq gh)

      - name: 🔍 Determine version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 🔍 Get Helper prep run
        id: helpers
        run: |
          # Get Helper prep run ID
          if [ -n "${{ inputs.helper_run_id }}" ]; then
            RUN_ID="${{ inputs.helper_run_id }}"
          else
            RUN_ID=$(gh run list --workflow 01-helper-prep.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')
          fi
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}
      
      - name: 🧪 Define test matrix
        id: matrix
        run: |
          ci/create-pretaster-matrix.sh > matrix.json
          MATRIX=$(cat matrix.json | jq -c .)
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build-pretaster:
    name: 🔨 Build Pretaster Packages
    needs: setup
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.continue_on_error == true }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.test_matrix) }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 📥 Download Go helpers
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow: 01-helper-prep.yml
          run_id: ${{ needs.setup.outputs.helper_run_id }}
          name: flavor-go-helpers-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: ./helpers-dist

      - name: 📥 Download Rust helpers
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow: 01-helper-prep.yml
          run_id: ${{ needs.setup.outputs.helper_run_id }}
          name: flavor-rust-helpers-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: ./helpers-dist

      - name: 📥 Download combined helpers (FreeBSD)
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow: 01-helper-prep.yml
          run_id: ${{ needs.setup.outputs.helper_run_id }}
          name: flavor-helpers-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: ./helpers-dist

      # Download tastesh (embedded shell for self-contained PSPs)
      - name: 📥 Download tastesh
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow: 01-helper-prep.yml
          run_id: ${{ needs.setup.outputs.helper_run_id }}
          name: flavor-tastesh-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: ./helpers-dist

      - name: 🔧 Setup helpers
        shell: bash
        run: |
          # Extract helpers and set up directory structure
          ci/download-helpers.sh helpers-dist \
            "${{ needs.setup.outputs.version }}" \
            "${{ matrix.platform }}"

          # Helpers are already in helpers/bin/ from the script
          chmod +x helpers/bin/*
          ls -la helpers/bin/
      
      # Build pretaster test packages via Makefile (native runners)
      - name: 🔨 Build Pretaster packages
        if: ${{ matrix.vm_arch == '' }}
        shell: bash
        working-directory: tests/pretaster
        run: make HELPERS_DIR=../../helpers dist/echo-test.psp dist/shell-test.psp dist/env-test.psp

      # Build pretaster test packages via Makefile (FreeBSD QEMU VM)
      - name: 🔨 Build Pretaster packages (FreeBSD VM)
        if: ${{ matrix.vm_arch != '' }}
        uses: cross-platform-actions/action@v0.32.0
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          operating_system: freebsd
          version: '14.2'
          architecture: ${{ matrix.vm_arch }}
          shell: bash
          sync_files: true
          run: cd tests/pretaster && gmake HELPERS_DIR=../../helpers dist/echo-test.psp dist/shell-test.psp dist/env-test.psp
      
      - name: 📤 Upload Pretaster packages
        uses: actions/upload-artifact@v7
        with:
          name: pretaster-packages-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: tests/pretaster/dist/

  test-crosslang:
    name: 🧪 Test Cross-Language Chain
    needs: [setup, build-pretaster, test-pretaster]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.continue_on_error == true }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.test_matrix) }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      
      - name: 📥 Download pretaster packages
        uses: actions/download-artifact@v8
        with:
          name: pretaster-psp-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: ./build
      
      - name: 📥 Download Go helpers
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow: 01-helper-prep.yml
          run_id: ${{ needs.setup.outputs.helper_run_id }}
          name: flavor-go-helpers-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: ./helpers-dist

      - name: 📥 Download Rust helpers
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow: 01-helper-prep.yml
          run_id: ${{ needs.setup.outputs.helper_run_id }}
          name: flavor-rust-helpers-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: ./helpers-dist

      - name: 📥 Download combined helpers (FreeBSD)
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow: 01-helper-prep.yml
          run_id: ${{ needs.setup.outputs.helper_run_id }}
          name: flavor-helpers-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: ./helpers-dist

      - name: 🔍 Verify Cross-Language Package
        shell: bash
        run: |
          echo "📦 Checking for pretaster PSP..."

          # Determine PSP extension for Windows
          PSP_EXT=".psp"
          if [[ "${{ matrix.platform }}" == "windows_"* ]]; then
            PSP_EXT=".exe"
          fi

          PRETASTER_PSP="build/pretaster-${{ needs.setup.outputs.version }}-${{ matrix.platform }}${PSP_EXT}"

          if [ -f "$PRETASTER_PSP" ]; then
            echo "✅ Pretaster package found: $PRETASTER_PSP"
            ls -lh "$PRETASTER_PSP"
          else
            echo "⚠️ Pretaster package not found at: $PRETASTER_PSP"
            echo "Contents of build directory:"
            ls -la build/ || echo "Build directory not found"
          fi

      - name: 🧪 Run cross-language tests
        if: ${{ matrix.vm_arch == '' }}
        shell: bash
        run: |
          # Determine PSP extension for Windows
          PSP_EXT=".psp"
          if [[ "${{ matrix.platform }}" == "windows_"* ]]; then
            PSP_EXT=".exe"
          fi

          # Set the path to the pretaster PSP (downloaded to ./build)
          PRETASTER_PSP="$(pwd)/build/pretaster-${{ needs.setup.outputs.version }}-${{ matrix.platform }}${PSP_EXT}"

          # Verify the PSP exists
          if [ ! -f "$PRETASTER_PSP" ]; then
            echo "❌ Pretaster PSP not found at: $PRETASTER_PSP"
            echo "Contents of build directory:"
            ls -la build/ || echo "Build directory not found"
            exit 1
          fi

          chmod +x "$PRETASTER_PSP" 2>/dev/null || true

          # Run tests with the absolute path to the PSP
          # Use "all" as default if test_suite input is not provided (e.g., workflow_run triggers)
          TEST_SUITE="${{ inputs.test_suite }}"
          TEST_SUITE="${TEST_SUITE:-all}"

          ci/run-pretaster-tests.sh \
            "${{ matrix.platform }}" \
            "${{ needs.setup.outputs.version }}" \
            "$TEST_SUITE" \
            "$PRETASTER_PSP"

      - name: 🔧 Stage PSP for FreeBSD VM
        if: ${{ matrix.vm_arch != '' }}
        shell: bash
        run: |
          mkdir -p _psp_stage
          PSP="build/pretaster-${{ needs.setup.outputs.version }}-${{ matrix.platform }}.psp"
          if [ -f "$PSP" ]; then
            cp "$PSP" _psp_stage/
            echo "✅ Staged: $(ls -lh _psp_stage/)"
          else
            echo "⚠️ PSP not found at: $PSP (will fall back to make-only tests)"
            ls -la build/ 2>/dev/null || true
          fi

      - name: 🧪 Run cross-language tests (FreeBSD VM)
        if: ${{ matrix.vm_arch != '' }}
        uses: cross-platform-actions/action@v0.32.0
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          operating_system: freebsd
          version: '14.2'
          architecture: ${{ matrix.vm_arch }}
          shell: bash
          sync_files: true
          run: |
            sudo env IGNORE_OSVERSION=yes pkg install -y gmake python311 uv
            # The PSP launcher resolves "/usr/bin/python3" by extracting the basename
            # and calling which("python3"). A uv venv puts python3 in PATH so the
            # launcher finds it without any symlink hacks.
            uv venv /tmp/pyenv --python python3.11
            export PATH="/tmp/pyenv/bin:$PATH"

            PRETASTER_PSP="_psp_stage/pretaster-${{ needs.setup.outputs.version }}-${{ matrix.platform }}.psp"
            if [ ! -f "$PRETASTER_PSP" ]; then
              echo "⚠️ Staged PSP not found, running without PSP verification"
              PRETASTER_PSP=""
            else
              chmod +x "$PRETASTER_PSP"
            fi

            TEST_SUITE="${{ inputs.test_suite }}"
            TEST_SUITE="${TEST_SUITE:-all}"

            ci/run-pretaster-tests.sh \
              "${{ matrix.platform }}" \
              "${{ needs.setup.outputs.version }}" \
              "$TEST_SUITE" \
              "$PRETASTER_PSP"
      
      - name: 📤 Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crosslang-logs-${{ matrix.platform }}-${{ github.run_id }}
          path: tests/pretaster/logs/

      - name: 📤 Upload crosslang PSP files
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crosslang-psp-${{ matrix.platform }}-${{ github.run_id }}
          path: tests/pretaster/dist/*.psp

      - name: 📤 Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crosslang-diagnostics-${{ matrix.platform }}-${{ github.run_id }}
          path: tests/pretaster/failure-diagnostics/

  test-pretaster:
    name: 🧪 Build Pretaster ${{ matrix.name }}
    needs: setup
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.continue_on_error == true }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.test_matrix) }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 📥 Download Go helpers
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow: 01-helper-prep.yml
          run_id: ${{ needs.setup.outputs.helper_run_id }}
          name: flavor-go-helpers-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: ./helpers-dist

      - name: 📥 Download Rust helpers
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow: 01-helper-prep.yml
          run_id: ${{ needs.setup.outputs.helper_run_id }}
          name: flavor-rust-helpers-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: ./helpers-dist

      - name: 📥 Download combined helpers (FreeBSD)
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow: 01-helper-prep.yml
          run_id: ${{ needs.setup.outputs.helper_run_id }}
          name: flavor-helpers-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: ./helpers-dist

      - name: 📥 Download all-platform helpers (fallback)
        if: ${{ matrix.vm_arch != '' }}
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow: 01-helper-prep.yml
          run_id: ${{ needs.setup.outputs.helper_run_id }}
          name: flavor-helpers-${{ needs.setup.outputs.version }}-all
          path: ./helpers-dist

      - name: 🔧 Extract helpers
        shell: bash
        run: |
          # The dawidd6 action downloads the artifact contents (zip files) to helpers-dist/
          echo "Contents of helpers-dist:"
          ls -la helpers-dist/ || true

          # Extract the helper binaries
          ci/download-helpers.sh helpers-dist \
            "${{ needs.setup.outputs.version }}" \
            "${{ matrix.platform }}"
          chmod +x helpers/bin/* 2>/dev/null || true

      - name: 🔧 Build pretaster PSP
        if: ${{ matrix.vm_arch == '' }}
        shell: bash
        run: |
          mkdir -p build
          ci/build-pretaster.sh \
            "${{ matrix.platform }}" \
            "${{ needs.setup.outputs.version }}" \
            "simple" \
            "build"

      - name: 🔧 Build pretaster PSP (FreeBSD VM)
        if: ${{ matrix.vm_arch != '' }}
        uses: cross-platform-actions/action@v0.32.0
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          operating_system: freebsd
          version: '14.2'
          architecture: ${{ matrix.vm_arch }}
          shell: bash
          sync_files: true
          run: |
            chmod +x helpers/bin/* 2>/dev/null || true
            mkdir -p build
            ci/build-pretaster.sh \
              "${{ matrix.platform }}" \
              "${{ needs.setup.outputs.version }}" \
              "simple" \
              "build"
      
      - name: 📤 Upload pretaster PSP
        uses: actions/upload-artifact@v7
        with:
          name: pretaster-psp-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: build/pretaster-${{ needs.setup.outputs.version }}-${{ matrix.platform }}.*
      
      - name: 📤 Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pretaster-logs-${{ matrix.platform }}-${{ github.run_id }}
          path: tests/pretaster/logs/

      - name: 📤 Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-diagnostics-${{ matrix.platform }}-${{ github.run_id }}
          path: tests/pretaster/failure-diagnostics/

  validate:
    name: ✅ Validate PSPF Compatibility
    needs: [setup, test-pretaster, test-crosslang]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      
      - name: 📥 Download all logs
        uses: actions/download-artifact@v8
        with:
          pattern: '*-logs-*'
          path: all-logs
      
      - name: 📊 Generate compatibility report
        run: |
          ci/generate-pspf-compatibility-report.sh all-logs