name: 02 🔬 Pretaster Validation

on:
  workflow_dispatch:
    inputs:
      helper_run_id:
        description: 'Helper Prep run ID (leave empty for latest)'
        type: string
        required: false
      test_suite:
        description: 'Test suite to run (all, combo, core, direct)'
        type: string
        required: false
        default: 'all'
  
  workflow_run:
    workflows: ["01 🥘 Helper Prep"]
    types: [completed]
    branches: [main, develop]

jobs:
  setup:
    name: 🔧 Setup & Get Helpers
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      helper_run_id: ${{ steps.helpers.outputs.run_id }}
      test_matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🔧 Ensure gh CLI available
        run: type gh >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq gh)

      - name: 🔍 Determine version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 🔍 Get Helper prep run
        id: helpers
        run: |
          # Get Helper prep run ID
          if [ -n "${{ inputs.helper_run_id }}" ]; then
            RUN_ID="${{ inputs.helper_run_id }}"
          else
            RUN_ID=$(gh run list --workflow 01-helper-prep.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')
          fi
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}
      
      - name: 🧪 Define test matrix
        id: matrix
        run: |
          ci/create-pretaster-matrix.sh > matrix.json
          MATRIX=$(cat matrix.json | jq -c .)
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build-pretaster:
    name: 🔨 Build Pretaster Packages
    needs: setup
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.continue_on_error == true }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.test_matrix) }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 📥 Download Go helpers
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow: 01-helper-prep.yml
          run_id: ${{ needs.setup.outputs.helper_run_id }}
          name: flavor-go-helpers-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: ./helpers-dist

      - name: 📥 Download Rust helpers
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow: 01-helper-prep.yml
          run_id: ${{ needs.setup.outputs.helper_run_id }}
          name: flavor-rust-helpers-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: ./helpers-dist

      - name: 📥 Download combined helpers (FreeBSD)
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow: 01-helper-prep.yml
          run_id: ${{ needs.setup.outputs.helper_run_id }}
          name: flavor-helpers-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: ./helpers-dist

      - name: 🔧 Setup helpers
        shell: bash
        run: |
          # Extract helpers and set up directory structure
          ci/download-helpers.sh helpers-dist \
            "${{ needs.setup.outputs.version }}" \
            "${{ matrix.platform }}"

          # Helpers are already in helpers/bin/ from the script
          chmod +x helpers/bin/*
          ls -la helpers/bin/
      
      - name: 🔨 Build Pretaster packages
        working-directory: tests/pretaster
        shell: bash
        run: |
          export FLAVOR_WORKENV_BASE=$(pwd)
          export FLAVOR_LOG_LEVEL=info

          # Create output directory
          mkdir -p dist

          # Build test packages using JSON manifests directly
          echo "📦 Building Pretaster test packages..."

          # Determine binary extension for Windows
          EXT=""
          if [[ "${{ matrix.platform }}" == "windows_"* ]]; then
            EXT=".exe"
          fi

          # Select launcher for cross-language combo: Windows uses Go launcher only
          # (Rust launcher not supported on Windows — see tests/pretaster/KNOWN_ISSUES.md)
          if [[ "${{ matrix.platform }}" == "windows_"* ]]; then
            COMBO_LAUNCHER="../../helpers/bin/flavor-go-launcher-${{ matrix.platform }}${EXT}"
          else
            COMBO_LAUNCHER="../../helpers/bin/flavor-rs-launcher-${{ matrix.platform }}${EXT}"
          fi

          # Build with different builder/launcher combinations
          ../../helpers/bin/flavor-go-builder-${{ matrix.platform }}${EXT} \
            --manifest configs/test-echo.json \
            --launcher-bin "$COMBO_LAUNCHER" \
            --output dist/pretaster-echo.psp \
            --key-seed pretaster-test

          # Windows: Rust not supported — skip Rust builder entirely
          if [[ "${{ matrix.platform }}" != "windows_"* ]]; then
            ../../helpers/bin/flavor-rs-builder-${{ matrix.platform }}${EXT} \
              --manifest configs/test-shell.json \
              --launcher-bin ../../helpers/bin/flavor-go-launcher-${{ matrix.platform }}${EXT} \
              --output dist/pretaster-shell.psp \
              --key-seed pretaster-test
          fi

          ls -la dist/
      
      - name: 📤 Upload Pretaster packages
        uses: actions/upload-artifact@v7
        with:
          name: pretaster-packages-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: tests/pretaster/dist/

  test-crosslang:
    name: 🧪 Test Cross-Language Chain
    needs: [setup, build-pretaster, test-pretaster]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.continue_on_error == true }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.test_matrix) }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      
      - name: 📥 Download pretaster packages
        uses: actions/download-artifact@v8
        with:
          name: pretaster-psp-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: ./build
      
      - name: 📥 Download Go helpers
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow: 01-helper-prep.yml
          run_id: ${{ needs.setup.outputs.helper_run_id }}
          name: flavor-go-helpers-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: ./helpers-dist

      - name: 📥 Download Rust helpers
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow: 01-helper-prep.yml
          run_id: ${{ needs.setup.outputs.helper_run_id }}
          name: flavor-rust-helpers-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: ./helpers-dist

      - name: 📥 Download combined helpers (FreeBSD)
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow: 01-helper-prep.yml
          run_id: ${{ needs.setup.outputs.helper_run_id }}
          name: flavor-helpers-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: ./helpers-dist

      - name: 🔍 Verify Cross-Language Package
        shell: bash
        run: |
          echo "📦 Checking for pretaster PSP..."

          # Determine PSP extension for Windows
          PSP_EXT=".psp"
          if [[ "${{ matrix.platform }}" == "windows_"* ]]; then
            PSP_EXT=".exe"
          fi

          PRETASTER_PSP="build/pretaster-${{ needs.setup.outputs.version }}-${{ matrix.platform }}${PSP_EXT}"

          if [ -f "$PRETASTER_PSP" ]; then
            echo "✅ Pretaster package found: $PRETASTER_PSP"
            ls -lh "$PRETASTER_PSP"
          else
            echo "⚠️ Pretaster package not found at: $PRETASTER_PSP"
            echo "Contents of build directory:"
            ls -la build/ || echo "Build directory not found"
          fi

      - name: 🧪 Run cross-language tests
        shell: bash
        run: |
          # Determine PSP extension for Windows
          PSP_EXT=".psp"
          if [[ "${{ matrix.platform }}" == "windows_"* ]]; then
            PSP_EXT=".exe"
          fi

          # Set the path to the pretaster PSP (downloaded to ./build)
          PRETASTER_PSP="$(pwd)/build/pretaster-${{ needs.setup.outputs.version }}-${{ matrix.platform }}${PSP_EXT}"

          # Verify the PSP exists
          if [ ! -f "$PRETASTER_PSP" ]; then
            echo "❌ Pretaster PSP not found at: $PRETASTER_PSP"
            echo "Contents of build directory:"
            ls -la build/ || echo "Build directory not found"
            exit 1
          fi

          chmod +x "$PRETASTER_PSP" 2>/dev/null || true

          # Run tests with the absolute path to the PSP
          # Use "all" as default if test_suite input is not provided (e.g., workflow_run triggers)
          TEST_SUITE="${{ inputs.test_suite }}"
          TEST_SUITE="${TEST_SUITE:-all}"

          ci/run-pretaster-tests.sh \
            "${{ matrix.platform }}" \
            "${{ needs.setup.outputs.version }}" \
            "$TEST_SUITE" \
            "$PRETASTER_PSP"
      
      - name: 📤 Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crosslang-logs-${{ matrix.platform }}-${{ github.run_id }}
          path: tests/pretaster/logs/

      - name: 📤 Upload crosslang PSP files
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crosslang-psp-${{ matrix.platform }}-${{ github.run_id }}
          path: tests/pretaster/dist/*.psp

      - name: 📤 Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crosslang-diagnostics-${{ matrix.platform }}-${{ github.run_id }}
          path: tests/pretaster/failure-diagnostics/

  test-pretaster:
    name: 🧪 Build Pretaster ${{ matrix.name }}
    needs: setup
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.continue_on_error == true }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.test_matrix) }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 📥 Download Go helpers
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow: 01-helper-prep.yml
          run_id: ${{ needs.setup.outputs.helper_run_id }}
          name: flavor-go-helpers-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: ./helpers-dist

      - name: 📥 Download Rust helpers
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow: 01-helper-prep.yml
          run_id: ${{ needs.setup.outputs.helper_run_id }}
          name: flavor-rust-helpers-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: ./helpers-dist

      - name: 📥 Download combined helpers (FreeBSD)
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v19
        with:
          workflow: 01-helper-prep.yml
          run_id: ${{ needs.setup.outputs.helper_run_id }}
          name: flavor-helpers-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: ./helpers-dist

      - name: 🔧 Build pretaster PSP
        shell: bash
        run: |
          # The dawidd6 action downloads the artifact contents (zip files) to helpers-dist/
          echo "Contents of helpers-dist:"
          ls -la helpers-dist/ || true
          
          # Extract the helper binaries
          ci/download-helpers.sh helpers-dist \
            "${{ needs.setup.outputs.version }}" \
            "${{ matrix.platform }}"
          
          # Build pretaster PSP using the consolidated script
          mkdir -p build
          ci/build-pretaster.sh \
            "${{ matrix.platform }}" \
            "${{ needs.setup.outputs.version }}" \
            "simple" \
            "build"
      
      - name: 📤 Upload pretaster PSP
        uses: actions/upload-artifact@v7
        with:
          name: pretaster-psp-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: build/pretaster-${{ needs.setup.outputs.version }}-${{ matrix.platform }}.*
      
      - name: 📤 Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pretaster-logs-${{ matrix.platform }}-${{ github.run_id }}
          path: tests/pretaster/logs/

      - name: 📤 Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-diagnostics-${{ matrix.platform }}-${{ github.run_id }}
          path: tests/pretaster/failure-diagnostics/

  validate:
    name: ✅ Validate PSPF Compatibility
    needs: [setup, test-pretaster, test-crosslang]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      
      - name: 📥 Download all logs
        uses: actions/download-artifact@v8
        with:
          pattern: '*-logs-*'
          path: all-logs
      
      - name: 📊 Generate compatibility report
        run: |
          ci/generate-pspf-compatibility-report.sh all-logs