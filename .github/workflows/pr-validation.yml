name: 🔍 PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quick checks that should fail fast
  quick-checks:
    name: 🚦 Quick Checks
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📦 Install UV
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      
      - name: 🎨 Format Check (Python)
        run: |
          uv pip install --system ruff
          ruff format --check src/ tests/
      
      - name: 🔍 Lint (Python)
        run: |
          ruff check src/ tests/
      
      - name: 📝 Check RELEASE_CHECKLIST.md todos
        run: |
          # Ensure no unchecked items in critical sections
          if grep -E "^\- \[ \] (All tests pass|Linting passes|Type checking passes)" RELEASE_CHECKLIST.md; then
            echo "⚠️ Found unchecked critical items in RELEASE_CHECKLIST.md"
            echo "Please ensure all critical checks are marked as complete before merging"
          fi

  # Build ingredients for changed platforms
  build-ingredients:
    name: 🔨 Build Ingredients
    runs-on: ${{ matrix.os }}
    if: |
      contains(github.event.head_commit.message, '[skip-ingredients]') == false &&
      (github.event_name == 'push' || 
       contains(toJson(github.event.pull_request.changed_files), 'ingredients/') ||
       contains(toJson(github.event.pull_request.changed_files), '.github/workflows/'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_amd64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
          - platform: linux_arm64
            os: ubuntu-latest
            rust_target: aarch64-unknown-linux-musl
          - platform: darwin_amd64
            os: macos-13
            rust_target: x86_64-apple-darwin
          - platform: darwin_arm64
            os: macos-15
            rust_target: aarch64-apple-darwin
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2024-12-01
          targets: ${{ matrix.rust_target }}
      
      - name: 🔧 Setup musl (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          
          # For ARM64 cross-compilation
          if [ "${{ matrix.platform }}" = "linux_arm64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            wget -q https://musl.cc/aarch64-linux-musl-cross.tgz
            tar -xzf aarch64-linux-musl-cross.tgz
            echo "$PWD/aarch64-linux-musl-cross/bin" >> $GITHUB_PATH
            echo "CC_aarch64_unknown_linux_musl=aarch64-linux-musl-gcc" >> $GITHUB_ENV
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-musl-gcc" >> $GITHUB_ENV
          fi
      
      - name: 🔨 Build ingredients
        run: |
          cd ingredients
          if [ "${{ matrix.platform }}" = "linux_amd64" ] || [ "${{ matrix.platform }}" = "linux_arm64" ]; then
            # Use build script for Linux to ensure static linking
            ./build.sh
          else
            # macOS builds
            make -C flavor-go build
            make -C flavor-rs build
          fi
      
      - name: 🧪 Verify static linking (Linux)
        if: runner.os == 'Linux' && matrix.platform == 'linux_amd64'
        run: |
          for binary in ingredients/bin/flavor-*-linux_amd64; do
            if [ -f "$binary" ]; then
              if file "$binary" | grep -q "statically linked"; then
                echo "✅ $(basename $binary) is statically linked"
              else
                echo "❌ $(basename $binary) is NOT statically linked"
                exit 1
              fi
            fi
          done
      
      - name: 📦 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ingredients-${{ matrix.platform }}
          path: ingredients/bin/*-${{ matrix.platform }}*
          retention-days: 7

  # Test binary compatibility across Linux distributions
  compatibility-test:
    name: 🐳 Compatibility Test
    needs: build-ingredients
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.message, '[skip-compat]') == false
    strategy:
      fail-fast: false
      matrix:
        distro:
          - { name: "CentOS 7", image: "centos:7", glibc: "2.17" }
          - { name: "Amazon Linux 2023", image: "amazonlinux:2023", glibc: "2.34" }
          - { name: "Ubuntu 22.04", image: "ubuntu:22.04", glibc: "2.35" }
          - { name: "Ubuntu 24.04", image: "ubuntu:24.04", glibc: "2.39" }
          - { name: "Alpine Latest", image: "alpine:latest", glibc: "musl" }
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 📦 Download Linux ingredients
        uses: actions/download-artifact@v4
        with:
          name: ingredients-linux_amd64
          path: ingredients/bin/
      
      - name: 🔧 Make binaries executable
        run: chmod +x ingredients/bin/*
      
      - name: 🐳 Test on ${{ matrix.distro.name }}
        run: |
          echo "Testing on ${{ matrix.distro.name }} (glibc ${{ matrix.distro.glibc }})"
          
          docker run --rm -v $PWD/ingredients/bin:/test ${{ matrix.distro.image }} sh -c '
            cd /test
            failed=0
            for binary in flavor-*-linux_amd64; do
              if [ -f "$binary" ]; then
                echo -n "Testing $binary: "
                if ./$binary --version >/dev/null 2>&1; then
                  echo "✅ PASS"
                else
                  echo "❌ FAIL"
                  failed=1
                fi
              fi
            done
            exit $failed
          '

  # Run pretaster validation
  pretaster-validation:
    name: 🔬 Pretaster Validation
    needs: build-ingredients
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-15]
        include:
          - os: ubuntu-latest
            platform: linux_amd64
          - os: macos-13
            platform: darwin_amd64
          - os: macos-15
            platform: darwin_arm64
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📦 Install UV
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      
      - name: 📦 Download ingredients
        uses: actions/download-artifact@v4
        with:
          name: ingredients-${{ matrix.platform }}
          path: ingredients/bin/
      
      - name: 🔧 Make binaries executable
        run: chmod +x ingredients/bin/*
      
      - name: 🔬 Run pretaster tests
        run: |
          cd helpers/pretaster
          
          # Install pretaster
          uv venv
          uv pip install -e .
          
          # Run combination tests
          ./tests/combination-tests.sh
      
      - name: 📊 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pretaster-results-${{ matrix.platform }}
          path: helpers/pretaster/test-results/
          retention-days: 7

  # Python tests with coverage
  python-tests:
    name: 🐍 Python Tests
    needs: build-ingredients
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-15]
        python: ['3.11', '3.12']
        include:
          - os: ubuntu-latest
            platform: linux_amd64
          - os: macos-13
            platform: darwin_amd64
          - os: macos-15
            platform: darwin_arm64
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      
      - name: 📦 Install UV
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      
      - name: 📦 Download ingredients
        uses: actions/download-artifact@v4
        with:
          name: ingredients-${{ matrix.platform }}
          path: ingredients/bin/
      
      - name: 🔧 Setup environment
        run: |
          chmod +x ingredients/bin/*
          source env.sh
          uv pip install -e ".[dev,test]"
      
      - name: 🧪 Run tests with coverage
        run: |
          source env.sh
          pytest tests/ \
            --cov=src/flavor \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            -v
      
      - name: 📊 Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python == '3.11' && matrix.os == 'ubuntu-latest'
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.os }}-py${{ matrix.python }}

  # Security scanning
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📦 Install UV
        uses: astral-sh/setup-uv@v5
      
      - name: 🔒 Run Bandit (Python)
        run: |
          uv pip install --system bandit[toml]
          bandit -r src/ -ll -i B101
      
      - name: 🔒 Run safety check
        run: |
          uv pip install --system safety
          uv pip freeze | safety check --stdin --bare || true
      
      - name: 🦀 Cargo audit (Rust)
        run: |
          cargo install cargo-audit
          cd ingredients/flavor-rs && cargo audit || true
      
      - name: 🐹 Go security scan
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          cd ingredients/flavor-go && gosec -fmt json -out gosec-results.json ./... || true

  # Final status check
  pr-status:
    name: ✅ PR Status
    needs: [quick-checks, build-ingredients, compatibility-test, pretaster-validation, python-tests, security-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📊 Check status
        run: |
          if [ "${{ needs.quick-checks.result }}" != "success" ] || \
             [ "${{ needs.build-ingredients.result }}" != "success" ] || \
             [ "${{ needs.compatibility-test.result }}" != "success" ] || \
             [ "${{ needs.pretaster-validation.result }}" != "success" ] || \
             [ "${{ needs.python-tests.result }}" != "success" ]; then
            echo "❌ PR validation failed"
            echo "Quick checks: ${{ needs.quick-checks.result }}"
            echo "Build ingredients: ${{ needs.build-ingredients.result }}"
            echo "Compatibility test: ${{ needs.compatibility-test.result }}"
            echo "Pretaster validation: ${{ needs.pretaster-validation.result }}"
            echo "Python tests: ${{ needs.python-tests.result }}"
            echo "Security scan: ${{ needs.security-scan.result }}"
            exit 1
          else
            echo "✅ All PR validation checks passed!"
          fi