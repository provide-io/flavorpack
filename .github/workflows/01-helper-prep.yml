name: 01 🥘 Helper Prep
# ─────────────────────────────────────────────────────────────────────────────
# Script policy: keep inline run: blocks to ≤ 3 lines.
# Anything longer belongs in ci/ and should be called from here.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (comma-separated, or "all")'
        type: string
        default: 'all'
        required: false

jobs:
  # ── Setup ──────────────────────────────────────────────────────────────────
  setup:
    name: 📊 Setup
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      cache_key_base: ${{ steps.cache.outputs.key_base }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 🔍 Get version
        id: version
        run: |
          VERSION=$(cat VERSION || echo "0.0.1")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

      - name: 🔑 Calculate cache key base
        id: cache
        run: |
          HELPERS_HASH=$(find src -type f -name "*.go" -o -name "*.rs" -o -name "Cargo.toml" -o -name "go.mod" | xargs sha256sum | sha256sum | cut -d' ' -f1 | head -c 16)
          echo "key_base=helpers-$HELPERS_HASH" >> $GITHUB_OUTPUT
          echo "🔑 Cache key base: helpers-$HELPERS_HASH"

      - name: 📋 Setup build matrix
        id: matrix
        run: |
          # Define all platforms as a single-line JSON.
          # In local act mode we keep this to linux_amd64 so the workflow stays executable.
          # FreeBSD platforms have dedicated jobs below; Windows is included here.
          if [ "${ACT:-}" = "true" ]; then
            ALL_PLATFORMS='[{"platform":"linux_amd64","os":"ubuntu-24.04","rust_target":"x86_64-unknown-linux-musl","use_musl":true,"emoji":"🐧"}]'
          else
            ALL_PLATFORMS='[{"platform":"linux_amd64","os":"ubuntu-24.04","rust_target":"x86_64-unknown-linux-musl","use_musl":true,"emoji":"🐧"},{"platform":"linux_arm64","os":"ubuntu-24.04-arm","rust_target":"aarch64-unknown-linux-musl","use_musl":true,"emoji":"🐧"},{"platform":"darwin_amd64","os":"macos-15-intel","rust_target":"x86_64-apple-darwin","use_musl":false,"emoji":"🍎"},{"platform":"darwin_arm64","os":"macos-15","rust_target":"aarch64-apple-darwin","use_musl":false,"emoji":"🍎"},{"platform":"windows_amd64","os":"windows-2022","rust_target":"x86_64-pc-windows-msvc","use_musl":false,"emoji":"🪟"},{"platform":"windows_arm64","os":"windows-11-arm","rust_target":"aarch64-pc-windows-msvc","use_musl":false,"emoji":"🪟"}]'
          fi

          PLATFORMS="${{ inputs.platforms }}"
          if [ "$PLATFORMS" = "all" ] || [ -z "$PLATFORMS" ]; then
            MATRIX="{\"include\":$ALL_PLATFORMS}"
          else
            FILTERED="[]"
            for platform in $(echo "$PLATFORMS" | tr ',' ' '); do
              PLATFORM_JSON=$(echo "$ALL_PLATFORMS" | jq -c ".[] | select(.platform == \"$platform\")")
              if [ -n "$PLATFORM_JSON" ]; then
                FILTERED=$(echo "$FILTERED" | jq -c ". + [$PLATFORM_JSON]")
              fi
            done
            MATRIX="{\"include\":$FILTERED}"
          fi

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "📋 Build matrix: $MATRIX"

  # ── Native platform builds (Linux, macOS, Windows) ─────────────────────────
  # Uses the reusable build-platform.yml workflow to avoid duplication.
  build:
    name: ${{ matrix.emoji }} ${{ matrix.platform }}
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: ${{ matrix.platform }}
      os: ${{ matrix.os }}
      rust_target: ${{ matrix.rust_target }}
      use_musl: ${{ matrix.use_musl }}
      version: ${{ needs.setup.outputs.version }}
      cache_key_base: ${{ needs.setup.outputs.cache_key_base }}

  # ── FreeBSD builds (QEMU VM via cross-platform-actions) ────────────────────
  # Separate dedicated jobs because these use a VM action rather than a native runner.
  # cross-platform-actions ships x86-64 QEMU binaries; all jobs run on ubuntu-24.04.
  # freebsd_arm64 is additionally run on ubuntu-24.04-arm to benchmark QEMU performance.
  build-freebsd-amd64:
    name: 😈 freebsd_amd64
    needs: setup
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 🏗️ Prep FreeBSD system
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: freebsd
          version: '14.2'
          architecture: x86-64
          shell: bash
          run: ci/freebsd-prep-system.sh

      - name: 🐹 Build Go helpers
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: freebsd
          version: '14.2'
          architecture: x86-64
          shell: bash
          sync-files: runner-to-vm
          run: ci/freebsd-build-go.sh ${{ needs.setup.outputs.version }} amd64

      - name: 🦀 Prep Rust
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: freebsd
          version: '14.2'
          architecture: x86-64
          shell: bash
          sync-files: runner-to-vm
          run: ci/freebsd-prep-rust.sh

      - name: 🔨 Build Rust helpers
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: freebsd
          version: '14.2'
          architecture: x86-64
          shell: bash
          sync-files: runner-to-vm
          run: ci/freebsd-build-rust.sh ${{ needs.setup.outputs.version }} amd64

      - name: 🧪 Test Go
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: freebsd
          version: '14.2'
          architecture: x86-64
          shell: bash
          sync-files: runner-to-vm
          run: ci/freebsd-test-go.sh

      - name: 📦 Package artifacts
        shell: bash
        run: ci/package-helpers.sh freebsd_amd64 ${{ needs.setup.outputs.version }}

      - name: 🧪 Test binaries
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p test-results
          ci/test-binaries.sh freebsd_amd64 dist/bin test-results

      - name: 📊 Generate metadata
        if: always()
        shell: bash
        run: |
          export PYTHONUTF8=1 PYTHONIOENCODING=utf-8
          python3 ci/test-metadata.py platform freebsd_amd64 ${{ needs.setup.outputs.version }} false

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: flavor-helpers-${{ needs.setup.outputs.version }}-freebsd_amd64
          path: artifacts/*.zip

      - name: 📤 Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-freebsd_amd64
          path: test-results/

      - name: 📤 Upload metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: metadata-freebsd_amd64
          path: artifacts/metadata/

  # freebsd_arm64 on x86 runner (QEMU full emulation — known working baseline)
  build-freebsd-arm64:
    name: 😈 freebsd_arm64 (x86 runner)
    needs: setup
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 🏗️ Prep FreeBSD system
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: freebsd
          version: '14.2'
          architecture: arm64
          shell: bash
          run: ci/freebsd-prep-system.sh

      - name: 🐹 Prep Go
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: freebsd
          version: '14.2'
          architecture: arm64
          shell: bash
          sync-files: runner-to-vm
          run: ci/freebsd-build-go.sh ${{ needs.setup.outputs.version }} arm64

      - name: 🦀 Prep Rust
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: freebsd
          version: '14.2'
          architecture: arm64
          shell: bash
          sync-files: runner-to-vm
          run: ci/freebsd-prep-rust.sh

      - name: 🔨 Build Rust helpers
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: freebsd
          version: '14.2'
          architecture: arm64
          shell: bash
          sync-files: runner-to-vm
          run: ci/freebsd-build-rust.sh ${{ needs.setup.outputs.version }} arm64

      - name: 🧪 Test Go
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: freebsd
          version: '14.2'
          architecture: arm64
          shell: bash
          sync-files: runner-to-vm
          run: ci/freebsd-test-go.sh

      - name: 📦 Package artifacts
        shell: bash
        run: ci/package-helpers.sh freebsd_arm64 ${{ needs.setup.outputs.version }}

      - name: 🧪 Test binaries
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p test-results
          ci/test-binaries.sh freebsd_arm64 dist/bin test-results

      - name: 📊 Generate metadata
        if: always()
        shell: bash
        run: |
          export PYTHONUTF8=1 PYTHONIOENCODING=utf-8
          python3 ci/test-metadata.py platform freebsd_arm64 ${{ needs.setup.outputs.version }} false

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: flavor-helpers-${{ needs.setup.outputs.version }}-freebsd_arm64
          path: artifacts/*.zip

      - name: 📤 Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-freebsd_arm64
          path: test-results/

      - name: 📤 Upload metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: metadata-freebsd_arm64
          path: artifacts/metadata/

  # freebsd_arm64 on arm64 runner (native KVM — benchmarking vs x86 runner above)
  # cross-platform-actions ships x86-64 QEMU binaries; this may fail — continue-on-error.
  build-freebsd-arm64-arm-runner:
    name: 😈 freebsd_arm64 (arm64 runner)
    needs: setup
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 🏗️ Prep FreeBSD system
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: freebsd
          version: '14.2'
          architecture: arm64
          shell: bash
          run: ci/freebsd-prep-system.sh

      - name: 🐹 Prep Go
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: freebsd
          version: '14.2'
          architecture: arm64
          shell: bash
          sync-files: runner-to-vm
          run: ci/freebsd-build-go.sh ${{ needs.setup.outputs.version }} arm64

      - name: 🦀 Prep Rust
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: freebsd
          version: '14.2'
          architecture: arm64
          shell: bash
          sync-files: runner-to-vm
          run: ci/freebsd-prep-rust.sh

      - name: 🔨 Build Rust helpers
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: freebsd
          version: '14.2'
          architecture: arm64
          shell: bash
          sync-files: runner-to-vm
          run: ci/freebsd-build-rust.sh ${{ needs.setup.outputs.version }} arm64

      - name: 🧪 Test Go
        uses: cross-platform-actions/action@v0.32.0
        with:
          operating_system: freebsd
          version: '14.2'
          architecture: arm64
          shell: bash
          sync-files: runner-to-vm
          run: ci/freebsd-test-go.sh

      - name: 📦 Package artifacts
        shell: bash
        run: ci/package-helpers.sh freebsd_arm64 ${{ needs.setup.outputs.version }}

      - name: 🧪 Test binaries
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p test-results
          ci/test-binaries.sh freebsd_arm64 dist/bin test-results

      - name: 📊 Generate metadata
        if: always()
        shell: bash
        run: |
          export PYTHONUTF8=1 PYTHONIOENCODING=utf-8
          python3 ci/test-metadata.py platform freebsd_arm64 ${{ needs.setup.outputs.version }} false

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: flavor-helpers-${{ needs.setup.outputs.version }}-freebsd_arm64-arm-runner
          path: artifacts/*.zip

      - name: 📤 Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-freebsd_arm64-arm-runner
          path: test-results/

      - name: 📤 Upload metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: metadata-freebsd_arm64-arm-runner
          path: artifacts/metadata/

  # ── Combine all artifacts ──────────────────────────────────────────────────
  combine:
    name: 📦 Combine & Validate
    needs: [setup, build, build-freebsd-amd64, build-freebsd-arm64, build-freebsd-arm64-arm-runner]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-artifacts

      - name: 🔀 Combine artifacts
        run: |
          mkdir -p final
          for platform_dir in all-artifacts/flavor-helpers-*; do
            [ -d "$platform_dir" ] && cp "$platform_dir"/*.zip final/ || true
          done
          cd final
          mkdir -p all-helpers
          for zip in *.zip; do
            [ -f "$zip" ] && unzip -o "$zip" -d all-helpers/
          done
          zip -r flavor-helpers-${{ needs.setup.outputs.version }}-all.zip all-helpers/
          cd ..
          echo "📦 Combined artifacts:"
          ls -la final/

      - name: 🧪 Combine test results
        run: |
          mkdir -p all-artifacts/test-results
          if [ -z "$(find all-artifacts -name '*test-report.json' -type f 2>/dev/null)" ]; then
            echo '{"platforms": {}, "summary": {"platforms_tested": 0, "total_tests": 0, "passed": 0, "failed": 0}}' > final/test-report.json
          else
            export PYTHONUTF8=1 PYTHONIOENCODING=utf-8
            python3 ci/test-metadata.py combine all-artifacts final/test-report.json
          fi

      - name: 📊 Generate summary
        run: |
          export PYTHONUTF8=1 PYTHONIOENCODING=utf-8
          python3 ci/test-metadata.py summary final/test-report.json ${{ needs.setup.outputs.version }}

      - name: 📤 Upload combined artifacts
        uses: actions/upload-artifact@v7
        with:
          name: flavor-helpers-${{ needs.setup.outputs.version }}-all
          path: |
            final/*.zip
            final/*.json
