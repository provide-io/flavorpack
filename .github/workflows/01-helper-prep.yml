name: 01 🥘 Helper Prep

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (comma-separated, or "all")'
        type: string
        default: 'all'
        required: false

jobs:
  setup:
    name: 📊 Setup
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      cache_key_base: ${{ steps.cache.outputs.key_base }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🔍 Get version
        id: version
        run: |
          VERSION=$(cat VERSION || echo "0.0.1")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"
      
      - name: 🔑 Calculate cache key base
        id: cache
        run: |
          HELPERS_HASH=$(find src -type f -name "*.go" -o -name "*.rs" -o -name "Cargo.toml" -o -name "go.mod" | xargs sha256sum | sha256sum | cut -d' ' -f1 | head -c 16)
          echo "key_base=helpers-$HELPERS_HASH" >> $GITHUB_OUTPUT
          echo "🔑 Cache key base: helpers-$HELPERS_HASH"
      
      - name: 📋 Setup build matrix
        id: matrix
        run: |
          MATRIX=$(bash .github/scripts/create-helper-matrix.sh "${{ inputs.platforms || 'all' }}")
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "📋 Build matrix: $MATRIX"

  build:
    name: 🔨 Build ${{ matrix.platform }}
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 💾 Cache helpers
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            dist/bin/*-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
            dist/bin/*-${{ needs.setup.outputs.version }}-${{ matrix.platform }}.exe
            artifacts/*.zip
          key: ${{ needs.setup.outputs.cache_key_base }}-${{ matrix.platform }}-${{ needs.setup.outputs.version }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🐹 Setup Go
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: src/flavor-go/go.sum
      
      - name: 🦀 Setup Rust
        if: steps.cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2024-12-01
          targets: ${{ matrix.rust_target }}
          components: rustfmt, clippy
      
      - name: 🔧 Setup musl toolchain (Linux)
        if: steps.cache.outputs.cache-hit != 'true' && matrix.use_musl && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      
      - name: 🧹 Clean and setup
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          rm -rf dist/bin
          mkdir -p dist/bin

      - name: 🐹 Build Go helpers
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: .github/scripts/build-go-helpers.sh "${{ matrix.platform }}" "${{ needs.setup.outputs.version }}" "dist/bin"

      - name: 🦀 Build Rust helpers
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: .github/scripts/build-rust-helpers.sh "${{ matrix.platform }}" "${{ matrix.rust_target }}" "${{ needs.setup.outputs.version }}" "dist/bin"

      - name: ✅ Finalize build
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          chmod +x dist/bin/* 2>/dev/null || true
          echo "✅ Build complete for ${{ matrix.platform }}"
          ls -la dist/bin/*-${{ matrix.platform }}*

      - name: 📦 Package artifacts
        shell: bash
        run: .github/scripts/package-artifacts.sh "${{ needs.setup.outputs.version }}" "${{ matrix.platform }}"

      - name: 🧪 Test binaries
        continue-on-error: true
        shell: bash
        run: .github/scripts/test-binaries.sh "${{ matrix.platform }}" dist/bin test-results

      - name: 📊 Generate metadata
        if: always()
        shell: bash
        run: |
          export PYTHONUTF8=1
          export PYTHONIOENCODING=utf-8
          python3 .github/scripts/test-metadata.py platform "${{ matrix.platform }}" "${{ needs.setup.outputs.version }}" "${{ steps.cache.outputs.cache-hit }}"
      
      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flavor-helpers-${{ needs.setup.outputs.version }}-${{ matrix.platform }}
          path: artifacts/*.zip
      
      - name: 📤 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.platform }}
          path: test-results/
      
      - name: 📤 Upload metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-${{ matrix.platform }}
          path: artifacts/metadata/

  combine:
    name: 📦 Combine & Validate
    needs: [setup, build]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
      
      - name: 🔀 Combine artifacts
        run: .github/scripts/combine-helper-artifacts.sh "${{ needs.setup.outputs.version }}" "all-artifacts" "final"
      
      - name: 🧪 Combine test results
        run: .github/scripts/combine-test-results.sh "all-artifacts" "final/test-report.json"
      
      - name: 📊 Generate summary
        run: .github/scripts/generate-build-summary.sh "${{ needs.setup.outputs.version }}" "final/test-report.json"
      
      - name: 📤 Upload combined artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flavor-helpers-${{ needs.setup.outputs.version }}-all
          path: |
            final/*.zip
            final/*.json
