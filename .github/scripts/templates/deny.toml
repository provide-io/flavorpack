# cargo-deny configuration for license checking
# See: https://embarkstudios.github.io/cargo-deny/

[licenses]
# Deny packages without a license
unlicensed = "deny"

# List of allowed licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "CC0-1.0",
]

# Warn about copyleft licenses
copyleft = "warn"

# Explicitly deny these licenses
deny = [
    "GPL-2.0",
    "GPL-3.0",
    "AGPL-3.0",
    "LGPL-2.0",
    "LGPL-2.1",
    "LGPL-3.0",
]

# Allow specific exceptions
[[licenses.exceptions]]
allow = ["Unicode-DFS-2016"]
name = "unicode-ident"

[bans]
# Warn about multiple versions of the same crate
multiple-versions = "warn"
# Allow wildcard dependencies
wildcards = "allow"

[sources]
# Warn about unknown registries
unknown-registry = "warn"
# Warn about unknown git sources
unknown-git = "warn"
