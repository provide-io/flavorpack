[extend]
useDefault = true

[allowlist]
description = "Intentional test key material and generated build artifacts"
paths = [
    # Ed25519 test keys used in unit/integration tests — not real secrets
    '''tests/packaging/test_keys\.py''',
    '''tests/pretaster/configs/keys/''',
    '''tests/taster/configs/keys/''',
    '''tests/taster/keys/''',
    # Deterministic key seed constant in Go builder tests
    '''src/flavor-go/pkg/psp/format_2025/builder\.go''',
    '''src/flavor-go-bf\.txt''',
]
