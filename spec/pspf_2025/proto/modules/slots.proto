// PSPF/2025 Slot System Specification
// Defines slot structure, lifecycle, and metadata
syntax = "proto3";

package pspf_2025.slots;

option go_package = "github.com/provide-io/flavorpack/psp/format_2025;pspf2025";
option java_package = "io.provide.flavorpack.pspf2025";

import "modules/operations.proto";

// Lifecycle types for slot loading behavior
enum Lifecycle {
  LIFECYCLE_INIT = 0;       // Pre-verification initialization (PVP)
  LIFECYCLE_EAGER = 1;      // Extract before execution
  LIFECYCLE_STARTUP = 2;    // Extract at startup
  LIFECYCLE_RUNTIME = 3;    // Extract on first use
  LIFECYCLE_MANUAL = 4;     // Extract only when requested
  LIFECYCLE_VOLATILE = 5;   // Memory-only, never extracted
  LIFECYCLE_EPHEMERAL = 6;  // Temporary, cleaned after use
  LIFECYCLE_PERSISTENT = 7; // Permanent extraction
  LIFECYCLE_CACHED = 8;     // Cache with TTL
  LIFECYCLE_LAZY = 9;       // Defer until absolutely needed
  LIFECYCLE_PRELOAD = 10;   // Load into memory but don't extract
  
  // JIT lifecycle types (FEP-0005)
  LIFECYCLE_JIT_LOCAL = 11;    // Load from package on demand
  LIFECYCLE_JIT_NETWORK = 12;  // Load from network on demand
  LIFECYCLE_JIT_HYBRID = 13;   // Try local, fall back to network
  LIFECYCLE_JIT_OPTIONAL = 14; // Load only if explicitly used
  LIFECYCLE_JIT_BACKGROUND = 15; // Load in background after start
}

// Purpose classification for slots
enum Purpose {
  PURPOSE_CODE = 0;        // Executable code
  PURPOSE_DATA = 1;        // Application data
  PURPOSE_CONFIG = 2;      // Configuration files
  PURPOSE_ASSETS = 3;      // Static assets
  PURPOSE_RUNTIME = 4;     // Language runtime
  PURPOSE_LIBRARY = 5;     // Shared libraries
  PURPOSE_METADATA = 6;    // Package metadata
  PURPOSE_DOCS = 7;        // Documentation
  PURPOSE_TESTS = 8;       // Test files
  PURPOSE_TOOLS = 9;       // Build/dev tools
  PURPOSE_VENDOR = 10;     // Vendored dependencies
  PURPOSE_CACHE = 11;      // Cached data
  PURPOSE_TEMP = 12;       // Temporary files
  PURPOSE_LOGS = 13;       // Log files
  PURPOSE_STATE = 14;      // Application state
  PURPOSE_SECRETS = 15;    // Encrypted secrets
}

// Platform hints for optimization
enum Platform {
  PLATFORM_ANY = 0;        // Platform-agnostic
  PLATFORM_LINUX = 1;      // Linux-specific
  PLATFORM_DARWIN = 2;     // macOS-specific
  PLATFORM_WINDOWS = 3;    // Windows-specific
  PLATFORM_BSD = 4;        // BSD-specific
  PLATFORM_WASM = 5;       // WebAssembly
  PLATFORM_ANDROID = 6;    // Android
  PLATFORM_IOS = 7;        // iOS
}

// Slot entry definition
message SlotEntry {
  // Identity fields (frequently used - low field numbers)
  uint32 id = 1;                    // Slot identifier
  uint64 name_hash = 2;             // xxHash64 of slot name
  
  // Location fields
  uint64 offset = 3;                // File offset to slot data
  uint64 size = 4;                  // Size of stored data
  uint64 original_size = 5;         // Uncompressed size
  
  // Operation chain (packed 64-bit)
  uint64 operations = 6;            // Packed operation chain
  
  // Integrity
  uint32 checksum = 7;              // Adler-32 of stored data
  bytes hash = 8;                   // Optional SHA-256 hash
  
  // Classification
  Purpose purpose = 9;              // Purpose classification
  Lifecycle lifecycle = 10;         // Lifecycle management
  Platform platform = 11;           // Platform hint
  
  // Permissions and attributes
  uint32 permissions = 12;          // Unix-style permissions
  uint32 flags = 13;                // Slot-specific flags
  
  // JIT configuration (FEP-0005)
  JITConfig jit = 14;               // JIT loading configuration
  
  // Extended metadata
  string name = 20;                 // Human-readable name
  string source_path = 21;          // Original source path
  string target_path = 22;          // Target extraction path
  map<string, string> metadata = 23; // Additional metadata
}

// JIT loading configuration (FEP-0005)
message JITConfig {
  // Source configuration
  message Source {
    string type = 1;        // http, grpc, s3, webdav, custom
    string endpoint = 2;    // Network endpoint
    string path = 3;        // Resource path
    bool tls = 4;          // Use TLS
    string cert_pin = 5;    // Certificate pinning
  }
  
  // Cache configuration
  message Cache {
    string strategy = 1;    // persistent, temporal, size-bound, versioned
    uint32 ttl = 2;        // Time-to-live in seconds
    bool verify_on_load = 3; // Verify integrity on load
  }
  
  Source source = 1;
  Cache cache = 2;
  uint32 priority = 3;      // Loading priority (1-10)
  uint32 timeout_ms = 4;    // Network timeout
}

// Slot table containing all slots
message SlotTable {
  repeated SlotEntry slots = 1;     // All slots in package
  uint32 slot_count = 2;           // Number of slots
  uint64 total_size = 3;           // Total size of all slots
  uint32 table_checksum = 4;       // Adler-32 of entire table
  
  // Table metadata
  uint32 version = 5;              // Table format version
  uint64 created_at = 6;           // Creation timestamp
  map<string, string> metadata = 7; // Additional metadata
}

// Slot table containing all slots
message SlotTable {
  repeated SlotEntry slots = 1;     // All slots in package
  uint32 slot_count = 2;           // Number of slots
  uint64 total_size = 3;           // Total size of all slots
  uint32 table_checksum = 4;       // Adler-32 of entire table
  
  // Table metadata
  uint32 version = 5;              // Table format version
  uint64 created_at = 6;           // Creation timestamp
  map<string, string> metadata = 7; // Additional metadata
}