// PSPF/2025 Staged Payload Architecture Specification
// Implements FEP-0007: Staged Payload Architecture
syntax = "proto3";

package pspf_2025.spa;

option go_package = "github.com/provide-io/flavorpack/psp/format_2025;pspf2025";
option java_package = "io.provide.flavorpack.pspf2025";

// SPA system-wide configuration
message SPASystemConfig {
  bool enabled = 1;                        // SPA enabled
  uint32 pvp_slot = 2;                    // Pre-Verification Payload slot ID
  uint32 pvp_timeout_ms = 3;              // PVP execution timeout
  uint64 pvp_max_memory = 4;              // PVP memory limit in bytes
  repeated Capability pvp_capabilities = 5; // PVP capabilities
  
  // Verification boundary configuration
  BoundaryConfig boundary = 6;
  
  // Sandbox configuration
  SandboxConfig sandbox = 7;
  
  // Performance metrics
  PerformanceTargets targets = 8;
}

// PVP capabilities
enum Capability {
  CAPABILITY_NONE = 0;          // No capabilities
  CAPABILITY_UI_RENDER = 1;     // Display user interface
  CAPABILITY_TEMP_FILES = 2;    // Temporary file access
  CAPABILITY_IPC_SETUP = 3;     // Inter-process communication
  CAPABILITY_CACHE_INIT = 4;    // Initialize caches
  CAPABILITY_CONFIG_LOAD = 5;   // Load default configuration
  CAPABILITY_MEMORY_MAP = 6;    // Memory mapping
  CAPABILITY_THREAD_SPAWN = 7;  // Limited threading
  CAPABILITY_SIGNAL_HANDLE = 8; // Signal handling
}

// Verification boundary configuration
message BoundaryConfig {
  enum BoundaryType {
    BOUNDARY_SYNCHRONOUS = 0;   // Synchronous wait
    BOUNDARY_ASYNC = 1;          // Asynchronous notification
    BOUNDARY_POLLING = 2;        // Polling-based
  }
  
  BoundaryType type = 1;
  uint32 timeout_ms = 2;         // Boundary wait timeout
  
  // IPC mechanism
  IPCConfig ipc = 3;
}

// IPC configuration
message IPCConfig {
  enum IPCType {
    IPC_SHARED_MEMORY = 0;    // Shared memory page
    IPC_UNIX_SOCKET = 1;      // Unix domain socket
    IPC_NAMED_PIPE = 2;       // Named pipe
    IPC_SEMAPHORE = 3;        // System semaphore
    IPC_EVENTFD = 4;          // Linux eventfd
    IPC_MACH_PORT = 5;        // macOS Mach port
  }
  
  IPCType type = 1;
  string path = 2;              // Socket/pipe path
  uint32 buffer_size = 3;       // IPC buffer size
  bool bidirectional = 4;       // Two-way communication
}

// Sandbox configuration
message SandboxConfig {
  enum SandboxType {
    SANDBOX_NONE = 0;         // No sandboxing (unsafe)
    SANDBOX_SECCOMP = 1;      // Linux seccomp-bpf
    SANDBOX_NAMESPACE = 2;    // Linux namespaces
    SANDBOX_APPCONTAINER = 3; // Windows AppContainer
    SANDBOX_MAC_SANDBOX = 4;  // macOS sandbox-exec
    SANDBOX_PLEDGE = 5;       // OpenBSD pledge
    SANDBOX_CAPSICUM = 6;     // FreeBSD Capsicum
  }
  
  SandboxType type = 1;
  repeated string allowed_syscalls = 2;   // Allowed system calls
  repeated string blocked_syscalls = 3;   // Blocked system calls
  
  // Resource limits
  ResourceLimits limits = 4;
  
  // Filesystem restrictions
  FilesystemRestrictions fs = 5;
}

// Resource limits for PVP
message ResourceLimits {
  uint64 memory_bytes = 1;      // Memory limit
  uint32 cpu_percent = 2;        // CPU percentage limit
  uint32 file_handles = 3;       // Max file handles
  uint32 threads = 4;            // Max threads
  uint32 processes = 5;          // Max processes
  uint64 disk_bytes = 6;         // Disk usage limit
  uint32 network_connections = 7; // Max network connections (usually 0)
}

// Filesystem restrictions
message FilesystemRestrictions {
  repeated string allowed_paths = 1;    // Allowed path prefixes
  repeated string blocked_paths = 2;    // Blocked path prefixes
  bool temp_only = 3;                   // Only allow temp directory
  bool read_only = 4;                   // Read-only access
  string temp_prefix = 5;                // Temp directory prefix
}

// Performance targets
message PerformanceTargets {
  uint32 time_to_first_pixel_ms = 1;    // Target time to UI
  uint32 verification_duration_ms = 2;   // Target verification time
  uint32 boundary_wait_ms = 3;          // Max boundary wait
  uint32 total_startup_ms = 4;          // Total startup target
}

// Verification state for IPC
message VerificationState {
  fixed32 magic = 1;            // 0x53504156 ('SPAV')
  uint32 version = 2;           // Protocol version
  State state = 3;              // Current state
  uint32 error_code = 4;        // Error code if failed
  bytes metadata_hash = 5;      // SHA-256 of metadata
  uint64 timestamp = 6;         // Completion timestamp
  
  enum State {
    STATE_PENDING = 0;        // Verification pending
    STATE_VERIFIED = 1;       // Successfully verified
    STATE_FAILED = 2;         // Verification failed
  }
}

// PVP handshake messages
message HandshakeMessage {
  enum Type {
    TYPE_READY = 0;           // PVP ready
    TYPE_ACK = 1;             // Acknowledgment
    TYPE_AT_BOUNDARY = 2;     // At verification boundary
    TYPE_VERIFIED = 3;        // Verification complete
    TYPE_FAILED = 4;          // Verification failed
    TYPE_PROCEEDING = 5;      // Continuing execution
    TYPE_TERMINATING = 6;     // Terminating PVP
  }
  
  Type type = 1;
  uint32 pid = 2;              // Process ID
  uint64 nonce = 3;            // Handshake nonce
  bytes hash = 4;              // Relevant hash
  uint32 error = 5;            // Error code
}

// Failure handling configuration
message FailureHandling {
  enum FailureMode {
    FAILURE_PVP_TIMEOUT = 0;     // PVP execution timeout
    FAILURE_PVP_CRASH = 1;       // PVP process crashed
    FAILURE_VERIFY_FAIL = 2;     // Verification failed
    FAILURE_SANDBOX_BREACH = 3;  // Sandbox violation
    FAILURE_RESOURCE_EXCEED = 4; // Resource limit exceeded
  }
  
  message FailureAction {
    FailureMode mode = 1;
    Action action = 2;
    bool log_details = 3;
    bool cleanup_resources = 4;
    
    enum Action {
      ACTION_KILL_PVP = 0;       // Kill PVP process
      ACTION_CONTINUE = 1;        // Continue normally
      ACTION_TERMINATE = 2;       // Terminate entire package
      ACTION_RETRY = 3;           // Retry PVP execution
    }
  }
  
  repeated FailureAction actions = 1;
  bool graceful_degradation = 2;   // Enable graceful degradation
}

// Platform-specific implementation hints
message PlatformImplementation {
  enum Platform {
    PLATFORM_LINUX = 0;
    PLATFORM_MACOS = 1;
    PLATFORM_WINDOWS = 2;
    PLATFORM_BSD = 3;
  }
  
  Platform platform = 1;
  SandboxConfig.SandboxType sandbox = 2;
  IPCConfig.IPCType ipc = 3;
  repeated string required_features = 4;  // Required OS features
  string min_version = 5;                 // Minimum OS version
}