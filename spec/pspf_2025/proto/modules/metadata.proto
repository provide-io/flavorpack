syntax = "proto3";

package flavor.psp.format_2025;

import "modules/slots.proto";

// Package metadata (implements FEP-0001 Section 5)
message PackageMetadata {
  // Basic package information
  string name = 1;                    // Package name
  string version = 2;                 // Package version
  string format_version = 3;          // PSPF format version (e.g., "2025.1")
  string description = 4;             // Package description
  string author = 5;                  // Package author
  string license = 6;                 // License identifier
  
  // Slot definitions
  repeated SlotMetadata slots = 7;    // All slot metadata
  
  // Execution configuration
  ExecutionConfig execution = 8;      // How to execute package
  
  // Build information
  BuildInfo build = 9;                // Build metadata
  
  // Dependencies and requirements
  repeated Dependency dependencies = 10; // Package dependencies
  Requirements requirements = 11;      // System requirements
  
  // Extensions (for advanced features)
  SpaConfig spa = 16;                 // Staged Payload Architecture (FEP-0004)
  JitConfig jit = 17;                 // JIT Loading configuration (FEP-0005)
  
  // Custom metadata
  map<string, string> custom = 20;    // Custom key-value metadata
  
  // Timestamps
  uint64 created_at = 21;             // Creation timestamp
  uint64 modified_at = 22;            // Last modification timestamp
}

// Execution configuration
message ExecutionConfig {
  string command = 1;                 // Primary command
  repeated string args = 2;           // Command arguments
  map<string, string> env = 3;        // Environment variables
  string working_dir = 4;             // Working directory
  string interpreter = 5;             // Interpreter path
  repeated string python_path = 6;    // Python path entries
  uint32 timeout_seconds = 7;         // Execution timeout
}

// Build information
message BuildInfo {
  uint64 timestamp = 1;               // Build timestamp
  string machine = 2;                 // Build machine
  string user = 3;                    // Build user
  string commit = 4;                  // Source commit hash
  string branch = 5;                  // Source branch
  repeated string tags = 6;           // Build tags
  string builder_version = 7;         // Builder tool version
  map<string, string> environment = 8; // Build environment
}

// Package dependency
message Dependency {
  string name = 1;                    // Dependency name
  string version_spec = 2;            // Version specification
  string source = 3;                  // Source (pip, conda, etc.)
  bool optional = 4;                  // Optional dependency
  repeated string extras = 5;         // Extras to install
}

// System requirements
message Requirements {
  string python_version = 1;          // Required Python version
  string platform = 2;                // Target platform
  string architecture = 3;            // Target architecture
  uint64 memory_mb = 4;               // Memory requirement (MB)
  uint64 disk_mb = 5;                 // Disk space requirement (MB)
  repeated string system_packages = 6; // Required system packages
}

// Staged Payload Architecture configuration (FEP-0004)
message SpaConfig {
  bool enabled = 1;                   // SPA enabled
  uint32 pvp_slot = 2;               // PVP slot number
  uint32 pvp_timeout_ms = 3;         // PVP timeout
  uint64 pvp_max_memory = 4;         // PVP memory limit
  repeated string pvp_capabilities = 5; // PVP capabilities
  string boundary_type = 6;           // Boundary synchronization type
  uint32 boundary_timeout_ms = 7;     // Boundary timeout
}

// JIT Loading configuration (FEP-0005)
message JitConfig {
  bool enabled = 1;                   // JIT enabled
  string strategy = 2;                // Loading strategy
  string cache_dir = 3;               // Cache directory
  uint64 max_cache_size = 4;          // Maximum cache size
  uint32 network_timeout_ms = 5;      // Network timeout
  repeated uint32 background_slots = 6; // Slots to load in background
}