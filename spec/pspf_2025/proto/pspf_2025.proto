syntax = "proto3";

package flavor.psp.format_2025;

option python_package = "flavor.psp.format_2025.models";
option go_package = "github.com/provide-io/flavorpack/ingredients/flavor-go/pkg/psp/format_2025/models";

// Import all module definitions
import "modules/common.proto";
import "modules/operations.proto"; 
import "modules/slots.proto";
import "modules/index.proto";
import "modules/metadata.proto";
import "modules/crypto.proto";

// Complete PSPF package definition
message PSPFPackage {
  // Core index block (implements FEP-0001)
  IndexBlock index = 1;
  
  // Package metadata (implements FEP-0001)
  PackageMetadata metadata = 2;
  
  // All slots in package (implements FEP-0001, FEP-0002)
  repeated SlotEntry slots = 3;
  
  // Cryptographic information (implements FEP-0007)
  CryptoInfo crypto = 4;
  
  // Execution configuration
  ExecutionConfig execution = 5;
}