syntax = "proto3";

package flavor.psp.format_2025;

option python_package = "flavor.archive.proto";
option go_package = "github.com/provide-io/flavorpack/archive";

// Archive Operation Types - Fixed values for compatibility
// Each operation is an atomic transformation
enum Operation {
  // No operation
  OP_NONE = 0x00;
  
  // BUNDLE operations (0x01-0x0F) - Combine multiple files
  BUNDLE_TAR = 0x01;       // POSIX TAR archive
  BUNDLE_ZIP = 0x02;       // ZIP archive container
  BUNDLE_CPIO = 0x03;      // CPIO archive
  BUNDLE_AR = 0x04;        // AR archive (deb packages)
  // 0x05-0x0F reserved for future bundlers
  
  // COMPRESS operations (0x10-0x2F) - Reduce size
  COMPRESS_DEFLATE = 0x10;  // Raw DEFLATE algorithm
  COMPRESS_GZIP = 0x11;      // GZIP (DEFLATE + headers)
  COMPRESS_BZIP2 = 0x12;     // BZIP2 compression
  COMPRESS_XZ = 0x13;        // XZ/LZMA2 compression
  COMPRESS_ZSTD = 0x14;      // Zstandard (fast + good ratio)
  COMPRESS_LZ4 = 0x15;       // LZ4 (very fast)
  COMPRESS_BROTLI = 0x16;    // Brotli (web-optimized)
  COMPRESS_SNAPPY = 0x17;    // Snappy (Google, very fast)
  // 0x18-0x2F reserved for future compressors
  
  // ENCRYPT operations (0x30-0x3F) - Secure data
  ENCRYPT_AES256 = 0x30;     // AES-256-GCM
  ENCRYPT_CHACHA20 = 0x31;   // ChaCha20-Poly1305
  ENCRYPT_ZIPCRYPTO = 0x32;  // Legacy ZIP encryption
  ENCRYPT_GPG = 0x33;        // GPG/PGP encryption
  // 0x34-0x3F reserved for future encryption
  
  // ENCODE operations (0x40-0x4F) - Transform encoding
  ENCODE_BASE64 = 0x40;      // Base64 encoding
  ENCODE_HEX = 0x41;         // Hexadecimal encoding
  ENCODE_ASCII85 = 0x42;     // ASCII85 encoding
  // 0x43-0x4F reserved for future encodings
  
  // ZIP compound operations (0x50-0x5F) - ZIP with specific methods
  ZIP_STORE = 0x50;          // ZIP with no compression
  ZIP_DEFLATE = 0x51;        // ZIP with DEFLATE compression
  ZIP_BZIP2 = 0x52;          // ZIP with BZIP2
  ZIP_LZMA = 0x53;           // ZIP with LZMA
  ZIP_ENCRYPTED = 0x54;      // ZIP with encryption
  // 0x55-0x5F reserved for ZIP variants
  
  // Other compound formats (0x60-0x6F)
  SEVENZ_LZMA = 0x60;        // 7-Zip with LZMA
  RAR_V5 = 0x61;             // RAR version 5
  // 0x62-0x6F reserved
  
  // 0x70-0x7F: Reserved for future use
  // 0x80-0xFF: User-defined operations
}

// Slot entry in a package
message SlotEntry {
  // Required fields (use low numbers for efficiency)
  uint32 id = 1;              // Slot identifier
  uint64 offset = 2;          // Offset in file
  uint64 size = 3;            // Size as stored
  uint64 operations = 4;      // Packed operation chain (up to 8 ops)
  
  // Optional fields
  uint64 original_size = 16;  // Uncompressed size
  fixed32 checksum = 17;      // Adler-32 or CRC32
  uint32 permissions = 18;    // Unix permissions
  
  // Operation parameters (per-operation config)
  map<uint32, bytes> operation_params = 20;
}

// Package metadata
message PackageMetadata {
  string name = 1;            // Package name
  string version = 2;         // Version string
  repeated SlotEntry slots = 3;  // All slots
  
  // Execution configuration
  string command = 4;         // Primary command
  repeated string args = 5;   // Command arguments
  
  // Optional metadata
  string description = 16;
  string author = 17;
  map<string, string> env = 18;  // Environment variables
  uint64 created_at = 19;        // Timestamp
}

// Compact index block (256 bytes when serialized)
message IndexBlock {
  fixed32 magic = 1;          // 0x46534850 "PSPF"
  fixed32 version = 2;         // Format version
  fixed64 package_size = 3;    // Total file size
  fixed64 launcher_size = 4;   // Launcher executable size
  fixed32 metadata_offset = 5; // Offset to metadata
  fixed32 metadata_size = 6;   // Size of metadata
  
  // Signature and verification
  bytes signature = 7;         // Ed25519 signature (64 bytes)
  bytes public_key = 8;        // Ed25519 public key (32 bytes)
  
  // Checksums
  fixed32 metadata_crc = 9;    // CRC32 of metadata
  fixed32 index_crc = 10;      // CRC32 of this index
  
  // Capabilities and flags
  fixed64 capabilities = 11;   // Feature flags
  
  // Reserved for future use
  bytes reserved = 15;         // Padding to 256 bytes
}