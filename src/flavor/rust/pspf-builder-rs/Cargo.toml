[package]
name = "pspf-builder-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
pspf-common = { path = "../pspf-common" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
flate2 = "1.0"
sha2 = "0.10"
adler = "1.0"
rand = "0.8"
anyhow = "1.0"
bincode = "1.3"
chrono = "0.4"
gethostname = "0.5"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
pem = "3.0"
