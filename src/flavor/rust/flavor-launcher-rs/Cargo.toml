[package]
name = "flavor-launcher-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Flavor (Progressive Secure Package Format) launcher written in Rust"
authors = ["Pyvider Team"]

[[bin]]
name = "flavor-launcher-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
flate2 = "1.0"
tar = "0.4"
env_logger = "0.11"
log = "0.4"
anyhow = "1.0"
thiserror = "1.0"
dirs = "5.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
