[package]
name = "flavor-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sha2 = "0.10"
tempfile = "3"
flavor-rs = { package = "flavor", path = ".." }

[workspace]
members = ["."]

[[bin]]
name = "pspf_operations_roundtrip"
path = "fuzz_targets/pspf_operations_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pspf_reader_no_panic"
path = "fuzz_targets/pspf_reader_no_panic.rs"
test = false
doc = false
bench = false
