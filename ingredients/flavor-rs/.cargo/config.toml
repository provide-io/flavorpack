# Cargo configuration for musl targets
# Note: These settings are primarily for CI builds.
# For local development, the linker will be set via environment variables if needed.

# The linker settings below are commented out by default to avoid build failures
# when musl tools are not installed. They will be activated via environment
# variables in CI or when explicitly building for musl targets.

# [target.x86_64-unknown-linux-musl]
# linker = "musl-gcc"

# [target.aarch64-unknown-linux-musl]
# linker = "aarch64-linux-musl-gcc"