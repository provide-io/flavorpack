project_name = "flavorpack"
version = "0.1.0"

# ==============================================================================
# Tasks
# ==============================================================================

[tasks]
typecheck = "mypy src/"
build = "uv build"

[tasks.setup]
_default = "uv sync"
pre-commit = """
if ! command -v pre-commit >/dev/null 2>&1; then
  echo "Installing pre-commit..."
  uv pip install pre-commit
fi
if [ ! -f .pre-commit-config.yaml ]; then
  echo "Installing standard pre-commit config..."
  if [ -f ../ci-tooling/configs/pre-commit-config.yaml ]; then
    cp ../ci-tooling/configs/pre-commit-config.yaml .pre-commit-config.yaml
  else
    echo "Warning: ci-tooling/configs/pre-commit-config.yaml not found"
    echo "Please ensure ci-tooling is cloned at ../ci-tooling"
    exit 1
  fi
fi
pre-commit install
pre-commit install --hook-type commit-msg
echo "✓ Pre-commit hooks installed"

"""

[tasks.lint]
_default = "ruff check ."
fix = "ruff check . --fix"

[tasks.format]
_default = "ruff format ."
check = "ruff format . --check"

[tasks.test]
_default = "pytest tests/"
unit = "pytest -m unit"
integration = "pytest -m integration"
cross_language = "pytest -m cross_language"
security = "pytest -m security"
fast = "pytest tests/ -x"
parallel = "pytest -n auto"
verbose = "pytest -vvv"

[tasks.test.coverage]
_default = "pytest --cov=flavor --cov-report=html --cov-report=term-missing tests/"
run = "pytest --cov=flavor --cov-report=term-missing tests/"
xml = "pytest --cov=flavor --cov-report=xml --cov-report=term tests/"

[tasks.mutation]
_default = "mutmut run"
results = "mutmut results"
browse = "mutmut browse"
clean = "rm -rf .mutmut-cache html/"

[tasks.quality]
_default = ["lint", "typecheck"]
all = ["format.check", "lint", "typecheck", "test"]

[tasks.ci]
_default = ["quality", "test", "build"]
test = ["test.parallel", "test.coverage"]
quality = ["format.check", "lint", "typecheck"]

[tasks.pkg]
install = "uv pip install -e ."
uninstall = "uv pip uninstall -y flavorpack"
lock = "uv lock"
version = "cat VERSION 2>/dev/null || grep '^version = ' pyproject.toml | cut -d'\"' -f2"

[tasks.clean]
run = """
rm -rf build/ dist/ *.egg-info src/flavor.egg-info .pytest_cache .mypy_cache .ruff_cache .hypothesis htmlcov/ .coverage .mutmut-cache site/
find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
find . -type f -name '*.pyc' -delete 2>/dev/null || true
find . -type f -name '*.pyo' -delete 2>/dev/null || true

"""

[tasks.docs]
_default = "mkdocs serve"
setup = "python -c \"from provide.foundry.config import extract_base_mkdocs; from pathlib import Path; extract_base_mkdocs(Path('.'))\""
build = "mkdocs build"
serve = "mkdocs serve"
clean = "rm -rf site .provide"

[tasks.docs.links]
_default = "lychee --offline --verbose --no-progress './docs/**/*.md' './src/**/*.md' './README.md' './.github/**/*.md' './CONTRIBUTING.md' 2>&1 | grep -v 'INFO'"
check = "lychee --offline --verbose --no-progress './docs/**/*.md' './src/**/*.md' './README.md' './.github/**/*.md' './CONTRIBUTING.md' 2>&1 | grep -v 'INFO'"
local = "lychee --offline --verbose --no-progress './docs/**/*.md' './src/**/*.md' './README.md' './.github/**/*.md' './CONTRIBUTING.md' 2>&1 | grep -v 'INFO'"
external = "lychee --verbose --no-progress './docs/**/*.md' './src/**/*.md' './README.md' './.github/**/*.md' './CONTRIBUTING.md'"

[tasks.dev]
setup = "uv sync"
test = "pytest -n auto"
check = "ruff format . && ruff check . && mypy src/"

# ==============================================================================
# Flavorpack-specific tasks
# ==============================================================================

[tasks.helpers]
_default = "./build.sh"
build = "./build.sh"

[tasks.validate]
_default = "cd tests/pretaster && make test"
pspf = "cd tests/pretaster && make test"
full = "cd tests/pretaster && make all"
combo = "cd tests/pretaster && make combo-test"
clean-cache = "cd tests/pretaster && make clean-cache"
logs = "cd tests/pretaster && make show-logs"

[tasks.wheel]
_default = """
PLATFORM=$(python3 -c "import platform; arch = platform.machine().lower(); arch = 'amd64' if arch == 'x86_64' else 'arm64' if arch in ['arm64', 'aarch64'] else arch; os = 'darwin' if platform.system() == 'Darwin' else 'linux' if platform.system() == 'Linux' else 'windows'; print(f'{os}_{arch}')")
python3 tools/build_wheel.py --platform $PLATFORM
"""
universal = "python3 tools/build_wheel.py --platform universal"

[tasks.release]
_default = "python3 tools/build_wheel.py --all"
all = "python3 tools/build_wheel.py --all"
validate = "python3 tools/validate_wheel.py --all"
validate-full = "python3 tools/validate_wheel.py --all --full"
clean = """
rm -rf dist/ build/ *.egg-info src/flavor.egg-info
rm -rf dist/bin
find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
echo "✨ Release artifacts cleaned"
"""
upload = """
if [ -z "$(ls -A dist/*.whl 2>/dev/null)" ]; then
  echo "❌ No wheels found in dist/"
  echo "Run 'we release all' first"
  exit 1
fi
echo "📤 Uploading to PyPI..."
twine upload dist/*.whl
"""
upload-test = """
if [ -z "$(ls -A dist/*.whl 2>/dev/null)" ]; then
  echo "❌ No wheels found in dist/"
  echo "Run 'we release all' first"
  exit 1
fi
echo "📤 Uploading to TestPyPI..."
twine upload --repository testpypi dist/*.whl
"""
test = """
echo "🧪 Testing release process..."
./build.sh
PLATFORM=$(python3 -c "import platform; arch = platform.machine().lower(); arch = 'amd64' if arch == 'x86_64' else 'arm64' if arch in ['arm64', 'aarch64'] else arch; os = 'darwin' if platform.system() == 'Darwin' else 'linux' if platform.system() == 'Linux' else 'windows'; print(f'{os}_{arch}')")
echo "Testing with platform: $PLATFORM"
python3 tools/build_wheel.py --platform $PLATFORM
python3 tools/validate_wheel.py --all --full
"""
