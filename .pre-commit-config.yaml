repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff-format
        name: ruff format
      - id: ruff
        name: ruff lint
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        additional_dependencies: ["tomli"]

  - repo: local
    hooks:
      # ── Python ─────────────────────────────────────────────────────────
      - id: mypy
        name: mypy strict
        entry: bash -c 'uv run mypy src/flavor && uv run mypy tests/ --exclude "tests/(taster|pretaster|assets)/"'
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: bandit
        name: bandit
        entry: bandit -r src -ll
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      # ── Go ─────────────────────────────────────────────────────────────
      - id: go-fmt
        name: go fmt
        entry: bash -c 'cd src/flavor-go && gofmt -l . | grep . && exit 1 || exit 0'
        language: system
        pass_filenames: false
        always_run: true
        files: ^src/flavor-go/

      - id: go-vet
        name: go vet
        entry: bash -c 'cd src/flavor-go && go vet ./...'
        language: system
        pass_filenames: false
        always_run: true
        files: ^src/flavor-go/

      - id: go-build
        name: go build
        entry: bash -c 'cd src/flavor-go && go build ./...'
        language: system
        pass_filenames: false
        always_run: true
        files: ^src/flavor-go/

      - id: go-test
        name: go test
        entry: bash -c 'cd src/flavor-go && go test ./...'
        language: system
        pass_filenames: false
        always_run: true
        files: ^src/flavor-go/

      # ── Rust ───────────────────────────────────────────────────────────
      - id: rust-fmt
        name: cargo fmt
        entry: bash -c 'cd src/flavor-rs && cargo fmt --check'
        language: system
        pass_filenames: false
        always_run: true
        files: ^src/flavor-rs/

      - id: rust-clippy
        name: cargo clippy
        entry: bash -c 'cd src/flavor-rs && cargo clippy -- -D warnings'
        language: system
        pass_filenames: false
        always_run: true
        files: ^src/flavor-rs/

      - id: rust-test
        name: cargo test
        entry: bash -c 'cd src/flavor-rs && RUST_TEST_THREADS=1 cargo test'
        language: system
        pass_filenames: false
        always_run: true
        files: ^src/flavor-rs/

      # ── Cross-language ─────────────────────────────────────────────────
      - id: version-sync
        name: version sync check
        entry: python scripts/check_version_sync.py
        language: system
        pass_filenames: false
        always_run: true
        files: (VERSION|Cargo\.toml|main\.go|version\.rs|pyproject\.toml)$
